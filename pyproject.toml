[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-football-ml"
version = "0.1.0"
description = "Position-specific NFL prediction, evaluation, and serving tools"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "nflreadpy==0.1.5",
    "polars==1.44.2",
    "scikit-learn==1.9.0",
    "scipy==1.18.1",
    "matplotlib==3.11.1",
    "joblib==1.6.0",
    "flask==3.1.3",
    "gunicorn==26.2.0",
    "lightgbm==4.7.0",
    "mord==0.7",
    "shap>=0.52.0,<0.53",
    "appdirs==1.4.4",
    "requests==2.34.2",
    "boto3==1.43.91",
    "markdown==3.10.3",
    "bleach==6.4.0",
]

[project.scripts]
ff-benchmark = "src.benchmarking.benchmark:main"
ff-ab = "src.tuning.ab_harness:main"
ff-cohorts = "src.analysis.cohort_analysis:main"
ff-scope = "src.scripts.scope_positions:main"
ff-contract-export = "src.contracts.export:main"
ff-dependencies = "src.packaging.dependencies:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.serving" = ["templates/*.html", "static/**/*", "*.json"]
"src.prediction" = ["*.json"]

# Canonical dependency declarations. requirements*.txt and the Batch manifest
# are generated by python -m src.packaging.dependencies; variants retain their
# existing wheel indexes and exact pins. Tool groups contain names, not copies.
[tool.ffp.dependencies]
serving = ["numpy", "pandas", "pyarrow", "flask", "gunicorn", "requests", "boto3", "markdown", "bleach"]
batch = ["numpy", "pandas", "pyarrow", "nflreadpy", "polars", "scikit-learn", "scipy", "matplotlib", "joblib", "lightgbm", "mord", "boto3", "optuna"]
torch-version = "2.14.0"
cuda-variant = "cu130"
cpu-index = "https://download.pytorch.org/whl/cpu"
cuda-index = "https://download.pytorch.org/whl/cu130"

[dependency-groups]
tools = [
    "pytest==9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.16.6",
    "optuna==5.0.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: fast unit tests (<1s each)",
    "integration: multi-component tests (<10s)",
    "e2e: full-pipeline tests (<60s)",
    "regression: model quality thresholds",
    "slow: excluded from default run",
]
timeout = 60
timeout_method = "thread"
addopts = "--strict-markers -n auto --dist=loadfile"
filterwarnings = [
    # mord 0.7 calls scipy's L-BFGS-B with disp/iprint kwargs that scipy 1.17
    # marked for removal in 1.18. Upstream fix pending; silence to keep test
    # output clean.
    "ignore:.*L-BFGS-B solver are deprecated:DeprecationWarning",
]
testpaths = ["tests"]

# coverage.py>=7.4 on Python 3.12+ supports a sys.monitoring (PEP 669) backed
# core that's substantially cheaper than the default sys.settrace path. We
# don't request branch coverage anywhere (codecov.yml only asks for lines), so
# the sysmon limitation around branches doesn't apply.
[tool.coverage.run]
core = "sysmon"
branch = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "data", "outputs", "analysis_output", "infra",
    "docs", "src/serving/static", "src/serving/templates", "src/serving/frontend",
    "models", "notebooks", "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**"                = ["E501", "F401", "F811", "E402", "SIM105", "SIM108", "SIM117"]
"conftest.py"                = ["E402"]
"src/*/config.py"            = ["E402"]
"src/scripts/**/*.py"        = ["E402"]
"src/benchmarking/**/*.py"   = ["T201"]
"src/tuning/**/*.py"         = ["T201"]
"src/analysis/**/*.py"       = ["T201", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
