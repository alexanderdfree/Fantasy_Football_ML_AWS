# XcodeGen spec — generate the Xcode project from this on the Mac:
#   brew install xcodegen
#   cd ios && xcodegen generate && open FFPredictor.xcodeproj
# Authoring is done as plain text (this repo is edited on Linux); only the
# generated .xcodeproj is Mac-side, and it's gitignored (regenerate any time).
name: FFPredictor
options:
  bundleIdPrefix: me.alexfree
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Keep Swift-5 concurrency checking (avoids a wall of Sendable errors); the
    # app is read-only and @MainActor-isolated where it matters.
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  FFPredictor:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: me.alexfree.ffpredictor
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  FFPredictorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: FFPredictor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: me.alexfree.ffpredictor.tests
schemes:
  FFPredictor:
    build:
      targets:
        FFPredictor: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FFPredictorTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
