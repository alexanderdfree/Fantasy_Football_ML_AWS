<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football Predictor</title>
    <script>
        /* Apply the saved color theme before first paint to avoid a flash. */
        try { if (localStorage.getItem("ffp-theme") === "oled") document.documentElement.setAttribute("data-theme", "oled"); } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <!-- Warm the player-headshot CDNs (NFL Cloudinary + ESPN) so the first photo
         fetch skips the cold DNS+TLS handshake. -->
    <link rel="preconnect" href="https://static.www.nfl.com" crossorigin>
    <link rel="preconnect" href="https://a.espncdn.com" crossorigin>
    <link rel="dns-prefetch" href="https://static.www.nfl.com">
    <link rel="dns-prefetch" href="https://a.espncdn.com">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Self-hosted (was cdn.jsdelivr.net/npm/chart.js@4.4.0). A blocked CDN
         left `Chart` undefined, and app.js references it at init, so the whole
         UI's event wiring threw and died. Vendored under static/ to remove the
         external dependency; bump by re-downloading the pinned dist file. -->
    <script src="/static/js/vendor/chart.umd.min.js"></script>
</head>
<body>
    <!-- Static shell shown until the React bundle mounts; main.jsx hides it
         as soon as the app shell is interactive (data streams in afterward
         with the lighter in-view loading indicators). -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Loading models & generating predictions...</p>
            <p class="loading-sub">This may take a moment on first load</p>
        </div>
    </div>

    <!-- The entire dashboard renders here. Source: src/serving/frontend/ (React);
         /static/js/app.js is the committed esbuild bundle — never edit it directly. -->
    <div id="root"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
