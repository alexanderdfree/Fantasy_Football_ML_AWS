# Dependabot configuration — version updates as code.
# Security *alerts* and *security updates* are enabled separately in
# Settings -> Code security (account-level toggle, not a repo file).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Python deps. Pinned in requirements*.txt at the repo root AND in
  # src/batch/requirements.txt (the Batch training container's subset).
  # tests/test_dependency_pins.py enforces that any package present in BOTH
  # requirements.txt and src/batch/requirements.txt carries an identical pin,
  # so the two files must move together. `directories` makes Dependabot watch
  # both locations, and the group below combines a bump into ONE PR spanning
  # both files — without this, Dependabot bumped only the root file and the
  # per-PR drift guard failed (see #878 / #883).
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/src/batch"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # torch is intentionally NOT auto-bumped: its pins carry per-platform local
    # version labels (+cpu / +cu130 in requirements-dev.txt / requirements-gpu.txt
    # / the Dockerfiles) that Dependabot rewrites incorrectly — it broke the GPU
    # wheel twice (#880 flipped +cu128 -> +cpu; #964 flipped the CPU pin to
    # +cu130, uninstallable from the CPU index). torch upgrades are done by hand
    # (see #957). Security alerts still surface in Settings -> Code security.
    ignore:
      - dependency-name: "torch"
    groups:
      # Group all pip updates so a shared package bumps in requirements.txt and
      # src/batch/requirements.txt within the same PR (keeps the drift guard
      # green); root-only packages still ride along in the same grouped PR.
      python-deps:
        patterns:
          - "*"

  # GitHub Actions used by the CI / training / deploy workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
