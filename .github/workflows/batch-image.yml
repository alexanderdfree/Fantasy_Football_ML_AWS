name: Build & Push Batch Training Image

# Builds src/batch/Dockerfile.train, pushes to ECR, and registers a new revision
# of the Batch job definition pinned to the new image digest.
# Only runs on main when the training image surface actually changes.

on:
  push:
    branches: [main]
    # Use negations at the end to skip rebuilds when only tests or docs change.
    # Tests live at tests/ (top-level), outside src/**, so they don't match the
    # positive filter; the !**/tests/** is kept defensively for any future
    # src/**/tests/ tree. _detect-positions.yml's detect job already strips
    # tests before deciding to retrain; this just stops us rebuilding the
    # image on the way there.
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/batch-image.yml"
      # infra/batch/** is included so retry strategy / timeout edits in
      # setup.sh propagate to the deployed job definition on next merge —
      # the registration step below pins canonical values, so setup.sh
      # alone never updates a live account.
      - "infra/batch/**"
      - "!**/tests/**"
      - "!**/*.md"
  workflow_dispatch: {}

# Default GITHUB_TOKEN to read-only at the workflow level. Mirrors the
# hardening M4 applied to tests.yml and _detect-positions.yml. Individual
# jobs that need extra scopes (e.g. contents: read for checkout) re-declare
# explicit minimums below; no job in this file pushes commits, opens PRs,
# or otherwise mutates repo state. Explicit minimum satisfies CodeQL's
# actions/missing-workflow-permissions rule.
permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ff-training
  JOB_DEFINITION: ff-training-job
  # Same bucket train-batch.yml uses. The revision-stash step below writes to
  # s3://${S3_BUCKET}/job-def-revisions/${sha}.txt so train-batch.yml can pin
  # FF_JOB_DEFINITION_REVISION to the revision the image build registered.
  S3_BUCKET: ff-predictor-training

jobs:
  check-docs-only:
    # Subject-line scan for the [docs-only] tag — line 1 of the merge commit
    # plus any `* `-prefixed bullet (squash-merge constituent subjects). The
    # previous flat `contains()` check matched prose mentions in commit
    # bodies, causing both the PR that ADDED the [docs-only] feature
    # (6d0490e2 — its title contains the literal `[docs-only]`) and a perf
    # PR that DESCRIBED the feature in a constituent CI commit's body
    # (e802a47 / PR #293) to skip their own image rebuilds. Moved from a
    # workflow-expression `if:` to a shell-backed leading job because
    # workflow expressions don't support regex or awk. workflow_dispatch
    # bypasses the check (operator-driven re-build).
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.head_commit.id }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Event $EVENT_NAME bypasses [docs-only] check (manual dispatch always builds)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log -1 --format=%B "$MERGE_SHA" | awk 'NR==1 || /^\* /' | grep -qF '[docs-only]'; then
            echo "[docs-only] detected in subject line of $MERGE_SHA — skipping image rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # Tests run in tests.yml (matrix across positions). Branch protection on
  # main requires those checks to pass before a PR can merge, so we trust
  # the merged SHA here and go straight to building the image.
  build-and-push:
    needs: check-docs-only
    if: needs.check-docs-only.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = aws-actions/configure-aws-credentials v4
        # tip as of 2026-05-21.
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = aws-actions/amazon-ecr-login v2 tip as
        # of 2026-05-21.
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419  # v2

      - name: Set up Docker Buildx
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = docker/setup-buildx-action v3 tip as of
        # 2026-05-21.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # Local cache backend persists BuildKit `--mount=type=cache` directories
      # (e.g. uv's wheel cache in Dockerfile.train) across CI runs. The gha
      # backend persists layer cache reliably but not cache mounts
      # (moby/buildkit#1512), so we run both in parallel.
      - name: Cache BuildKit state
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('src/batch/requirements.txt', 'src/batch/Dockerfile.train') }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Build & push training image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"

          # Cold-start opt 2c (docs/batch_design.md): when the operator has
          # created the ECR pull-through cache rule for Docker Hub, route the
          # PyTorch base image through it so subsequent Spot instances pull
          # base layers from inside AWS instead of dockerhub. Auto-detect to
          # keep this safe to merge regardless of whether the rule exists
          # yet — first build without the rule just hits dockerhub directly.
          PULL_THROUGH_ARG=""
          RULE_COUNT=$(aws ecr describe-pull-through-cache-rules \
            --ecr-repository-prefixes dockerhub \
            --region "$AWS_REGION" \
            --query 'length(pullThroughCacheRules)' \
            --output text 2>/dev/null || echo 0)
          if [ "$RULE_COUNT" != "0" ] && [ "$RULE_COUNT" != "None" ]; then
            PULL_THROUGH_ARG="--build-arg=PULL_THROUGH_PREFIX=$ECR_REGISTRY/dockerhub/"
            echo "Pull-through cache 'dockerhub' detected; base image routed through ECR."
          else
            echo "Pull-through cache not configured; base image pulls from dockerhub directly."
          fi

          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --file src/batch/Dockerfile.train \
            $PULL_THROUGH_ARG \
            --cache-from type=gha \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=gha,mode=max \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --tag "$IMAGE_URI:$IMAGE_TAG" \
            --tag "$IMAGE_URI:latest" \
            --push .
          echo "image_uri=$IMAGE_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Swap caches so actions/cache stores the freshly-written one on
      # post-job save, rather than the (now stale) input cache.
      - name: Move BuildKit cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Publish SOCI index for cold-start lazy-loading
        # Cold-start opt 2a (docs/batch_design.md §2a): SOCI v2 (Seekable OCI)
        # lets Batch start the container before the full image is pulled.
        # The ff-gpu-spot Compute Environment runs the soci-snapshotter
        # daemon via the ff-batch-lt launch template (infra/batch/userdata.sh),
        # so a missing/stale index now means a Spot host falls back to
        # ~122s full pull — silent regression. Hence continue-on-error: false.
        #
        # SOCI_VERSION MUST match infra/batch/userdata.sh's pinned version;
        # publisher/consumer version skew breaks lazy-load (manifest format
        # evolves between minor releases).
        continue-on-error: false
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
          SOCI_VERSION: "0.13.0"
        run: |
          set -euo pipefail

          SOCI_TARBALL="soci-snapshotter-${SOCI_VERSION}-linux-amd64.tar.gz"
          curl -sSL -o "/tmp/${SOCI_TARBALL}" \
            "https://github.com/awslabs/soci-snapshotter/releases/download/v${SOCI_VERSION}/${SOCI_TARBALL}"
          sudo tar -xzf "/tmp/${SOCI_TARBALL}" -C /usr/local/bin/ soci
          sudo chmod +x /usr/local/bin/soci

          # ubuntu-latest installs containerd as a Docker dep; systemd may
          # not have started the service yet.
          sudo systemctl start containerd || true

          # soci reads from containerd's content store, not Docker's
          # overlay store. Pull the freshly-pushed image back into
          # containerd so soci can index it.
          ECR_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
          sudo ctr image pull --user "AWS:${ECR_PASSWORD}" "$IMAGE_URI"

          sudo /usr/local/bin/soci create "$IMAGE_URI"
          sudo /usr/local/bin/soci push --user "AWS:${ECR_PASSWORD}" "$IMAGE_URI"

          echo "Published SOCI index for $IMAGE_URI"

      - name: Register new job definition revision
        # Gated behind BATCH_ACTIVE so Batch can ride on the image path while
        # the active trainer is the 24/7 EC2 instance (docs/ec2_design.md).
        # Flip the repo variable BATCH_ACTIVE=true to re-sync the job definition.
        if: vars.BATCH_ACTIVE == 'true'
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          # Pull the current definition, replace the image, re-register as a
          # new revision. Never deregisters existing revisions, so operator
          # rollback is always possible.
          aws batch describe-job-definitions \
            --job-definition-name "$JOB_DEFINITION" \
            --status ACTIVE \
            --max-results 1 \
            --region "$AWS_REGION" > current.json

          # retryStrategy + timeout are HARDCODED here, not carried forward
          # from the existing definition. This file is the source of truth;
          # any change here propagates on the next image push. Keep these
          # values in sync with infra/batch/setup.sh (the seed for brand-new
          # accounts only — once a definition exists, this workflow owns it).
          # Mirrors src/batch/launch.py's per-submission RETRY_STRATEGY so
          # all paths into this job definition (launch.py, manual aws batch
          # submit-job, future tools) see the same retry behaviour. Update
          # all three together.
          RETRY_STRATEGY='{
            "attempts": 3,
            "evaluateOnExit": [
              {"onStatusReason": "Host EC2*", "action": "RETRY"},
              {"onReason": "CannotPullContainerError*", "action": "RETRY"},
              {"onReason": "*", "action": "EXIT"}
            ]
          }'
          TIMEOUT='{"attemptDurationSeconds": 1800}'

          # Two clusters of env vars are pinned at the job-definition level so
          # every Batch run inherits them (per-submission containerOverrides in
          # src/batch/launch.py still append/override on top of these).
          #
          # 1. NN_DATALOADER_NUM_WORKERS=3 — src/shared/training.py reads it; on
          #    g4dn.xlarge with 4 vCPU, 3 prefetch workers keep the GPU fed for
          #    attention training while leaving one core for the CPU branch
          #    overlapped via the ThreadPoolExecutor introduced in 00c6d10.
          #
          # 2. OMP_NUM_THREADS=1 / MKL_NUM_THREADS=1 / OPENBLAS_NUM_THREADS=1 /
          #    NUMEXPR_NUM_THREADS=1 — cap BLAS-via-OMP threads to 1 *per
          #    process*, not per Batch host. Required because:
          #      • src/shared/pipeline.py:_tune_ridge_alphas_cv runs alphas
          #        through joblib.Parallel(n_jobs=-1, prefer="threads") — 4
          #        threads on a 4-vCPU box.
          #      • Each sklearn Ridge solve delegates the normal-equation
          #        solve to BLAS, which defaults to OMP_NUM_THREADS=nproc=4.
          #      • 4 joblib threads × 4 BLAS threads each + 3 DataLoader
          #        worker subprocesses + main GPU thread = ~19 thread slots
          #        on 4 cores. The CPU branch hangs in OpenBLAS under that
          #        ~5x oversubscription on Linux.
          #    PR #293 (BF16 autocast) masked this by hanging the GPU branch
          #    first, so CPU branch had the cores to itself. PR #301 fixed the
          #    BF16 hang → CPU and GPU branches now actually overlap, exposing
          #    the BLAS oversubscription as a ridge_tune wedge that wasted ~25
          #    min/Batch run before this fix. Single-threaded BLAS + 4 joblib
          #    threads = exact 4-core fan-out, no overcommit. Verified on T4
          #    in a single DST job with these caps: ridge_tune=6.1s,
          #    attn_nn_train=87.8s (better than PR #293's 110s target),
          #    total=225s. With no caps DST hung indefinitely in ridge_tune.
          jq --arg image "$IMAGE_URI" \
             --argjson retry "$RETRY_STRATEGY" \
             --argjson timeout "$TIMEOUT" '
            .jobDefinitions[0] as $d |
            {
              jobDefinitionName: $d.jobDefinitionName,
              type: $d.type,
              containerProperties: (
                $d.containerProperties
                | .image = $image
                | .environment = (
                    ((.environment // []) | map(select(
                      .name != "NN_DATALOADER_NUM_WORKERS"
                      and .name != "OMP_NUM_THREADS"
                      and .name != "MKL_NUM_THREADS"
                      and .name != "OPENBLAS_NUM_THREADS"
                      and .name != "NUMEXPR_NUM_THREADS"
                    )))
                    + [
                        {name: "NN_DATALOADER_NUM_WORKERS", value: "3"},
                        {name: "OMP_NUM_THREADS", value: "1"},
                        {name: "MKL_NUM_THREADS", value: "1"},
                        {name: "OPENBLAS_NUM_THREADS", value: "1"},
                        {name: "NUMEXPR_NUM_THREADS", value: "1"}
                      ]
                  )
              ),
              retryStrategy: $retry,
              timeout: $timeout,
              platformCapabilities: ($d.platformCapabilities // []),
              propagateTags: ($d.propagateTags // false),
              tags: ($d.tags // {})
            } | with_entries(select(.value != null and .value != "" and .value != []))
          ' current.json > new.json

          REVISION=$(aws batch register-job-definition \
            --cli-input-json file://new.json \
            --region "$AWS_REGION" \
            --query 'revision' \
            --output text)
          echo "Registered new revision of $JOB_DEFINITION: revision $REVISION"

          # Stash the revision number under a SHA-keyed S3 path so the
          # downstream train-batch workflow can pin its submissions to this
          # specific revision (FF_JOB_DEFINITION_REVISION in src/batch/launch.py).
          # Without this, AWS Batch resolves bare job-definition names to the
          # newest active revision at submit time, so two parallel image-builds
          # registering revisions in the same window can cause one workflow run
          # to silently train the other's image.
          echo -n "$REVISION" > /tmp/revision.txt
          aws s3 cp /tmp/revision.txt \
            "s3://${S3_BUCKET}/job-def-revisions/${GITHUB_SHA}.txt" \
            --region "$AWS_REGION" \
            --no-cli-pager
          echo "Stashed revision $REVISION at s3://${S3_BUCKET}/job-def-revisions/${GITHUB_SHA}.txt"
