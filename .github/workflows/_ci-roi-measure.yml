name: CI ROI measurement cell
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      variant:
        type: string
        required: true
      sample:
        type: number
        required: true
      source_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ${{ inputs.image == 'training' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.variant == 'baseline' && '66514437c5940d88dcfd1090e07592ad5c8b99c3' || inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Prepare isolated cache and source identity
        id: probe
        env:
          IMAGE: ${{ inputs.image }}
          VARIANT: ${{ inputs.variant }}
          SAMPLE: ${{ inputs.sample }}
        run: |
          python3 harness/.github/scripts/ci_image_cache_benchmark.py prepare \
            --image "$IMAGE" --variant "$VARIANT" --sample "$SAMPLE"
      - name: Restore local image cache
        id: local-cache
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ci-roi-local-${{ github.run_id }}-${{ inputs.image }}
          fail-on-cache-miss: ${{ inputs.sample != 0 }}
      - name: Verify local cache regime
        env:
          SAMPLE: ${{ inputs.sample }}
          CACHE_HIT: ${{ steps.local-cache.outputs.cache-hit }}
        run: |
          if [ "$SAMPLE" = 0 ]; then
            test "$CACHE_HIT" != true
          else
            test "$CACHE_HIT" = true
          fi
      - name: Build comparison image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./source
          file: source/${{ inputs.image == 'training' && 'src/batch/Dockerfile.train' || 'Dockerfile' }}
          platforms: ${{ inputs.image == 'training' && 'linux/amd64' || 'linux/arm64' }}
          push: false
          provenance: false
          tags: ci-roi:${{ inputs.image }}
          build-args: |
            TRAIN_GIT_SHA=${{ steps.probe.outputs.source_sha }}
            PULL_THROUGH_PREFIX=
          cache-from: ${{ steps.probe.outputs.cache_from }}
          cache-to: ${{ steps.probe.outputs.cache_to }}
          outputs: type=oci,dest=${{ runner.temp }}/ci-image.tar
      - name: Complete local cache export
        if: steps.probe.outputs.export_cache == 'true'
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Verify exported image and capture metadata
        env:
          BUILD_METADATA: ${{ steps.image.outputs.metadata }}
          IMAGE_ARCHIVE: ${{ runner.temp }}/ci-image.tar
        run: |
          python3 -c 'import os; from pathlib import Path; Path("build-metadata.json").write_text(os.environ["BUILD_METADATA"])'
          python3 harness/.github/scripts/ci_image_cache_benchmark.py inspect --archive "$IMAGE_ARCHIVE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-roi-${{ inputs.variant }}-${{ inputs.image }}-${{ inputs.sample }}
          path: |
            measurement.json
            build-metadata.json
          retention-days: 14
