name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Docs-only PRs no longer need a separate workflow to emit a green
# `tests-pass`: the `detect` job below strips docs files from the diff
# and emits an empty matrix when nothing else changed, the test job is
# skipped, and the `tests-pass` aggregator treats `skipped` as success.
# A previous `tests-skip.yml` covered this case via a positive paths
# filter — that file was removed in favor of unified detect handling.

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # pytorch CPU index hosts older numpy/etc; fall through to PyPI like pip does.
  UV_INDEX_STRATEGY: unsafe-best-match

# Default GITHUB_TOKEN to read-only at the workflow level. None of the jobs in
# this file push commits, comment on PRs, or otherwise mutate repo state —
# they only check out source, install deps, and run tests. Explicit minimum
# satisfies CodeQL's actions/missing-workflow-permissions rule.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
      # major version comment. SHA = astral-sh/setup-uv v6.8.0.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - run: uv pip install --system ruff==0.15.16
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  detect:
    # Decide which shards to run so a PR touching only e.g. `src/qb/` doesn't
    # spin up all 7 shards. Mirrors train-ec2.yml's detect job in spirit:
    # global infrastructure changes fan out to all shards; per-position
    # changes scope down. Default to "all 7" on uncertainty.
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Need history to diff against the merge base / previous commit.
          fetch-depth: 0

      - id: scope
        run: |
          set -eu
          # Scope this change to the PR's OWN commits — not the full range
          # between the PR's base and HEAD.
          #
          # On a pull_request event, actions/checkout checks out the synthetic
          # merge commit refs/pull/N/merge ("Merge <pr-head> into <main-tip>").
          # Its first parent (HEAD^1) is the *current* main tip and its second
          # parent (HEAD^2) is the PR head, so the PR's own commits are exactly
          # those reachable from HEAD^2 but not HEAD^1 — independent of how far
          # main has advanced past the PR's base.
          #
          # We deliberately do NOT use github.event.pull_request.base.sha. It
          # pins to the base recorded when the event fired, which lags the live
          # main tip, so `base.sha..HEAD` sweeps in EVERY commit merged to main
          # after this PR's base. If any of those unrelated commits carries a
          # `[docs-only]` subject, the scan below would emit shards=[] and skip
          # this PR's entire test fan-out while `tests-pass` still reports
          # green: a false green. PR #367 hit exactly this on 2026-05-29 when
          # PR #368's `[docs-only]` commit (0a17b4e) landed on main mid-review
          # and fell inside 39aa8a6..<#367 merge head>. See TODO.md's archive.
          if git rev-parse --verify "HEAD^2" >/dev/null 2>&1; then
            # Merge commit: pull_request event (or a real merge pushed to main).
            commit_args=(HEAD^2 --not HEAD^1)
            diff_args=(HEAD^1...HEAD^2)
          elif git rev-parse --verify "HEAD~1" >/dev/null 2>&1; then
            # Linear history: push to main after a squash merge, or a PR whose
            # merge commit couldn't be computed (checkout falls back to the PR
            # head). Scan the single new commit against its parent.
            commit_args=(HEAD~1..HEAD)
            diff_args=(HEAD~1 HEAD)
          else
            # Root commit / no parent to diff against — run the full matrix.
            echo 'shards=["QB","RB","WR","TE","K","DST","serving","shared"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Opt-in: any commit in the range whose subject line contains
          # `[docs-only]` signals the author asserts the diff has no
          # behavioural impact (comment / docstring / import-reorder only).
          # The default detect logic treats those as substantive because
          # they touch .py files; this tag is the escape hatch. lint +
          # detect still run as cheap sanity gates; only the per-shard
          # test fan-out is skipped. `tests-pass` below treats
          # `test=skipped` as success. Trust contract — CI cannot verify
          # the assertion, the author owns correctness.
          #
          # Per-commit subject-line scan only — the awk filter keeps line 1
          # and any `* `-prefixed bullet (squash-merge constituent subjects)
          # and drops prose body lines. Previous flat-grep against the whole
          # %B range false-positived on commits that *described* the
          # [docs-only] mechanism in prose. Iterating per-commit (rather than
          # cat'ing the whole range into one stream) prevents a body line of
          # commit N+1 looking like a subject of commit N due to lack of
          # separators in `git log --format=%B`.
          docs_only=false
          for sha in $(git log --format=%H "${commit_args[@]}"); do
            if git log -1 --format=%B "$sha" | awk 'NR==1 || /^\* /' | grep -qF '[docs-only]'; then
              docs_only=true
              break
            fi
          done
          if [ "$docs_only" = "true" ]; then
            echo 'shards=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "${diff_args[@]}")
          shards=$(printf '%s\n' "$files" | python3 -m src.scripts.scope_positions --mode test)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  test:
    needs: detect
    # The detect step always emits at least one shard for code changes (it
    # falls back to all 7 on uncertainty), but guard against an empty list
    # so a future detect-rule bug surfaces as a skip rather than a crash.
    if: needs.detect.outputs.shards != '[]'
    runs-on: ubuntu-latest
    # DIAGNOSTIC bound: a healthy shard finishes in <5 min; the faulthandler_timeout
    # (180s) only DUMPS a hung test's threads, it does not kill it. This caps total
    # job time so a true hang is terminated minutes after the dump lands in the log,
    # not at the 360-min GHA default. Drop back to the implicit default once the flake
    # is root-caused.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.detect.outputs.shards) }}
    env:
      # E2E / reproducibility tests need data/splits/*.parquet, which CI does
      # not yet build (see tests/_skip_helpers.py::require_splits). Without
      # this flag those tests would fail loudly in CI; with it they skip
      # silently, matching the historical behavior. Remove the moment a CI
      # data step is wired up — that's the whole point of the latent guard.
      ALLOW_SKIP_E2E: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = astral-sh/setup-uv v6.8.0.
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      # data/raw/ is gitignored (28 MB of player stats). The pipeline_e2e +
      # regression tests load data/raw/schedules_2012_2025.parquet via
      # src.shared.weather_features and src.features.engineer. Fetch it through
      # the nfl_source shim (same call src/data/loader.load_raw_data uses) and
      # cache across CI runs since completed-season schedules don't change.
      - name: Cache schedule parquet across CI runs
        id: sched-cache
        uses: actions/cache@v5
        with:
          path: data/raw/schedules_2012_2025.parquet
          # v2: schedules now sourced via nflreadpy, not nfl_data_py.
          key: schedules-2012-2025-v2

      - name: Download schedule parquet via nflreadpy (cache miss)
        if: steps.sched-cache.outputs.cache-hit != 'true'
        env:
          NFLREADPY_CACHE: "off"  # data/raw is the authoritative cache
        run: |
          mkdir -p data/raw
          python - <<'PY'
          from src.data import nfl_source
          sched = nfl_source.schedules(list(range(2012, 2026)))
          sched.to_parquet('data/raw/schedules_2012_2025.parquet')
          print(f'Wrote schedules: {len(sched)} rows')
          PY

      - name: Resolve shard test paths and coverage flags
        id: shard
        run: |
          shard="${{ matrix.shard }}"
          # Root cause of the "node down: Not properly terminated" flake (#1056): CUMULATIVE
          # OOM, not a single bad test. Diagnosed via faulthandler + per-worker crash reports
          # (PR #1057): crashes always land at ~99% (the heavy training/feature tests cluster
          # at the tail), with NO faulthandler dump (so SIGKILL = kernel OOM, not a segfault or
          # >180s hang), and on the `shared` shard TWO workers died within 2s of each other (a
          # global memory-ceiling event). The driver is NESTED parallelism: each xdist worker
          # that trains a pipeline spawns ~nproc joblib/loky CV worker processes (~0.6 GiB
          # each, measured); `-n auto` = 4 xdist workers on a 4-vCPU runner, so 4 trainings can
          # peak together (~18 GiB measured local extrapolation) and overrun the runner.
          #
          # Fix: run the training-heavy shards at `-n 2` so at most 2 trainings peak at once
          # (~9 GiB), keeping headroom. (NOT the same as the earlier reverted `-n 2` attempt:
          # that predated the serving-shard split, so `shared` still carried the heavy
          # test_app* model-LOADING suite. Post-split, `-n 2` halves a now-isolated lighter
          # training load -- local measurement: RB shard peak 3.57 GiB @ -n2 vs 5.49 GiB @ -n4.)
          # conftest.py already caps math threads to 1/worker, so 2 workers don't oversubscribe.
          if [ "$shard" = "serving" ]; then
            # Serving suite (tests/test_app*, ~219 Flask/model-LOADING tests), own shard
            # (#1056). No module-scoped trained fixtures and no pipeline TRAINING -> not an OOM
            # source; -n auto + worksteal is safe (sidesteps the loadfile replacement-worker
            # KeyError) and proven green.
            echo "paths=tests/test_app*.py" >> "$GITHUB_OUTPUT"
            echo "cov=--cov=src.serving --cov=src" >> "$GITHUB_OUTPUT"
            echo "dist=worksteal" >> "$GITHUB_OUTPUT"
            echo "jobs=auto" >> "$GITHUB_OUTPUT"
          elif [ "$shard" = "shared" ]; then
            # tests/ root + shared/batch/scripts; ignore per-position dirs (own shards) AND
            # the serving suite (its own shard). loadfile keeps tests/test_pipeline_e2e.py
            # (module fixture, 6 pipelines) on ONE worker so each position trains once.
            echo "paths=tests/ --ignore=tests/qb --ignore=tests/rb --ignore=tests/wr --ignore=tests/te --ignore=tests/k --ignore=tests/dst --ignore-glob=tests/test_app*.py" >> "$GITHUB_OUTPUT"
            echo "cov=--cov=src" >> "$GITHUB_OUTPUT"
            echo "dist=loadfile" >> "$GITHUB_OUTPUT"
            echo "jobs=2" >> "$GITHUB_OUTPUT"
          else
            shard_lower=$(echo "$shard" | tr '[:upper:]' '[:lower:]')
            echo "paths=tests/${shard_lower}/" >> "$GITHUB_OUTPUT"
            echo "cov=--cov=src.${shard_lower} --cov=src" >> "$GITHUB_OUTPUT"
            # loadfile: per-position module-scoped trained fixtures (test_regression.py +
            # test_pipeline_e2e.py) must stay on one worker.
            echo "dist=loadfile" >> "$GITHUB_OUTPUT"
            echo "jobs=2" >> "$GITHUB_OUTPUT"
          fi

      - name: Show runner CPU + memory topology
        # Record the runner's real vCPU/core split AND total RAM so the -n2 OOM-headroom math
        # (jobs above) is grounded and future-tunable. The flake is a memory ceiling, so RAM is
        # the key number; nproc sets how many joblib/loky CV procs each training worker spawns.
        run: |
          echo "nproc=$(nproc)"
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)' || true
          free -h || true
          grep -E 'MemTotal|MemAvailable' /proc/meminfo || true

      - name: Run tests
        # `-n ${jobs}` is the OOM fix (2 for training shards, auto for serving; see the shard
        # step). The rest is retained safety instrumentation so any FUTURE worker death is
        # self-diagnosing instead of an opaque "node down":
        #   * PYTHONFAULTHANDLER=1 + faulthandler_timeout=180 -> dump C+Python thread stacks on
        #     a fatal signal or a >180s C-level hang (a clean SIGKILL/OOM leaves no dump, which
        #     itself distinguishes OOM from segfault/hang).
        #   * --max-worker-restart=0 -> a crashed worker fails fast (no replacement-restart
        #     hang) and xdist names the test it was running.
        # Threads stay 1/worker (conftest). The job-level timeout-minutes caps a true hang.
        env:
          PYTHONFAULTHANDLER: "1"
        run: >-
          python -m pytest
          ${{ steps.shard.outputs.paths }}
          -n ${{ steps.shard.outputs.jobs }} --dist=${{ steps.shard.outputs.dist }}
          --max-worker-restart=0
          -o faulthandler_timeout=180
          -ra
          --durations=25
          ${{ steps.shard.outputs.cov }}
          --cov-report=xml:coverage-${{ matrix.shard }}.xml
          --junitxml=junit-${{ matrix.shard }}.xml

      # Pre-trust the Codecov CLI signing key so `gpg --verify` inside
      # codecov-action doesn't emit "WARNING: This key is not certified
      # with a trusted signature!" on every upload. The action imports the
      # key but never assigns ownertrust; we do that here once per job.
      # continue-on-error: this is purely cosmetic (warning suppression) and
      # depends on keybase.io being reachable — the codecov uploads it supports
      # are already fail_ci_if_error:false, so a keybase outage must NOT fail
      # the whole test job (it was blocking every PR during a 2026-06 outage).
      - name: Trust Codecov CLI verification key
        continue-on-error: true
        run: |
          set -euo pipefail
          KEY=$(curl -fsSL https://keybase.io/codecovsecurity/pgp_keys.asc)
          echo "$KEY" | gpg --import
          FPR=$(echo "$KEY" | gpg --show-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          echo "${FPR}:6:" | gpg --import-ownertrust

      - name: Upload coverage to Codecov
        # Codecov uploads must never fail the test job: dependabot branches get
        # no CODECOV_TOKEN (the CLI's "commit creating" auth step then errors on
        # protected branches), codecov infra can also flake, and the real
        # coverage gate is codecov's own commit status, not this step's exit
        # code. fail_ci_if_error:false does NOT cover that auth error, so guard
        # the whole step (mirrors the "Trust Codecov CLI verification key" step).
        continue-on-error: true
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = codecov/codecov-action v6 tip as of
        # 2026-05-21.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-${{ matrix.shard }}.xml
          flags: ${{ matrix.shard }}
          report_type: coverage
          disable_search: true
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        # Same rationale as the coverage upload above: never fail the job on a
        # Codecov upload/auth error (dependabot has no token; infra can flake).
        continue-on-error: true
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = codecov/codecov-action v6 tip as of
        # 2026-05-21.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit-${{ matrix.shard }}.xml
          flags: ${{ matrix.shard }}
          report_type: test_results
          disable_search: true
          fail_ci_if_error: false

  # Single aggregator check for branch protection. `detect` emits an empty
  # matrix when only docs/markdown/license files changed, so the `test`
  # job is skipped and this aggregator reports green without running any
  # shard. Branch protection should require `tests-pass` instead of the
  # individual shard names.
  tests-pass:
    name: tests-pass
    runs-on: ubuntu-latest
    needs: [lint, detect, test]
    if: always()
    steps:
      - name: Aggregate matrix result
        run: |
          # `test.result` is "success" when all matrix entries pass and
          # "skipped" when detect narrowed the matrix to zero shards (or a
          # future detect-rule bug). Both are acceptable; we only fail
          # `tests-pass` on a real lint or matrix failure. `detect` itself
          # must succeed — a detect failure means we cannot trust the
          # matrix decision.
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "::error::lint failed: ${{ needs.lint.result }}"
            exit 1
          fi
          if [[ "${{ needs.detect.result }}" != "success" ]]; then
            echo "::error::detect failed: ${{ needs.detect.result }}"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" && "${{ needs.test.result }}" != "skipped" ]]; then
            echo "::error::test matrix failed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All required jobs passed (test=${{ needs.test.result }})."
