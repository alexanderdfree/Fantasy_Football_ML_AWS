name: Refresh data splits in S3

# Workflow that regenerates ``data/splits/{train,val,test}.parquet`` from
# nflverse + PBP and uploads the result to s3://ff-predictor-training/data/.
#
# Fires on:
#   - workflow_dispatch (manual, with optional kick_off_train chain)
#   - push to main when a path-filtered file changes (per-position config or
#     src/data/** or this workflow file)
#
# Every triggered run does the full ~10 min regen. There is intentionally
# no "is regen needed?" smart-skip layer here: the only authoritative drift
# detector lives in ``src/features/engineer.py::build_game_history_arrays``
# (PR #328's guard), which can only run at training time *after*
# ``engineer.py`` has merged its derived cols (weather_features,
# team_box_score, contextual builders, game-script HHI/share, etc.) onto
# the per-position df. PR #329 + #332's verify step tried to derive that
# answer from the position-config union against the parquet schema and was
# permanently over-strict — see the TODO.md Fixed archive entry. The
# trade-off here is ~30 min/week of wasted CI on no-op auto-fires (PRs that
# touch a filtered path without adding a new col) in exchange for never
# false-positive-failing the upload step.
#
# Origin: PR #235 (2026-05-20) added 5 redzone per-game cols to RB's
# attn_history_stats; the splits parquet wasn't refreshed; every subsequent
# RB Batch job failed smoke_test with a state_dict shape mismatch and
# manifest.stable stayed pinned at the May 20 artifact for ~24 h. This
# workflow plus PR #328's build_game_history_arrays fail-loud guard close
# the loop: a config-change PR auto-triggers this workflow to ship the
# matching splits, then train-batch.yml fires independently via the
# batch-image.yml chain.

on:
  workflow_dispatch:
    inputs:
      kick_off_train:
        description: "Rebuild image + retrain (via batch-image.yml; respects BATCH_ACTIVE) after upload"
        type: boolean
        default: false
  push:
    branches: [main]
    # Auto-fire on any merge that *could* change the required column set in
    # data/splits/*.parquet. The smart-skip step inside the job reads the
    # current S3 splits' parquet schema and short-circuits if S3 already has
    # every column the configs ask for, so a path-filtered fire on a PR that
    # only edited a hyperparameter / docstring / comment costs ~1-2 min of
    # CI (checkout + uv install + footer read), not the full ~10 min regen.
    #
    # Skill-position configs only (QB/RB/WR/TE) — K and DST have their own
    # data paths (src/k/data.py, src/dst/data.py) that don't touch
    # data/splits/, so their config edits are out of scope for this
    # workflow. The smart-skip step below mirrors the same scoping.
    #
    paths:
      - "src/qb/config.py"
      - "src/rb/config.py"
      - "src/wr/config.py"
      - "src/te/config.py"
      - "src/data/**"
      # engineer.py can change the split parquet column set consumed by
      # position configs, so feature-pipeline edits must refresh S3 splits.
      - "src/features/**"
      # Self-edit trigger: a path-filter change in this file takes effect on
      # its own merge, no separate manual dispatch needed.
      - ".github/workflows/refresh-splits.yml"

concurrency:
  # Same-ref dispatches serialize so two operators can't race each other into
  # a half-uploaded S3 state; different refs (rare) get independent runs.
  group: refresh-splits-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ff-predictor-training
  ECS_CLUSTER: fantasy-cluster
  ECS_SERVICE: fantasy-service
  # Mirrors tests.yml / train-batch.yml — uv otherwise refuses to fall
  # through the PyTorch CPU index for transitive deps that exist on multiple
  # registries (e.g. `requests`).
  UV_INDEX_STRATEGY: unsafe-best-match

permissions:
  contents: read
  # ``actions: write`` is needed only for the optional ``kick_off_train``
  # step's ``gh workflow run batch-image.yml`` call. Scoped to this workflow.
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # AWS creds + the pending race-gate marker go FIRST (right after checkout)
      # so the marker lands ~30s in. Sitting behind setup-python + the uv
      # install (~2-3 min) re-opened the train-batch race: the batch-image
      # build (~9 min) could let Batch jobs download stale splits before the
      # marker existed (#857).
      # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
      # major version comment. SHA = aws-actions/configure-aws-credentials v4
      # tip as of 2026-05-21.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mark splits-rebuild pending (train-batch race gate)
        # train-batch.yml downloads splits from S3 and races this ~10 min
        # rebuild — the batch-image build that gates train (~9 min) is shorter,
        # so without a gate the Batch jobs download last-commit's splits and
        # train one commit behind (the #383 nflreadpy migration only landed on
        # a later manual retrain — see TODO.md). Write a per-SHA "pending"
        # marker BEFORE the rebuild so train's gate knows a rebuild is in
        # flight for this commit and waits for the matching "ready" marker
        # (written after the S3 upload below). Keyed by github.sha — the same
        # identifier train-batch sees as workflow_run.head_sha (the SHA its
        # image was built from), matching the job-def-revisions/${SHA}.txt
        # convention. Best-effort (|| true): a marker-write failure must not
        # fail the refresh; train's gate is fail-safe (proceeds on absence).
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" | aws s3 cp - \
            "s3://${S3_BUCKET}/splits-rebuild-markers/pending/${GITHUB_SHA}.txt" \
            --region "${AWS_REGION}" --no-cli-pager || true

      # Python toolchain comes after the race-gate marker (above) so the marker
      # isn't blocked behind the ~2-3 min install; the regenerate step below is
      # the first consumer of the deps.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
      # major version comment. SHA = astral-sh/setup-uv v6.8.0.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Regenerate splits from nflverse + PBP
        # ``load_raw_data`` pulls weekly stats / rosters / schedules / snap
        # counts / injuries / depth charts / PBP for SEASONS via nflreadpy,
        # caches to ``data/raw/``, and merges the redzone PBP aggregates onto
        # the weekly frame. ``preprocess`` does the standard cleanup;
        # ``build_features`` materialises the ~150 engineered cols (rolling_*,
        # ewma_*, trend_*, prior_season_*, opp_*, contextual, pos one-hots)
        # that every position's ``include_features`` whitelist references;
        # ``temporal_split`` writes ``data/splits/{train,val,test}.parquet``
        # with the chronological train/val/test boundaries from
        # ``src.config``. Both ``data/raw/`` and ``data/splits/`` are created
        # by the producers (load_raw_data + temporal_split), so no pre-mkdir.
        #
        # The ``build_features`` step was missing from this block when the
        # workflow was added in PR #329 — the previous splits parquet (Apr
        # 27) had been generated by an earlier process that did call
        # ``build_features``, so the gap stayed latent until PR #334 dropped
        # the over-strict verify gate and refresh-splits actually ran. The
        # 8c46b59 benchmark (2026-05-21T19:08:59) trained on parquets with
        # 127 cols instead of 277 — every engineered feature constant-zero
        # via the silent backfill in ``src/shared/feature_build.py``. The
        # ``Verify engineered columns`` step below gates against that
        # recurrence; ``src/shared/feature_build.py`` now also raises
        # ``KeyError`` on missing cols rather than zero-filling silently.
        env:
          NFLREADPY_CACHE: "off"  # data/raw is the authoritative cache (matches tests.yml)
        run: |
          python - <<'PY'
          from src.data.loader import load_raw_data
          from src.data.preprocessing import preprocess
          from src.features.engineer import build_features
          from src.data.split import temporal_split

          df = build_features(preprocess(load_raw_data()))
          temporal_split(df)
          PY

      - name: Verify engineered columns present
        # Gate the S3 upload behind a column-presence check: every column
        # listed in each skill position's ``include_features`` whitelist
        # (minus the runtime-added subsets — weather/Vegas, team box-score,
        # position-specific Lx ratios) must be in the regenerated
        # train.parquet. Catches the failure mode that produced the 8c46b59
        # regression — ``build_features`` silently not running ships a
        # parquet missing 150 cols, training silently backfills them with
        # zeros, and the MAE shift is the only signal. ``temporal_split``
        # preserves the input column set, so checking train.parquet is
        # sufficient (val/test always have the same columns).
        run: |
          python - <<'PY'
          import pandas as pd

          from src.features.engineer import flatten_include_features
          from src.qb.config import POSITION_CONFIG as QB_CFG
          from src.rb.config import POSITION_CONFIG as RB_CFG
          from src.wr.config import POSITION_CONFIG as WR_CFG
          from src.te.config import POSITION_CONFIG as TE_CFG
          from src.shared.weather_features import WEATHER_FEATURES_ALL
          from src.shared.team_box_score import (
              OPP_BOX_SCORE_FEATURES,
              TEAM_BOX_SCORE_FEATURES,
          )

          train = pd.read_parquet("data/splits/train.parquet")
          have = set(train.columns)

          # Features added at training time (not expected in the parquet):
          # weather/Vegas in ``merge_schedule_features``, team box-score in
          # ``merge_team_box_score_features``, and each position's
          # ``add_specific_features`` Lx ratios. If a future PR adds a new
          # runtime merge step in ``src/shared/feature_build.py``'s
          # ``build_position_features``, add its produced cols to this union
          # — otherwise this verify step will start false-positive failing
          # on whitelisted cols that the upstream parquet legitimately
          # doesn't carry.
          runtime_added = (
              set(WEATHER_FEATURES_ALL)
              | set(TEAM_BOX_SCORE_FEATURES)
              | set(OPP_BOX_SCORE_FEATURES)
          )

          # Per-position cols computed by ``add_features_fn`` but
          # categorised in ``include_features`` under a non-"specific"
          # bucket — RB intentionally puts ``prior_season_mean_catch_rate``
          # / ``prior_season_mean_yards_per_carry`` under "prior_season"
          # (they're prior-season aggregates) but they're built at
          # training time by ``src/rb/features.py::_compute_features``,
          # not by ``build_features``. Without this carve-out the verify
          # step false-positive-failed the 2026-05-21 refresh-splits run
          # on PR #337 — the parquet was correct; the gate was wrong.
          runtime_added_per_pos = {
              "RB": {
                  "prior_season_mean_catch_rate",
                  "prior_season_mean_yards_per_carry",
              },
          }

          missing_by_pos = {}
          for pos, cfg in [("QB", QB_CFG), ("RB", RB_CFG), ("WR", WR_CFG), ("TE", TE_CFG)]:
              want = set(flatten_include_features(cfg.include_features))
              want -= runtime_added
              want -= set(cfg.specific_features or [])
              want -= runtime_added_per_pos.get(pos, set())
              missing = sorted(want - have)
              if missing:
                  missing_by_pos[pos] = missing

          if missing_by_pos:
              for pos, cols in missing_by_pos.items():
                  print(f"{pos}: {len(cols)} missing — {cols}")
              raise SystemExit(
                  "Regenerated train.parquet is missing whitelisted feature "
                  "columns; refusing to upload to S3. This usually means "
                  "build_features() did not run in the Regenerate step."
              )
          print(
              f"OK: train.parquet has all whitelisted cols for QB/RB/WR/TE "
              f"({len(have)} total)."
          )
          PY

      - name: Verify train->test covariate shift
        # Warn-loud guard for the depth_chart-style regression class: a feature
        # that is in-distribution in train but degenerate in test (e.g. the -1
        # depth-chart sentinel that standardized to ~-4 sigma and regressed QB
        # attention NN 6.513 -> 8.066, TODO.md archive) silently tanks the NN.
        # We flag any whitelisted feature whose train->test |mean_z| > 1 or
        # frac-beyond-4-sigma > 0.5, measured POST build_position_features (i.e.
        # after the pipeline's own imputations, so the depth_chart fix correctly
        # shows ~0 now). Warn-only by default so a legitimately-shifted new
        # feature doesn't block every refresh; set COVSHIFT_HARD_FAIL=1 to make
        # it refuse the S3 upload. Skill positions only — matches the
        # column-presence step's scoping (K/DST don't write data/splits/).
        # See src/analysis/covariate_shift.py.
        env:
          COVSHIFT_HARD_FAIL: ""
        run: |
          python - <<'PY'
          import os

          from src.analysis.covariate_shift import (
              DEFAULT_ALLOWLIST,
              gate_check,
              shift_report_for_position,
          )

          hard_fail = os.environ.get("COVSHIFT_HARD_FAIL", "").strip() == "1"
          summary = ["## Covariate-shift guard (train -> test)", ""]
          any_flagged = False
          for pos in ["QB", "RB", "WR", "TE"]:
              report = shift_report_for_position(pos, allowlist=DEFAULT_ALLOWLIST.get(pos, set()))
              ok, offenders = gate_check(report)
              if ok:
                  summary.append(f"- {pos}: OK ({report['n_features']} features)")
                  continue
              any_flagged = True
              for off in offenders:
                  mz = off.get("mean_z", float("nan"))
                  print(f"::warning::[{pos}] covariate shift: {off['feature']} mean_z={mz:.3f}")
                  summary.append(f"- **{pos}** FLAG `{off['feature']}` mean_z={mz:.3f}")

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a") as fh:
                  fh.write("\n".join(summary) + "\n")

          if any_flagged and hard_fail:
              raise SystemExit("Covariate-shift gate failed (COVSHIFT_HARD_FAIL=1).")
          print("Covariate-shift guard:", "FLAGGED (warn-only)" if any_flagged else "clean")
          PY

      - name: Verify depth-chart temporal alignment
        # Standing guard against the PR #595 off-by-1 class: the legacy depth
        # chart's source ``week`` labeled W actually reflected week W-1's lineup
        # (stale by a game), invisible to a .shift() grep. Re-checks alignment on
        # the freshly-built splits via QB starter-consistency (does the chart's
        # rank-1 QB match who actually started week W?) plus a structural week-range
        # canary (depth weeks must not overrun the schedule's REG range — the
        # 1-19-for-18-games fingerprint). Warn-only by default so a noisy season
        # doesn't block the refresh; set DEPTH_ALIGN_HARD_FAIL=1 to refuse the S3
        # upload. See src/analysis/audit_depth_alignment.py.
        env:
          DEPTH_ALIGN_HARD_FAIL: ""
        run: |
          python - <<'PY'
          import os

          from src.analysis.audit_depth_alignment import (
              alignment_from_caches,
              depth_week_range_check,
              gate_check_alignment,
          )

          hard_fail = os.environ.get("DEPTH_ALIGN_HARD_FAIL", "").strip() == "1"
          summary = ["## Depth-chart alignment guard", ""]
          failed = False

          rates = alignment_from_caches()
          if rates is None:
              summary.append("- alignment: SKIPPED (a data/raw cache was missing)")
              print("::warning::depth alignment guard skipped — a required data/raw cache was missing")
          else:
              ok, reason = gate_check_alignment(rates)
              summary.append(
                  f"- alignment: overall={rates['overall_current']:.3f} "
                  f"trans_cur={rates['transition_current']:.3f} "
                  f"trans_prev={rates['transition_prev']:.3f} (n={rates['n_transitions']}) -> "
                  + ("OK" if ok else f"**FAIL** ({reason})")
              )
              if not ok:
                  failed = True
                  print(f"::warning::depth alignment: {reason}")

          range_ok, offenders = depth_week_range_check()
          if range_ok:
              summary.append("- week-range: OK")
          else:
              failed = True
              for off in offenders:
                  print(f"::warning::depth week-range overruns schedule: {off}")
                  summary.append(f"- **week-range FAIL** {off}")

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a") as fh:
                  fh.write("\n".join(summary) + "\n")

          if failed and hard_fail:
              raise SystemExit("Depth-chart alignment gate failed (DEPTH_ALIGN_HARD_FAIL=1).")
          print("Depth-chart alignment guard:", "FLAGGED (warn-only)" if failed else "clean")
          PY

      - name: Upload regenerated splits as workflow artifact
        # Forensic insurance: if a downstream step (Upload to S3, train
        # dispatch) fails, the operator can download the parquet directly
        # from the workflow run instead of re-running the ~10 min nflverse
        # + PBP pull. Runs on both the happy path and any earlier-step
        # failure (``success() || failure()`` covers both); skips on user
        # cancellation, which is the right behaviour: cancellation usually
        # means the operator killed the run on purpose.
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: data-splits
          path: data/splits/*.parquet
          if-no-files-found: warn
          retention-days: 14

      - name: Upload to S3 with force
        # ``force=True`` skips the per-file ETag-vs-MD5 short-circuit in
        # ``upload_data`` so we always overwrite the existing S3 objects
        # — the regenerated parquet typically differs from the last upload
        # in row count + content even when the column list is unchanged,
        # so the ETag would be different in any case; force is the safer
        # default for an explicit refresh.
        run: |
          python - <<'PY'
          import os

          import boto3

          from src.batch.launch import upload_data

          s3 = boto3.client("s3", region_name=os.environ["AWS_REGION"])
          upload_data(os.environ["S3_BUCKET"], s3_client=s3, force=True)
          PY

      - name: Confirm S3 objects updated
        run: |
          aws s3 ls "s3://${S3_BUCKET}/data/" --region "${AWS_REGION}"

      - name: Mark splits-rebuild ready (train-batch race gate)
        # Written only after the S3 upload above succeeded (sequential steps —
        # a failed upload fails the job before reaching here), so this marker's
        # presence means data/splits/ in S3 reflects this commit. train-batch's
        # gate waits for it before submitting Batch jobs. Best-effort (|| true):
        # if the marker write itself fails, the splits are still uploaded and
        # train's gate degrades to a poll-then-proceed (fail-safe), never a block.
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" | aws s3 cp - \
            "s3://${S3_BUCKET}/splits-rebuild-markers/ready/${GITHUB_SHA}.txt" \
            --region "${AWS_REGION}" --no-cli-pager || true

      - name: Kick off ECS rolling deploy (non-blocking)
        # Force the ECS service to roll new tasks so they re-sync the fresh
        # ``data/splits/*.parquet`` we just uploaded. The serving container's
        # in-flight refresh poller only watches model manifests, NOT the
        # splits parquet — without this step, running tasks keep their
        # boot-time local copy of the splits and any new attn_history_stats
        # col added since their boot will produce a state_dict shape
        # mismatch on the next model swap (the trained model has the new
        # cols; the running task's ``pos_test.columns`` doesn't, and the
        # serving's ``_apply_position_models`` silently filters the col
        # list before instantiating the inference model — postmortem in
        # this PR's body and in ``tests/test_refresh_splits_workflow.py``).
        #
        # Non-blocking: ``update-service`` returns ~1s. The actual rolling
        # deploy proceeds asynchronously via ECS; we do NOT wait on
        # ``services-stable`` here because (a) PR #302's in-flight model
        # refresh + new tasks' boot-time split sync close the loop, and
        # (b) ``ecs_refresh_sentinel`` was deliberately retired in PR #330
        # for the same reason. Failure to call this is the bug; failure of
        # this step is surfaced via the workflow status.
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --force-new-deployment \
            --no-cli-pager > /dev/null
          echo "Kicked off ECS rolling deploy on $ECS_CLUSTER/$ECS_SERVICE."

      - name: Trigger retrain via image rebuild
        # Optional chain — if the operator wants the full
        # regen-splits-then-retrain flow in one click, this dispatches
        # ``batch-image.yml`` (NOT train-batch.yml directly). Routing through
        # the image build matters for two reasons:
        #
        #   1. (was F78) Dispatching train-batch.yml directly would retrain on
        #      whatever image is already in ECR — potentially stale relative to
        #      the current main. batch-image.yml rebuilds + repushes the image,
        #      registers the job-def revision, then fires its workflow_run
        #      chain, so the retrain always runs the current code. It also
        #      routes through train-batch.yml's dedup_check, which a direct
        #      dispatch bypasses.
        #   2. (was F117) batch-image.yml's downstream workflow_run fans out to
        #      whichever train workflow the ``BATCH_ACTIVE`` repo variable
        #      selects (train-batch.yml when true, train-ec2.yml when the EC2
        #      rollback path is active). A direct ``gh workflow run
        #      train-batch.yml`` hard-routed to Batch even during an EC2
        #      rollback. Going through the image build respects the active-path
        #      choice with no BATCH_ACTIVE logic duplicated here.
        #
        # Always dispatched against ``main`` rather than ``${GITHUB_REF}`` — if
        # an operator ever runs refresh-splits.yml from a feature branch,
        # propagating that ref would resolve batch-image.yml from the branch
        # (possibly a stale copy) instead of the production file on main. The
        # splits we just uploaded affect every position equally, so the
        # main copy is always the right target.
        #
        # Only fires on workflow_dispatch (`inputs.kick_off_train`); on push
        # auto-trigger, batch-image.yml fires independently via its own path
        # filters, so chaining here would create a duplicate build + retrain.
        if: ${{ inputs.kick_off_train }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run batch-image.yml --ref main

      - name: Summary
        if: always()
        env:
          TRIGGER: ${{ github.event_name }}
          KICK_OFF: ${{ inputs.kick_off_train }}
        run: |
          {
            echo "## Refresh splits run"
            echo ""
            echo "- Bucket: \`s3://${S3_BUCKET}/data/\`"
            echo "- Region: \`${AWS_REGION}\`"
            echo "- Trigger: \`$TRIGGER\`"
            echo "- kick_off_train: \`$KICK_OFF\`"
            echo ""
            echo "Next: for each position whose config change motivated this"
            echo "refresh, watch the next per-position Batch job's"
            echo "\`smoke_test\` log line — a PASS advances that position's"
            echo "\`models/{POS}/manifest.json\`'s \`stable\` pointer, and the"
            echo "in-flight refresh poller swaps the fresh artifact on every"
            echo "running serving task within ~30s of the manifest write."
          } >> "$GITHUB_STEP_SUMMARY"
