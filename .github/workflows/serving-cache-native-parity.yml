name: Serving cache native parity (diagnostic only)
# Keep off main. Root reviews this branch before push/dispatch.
# There is deliberately no user-supplied source revision.
on:
  workflow_dispatch:
  push:
    branches: [codex/validate-serving-cache-native]
    paths:
      - .github/workflows/serving-cache-native-parity.yml
      - src/analysis/verify_serving_cache_oci.py

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.ref == 'refs/heads/codex/validate-serving-cache-native'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [legacy, candidate]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: fe368b1ae6cadafd94bb67f7ffd92499266188bb
          path: source
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Choose isolated cache transport
        id: cache
        env:
          ARM: ${{ matrix.arm }}
          CACHE_SCOPE: serving-parity-${{ github.run_id }}-${{ matrix.arm }}
        run: |
          {
            echo 'from<<CACHE_VALUE'
            if [ "$ARM" = legacy ]; then echo "type=gha,scope=$CACHE_SCOPE"; fi
            echo 'type=local,src=/tmp/serving-parity-cache'
            echo 'CACHE_VALUE'
            echo 'to<<CACHE_VALUE'
            if [ "$ARM" = legacy ]; then echo "type=gha,scope=$CACHE_SCOPE,mode=max"; fi
            echo 'type=local,dest=/tmp/serving-parity-cache-new,mode=max'
            echo 'CACHE_VALUE'
          } >> "$GITHUB_OUTPUT"
      - name: Build local OCI image and execute Dockerfile smoke
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./source
          file: source/Dockerfile
          platforms: linux/arm64
          push: false
          provenance: false
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          outputs: type=oci,dest=${{ runner.temp }}/serving-image.tar,compression=gzip
      - name: Inspect source, dependency bytes and runtime OCI configuration
        env:
          BUILD_METADATA: ${{ steps.image.outputs.metadata }}
          ARM: ${{ matrix.arm }}
        run: |
          python3 -c 'import os; from pathlib import Path; Path("build-metadata.json").write_text(os.environ["BUILD_METADATA"])'
          python3 harness/src/analysis/verify_serving_cache_oci.py inspect \
            --arm "$ARM" --source source --archive "$RUNNER_TEMP/serving-image.tar" \
            --metadata build-metadata.json --output "receipt-$ARM.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: serving-cache-parity-${{ github.run_id }}-${{ matrix.arm }}
          path: receipt-*.json
          retention-days: 14

  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: serving-cache-parity-${{ github.run_id }}-*
          path: receipts
      - name: Require paired semantic output parity
        run: python3 src/analysis/verify_serving_cache_oci.py compare --receipts receipts --output parity.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: serving-cache-parity-${{ github.run_id }}-result
          path: parity.json
          retention-days: 14
