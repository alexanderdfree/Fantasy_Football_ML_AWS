name: Benchmark on Batch (isolated)

# Isolated GPU benchmark of an EXPERIMENT branch — runs the full per-position
# pipelines on AWS Batch (g6.xlarge primary, g5.xlarge fallback Spot) and collects benchmark metrics WITHOUT
# touching production. Unlike train-batch.yml this:
#   * writes model artifacts under an experiment prefix
#     (s3://${S3_BUCKET}/experiments/benchmark/<sha>/models) via FF_MODEL_S3_PREFIX,
#     never prod ``models/`` — the serving site only polls ``models/``, so an
#     experiment can never hot-swap into the live site;
#   * never pushes benchmark_history to ``main`` (results come back as a
#     downloadable workflow artifact only);
#   * is dispatch-only (no push/workflow_run trigger).
#
# Prereq: build a branch image first so the code under test is what runs in the
# container — dispatch batch-image.yml on this branch, which pushes the image and
# stashes the Batch job-definition revision at
# s3://${S3_BUCKET}/job-def-revisions/<sha>.txt. Then dispatch this workflow with
# image_sha = that commit SHA (defaults to the dispatch ref's HEAD SHA).
#
# Identity contract (src/batch/launch.py, ADR-0027 / docs/training-build-plans.md):
# launch.py refuses anonymous submissions — every launch needs FF_BUILD_PLAN_ID
# (train-batch.yml's immutable build-plan route, which reserves PRODUCTION
# publication intents) or an explicit FF_LEGACY_RUN_ID + the full 40-char
# FF_TRAIN_GIT_SHA (the identified-standalone route). This workflow takes the
# standalone route (see the FF_LEGACY_RUN_ID env below), and launch.py then also
# pins one sealed data release whose data-producer recipe matches the image's
# commit — a branch that touched a src.data.release.DATA_PRODUCER_PATHS file has
# no published release until refresh-splits.yml runs for it (see the
# data_release input).

on:
  workflow_dispatch:
    inputs:
      positions:
        description: "Space-separated positions to benchmark"
        default: "QB RB WR TE K DST"
      seed:
        description: "Random seed"
        default: "42"
      image_sha:
        description: "Commit SHA whose branch image + job-def revision to pin (blank = this ref's HEAD)"
        default: ""
      note:
        description: "Note recorded in the benchmark_history artifact"
        default: "isolated MSE-switch benchmark"
      data_release:
        description: "Sealed data release to train on: blank = the published release matching the image's data-producer recipe (fails fast if none); a 64-hex release id (still checked against the image); or 'legacy' = the unversioned, unverified data/ objects (explicit opt-in only)"
        default: ""

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ff-predictor-training
  # The identified-standalone run id launch.py::require_training_identity
  # demands instead of a build plan. submit_job forwards it into every
  # container, where the job reserves its publication intent under it and
  # claims its immutable output receipt at
  # <prefix>/releases/v3/run-outputs/<sha>/<POS>/<sha256(run_id)>.json; the
  # collect step reads those receipts back by the same id, so it lives here
  # (workflow-wide, visible to both steps) and is unique per workflow attempt.
  FF_LEGACY_RUN_ID: benchmark-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # launch.py blocks up to WAIT_TIMEOUT_SECONDS (180 min) on the Spot fan-out;
    # give headroom for cold start + metric download + artifact upload.
    timeout-minutes: 210
    steps:
      - name: Configure AWS credentials
        # SHA-pinned per CodeQL actions/unpinned-tag; version is recorded below.
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          # Full history: the Resolve step expands an abbreviated image_sha with git rev-parse.
          fetch-depth: 0
          # Partial clone: every commit + tree (git log/diff/rev-parse/rebase all work)
          # but blobs only on demand, so the ~200 MB of since-removed data/media
          # blobs in history are never downloaded.
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        # SHA-pinned per CodeQL actions/unpinned-tag; version is recorded below.
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - name: Install launch + benchmark deps
        # requirements-dev.txt mirrors train-batch.yml — src/batch/benchmark.py's
        # import chain pulls torch; launch.py needs boto3 (in requirements.txt).
        # --index-strategy unsafe-best-match: requirements-dev.txt adds the
        # pytorch CPU --extra-index-url, and uv's default first-index strategy
        # otherwise resolves numpy there (where the pinned 2.4.6 is absent) and
        # fails; consider all indexes so numpy comes from PyPI.
        run: uv pip install --system --index-strategy unsafe-best-match -r requirements-dev.txt

      - name: Resolve image SHA + experiment prefix (validate dispatch inputs)
        id: ctx
        env:
          INPUT_SHA: ${{ github.event.inputs.image_sha }}
          POSITIONS: ${{ github.event.inputs.positions }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          set -euo pipefail
          # Defense-in-depth (mirrors ab-batch.yml): these dispatch inputs feed
          # S3 keys, a Batch job-def name, $GITHUB_OUTPUT lines and CLI args
          # downstream. Every check is a bash [[ =~ ]] match, which is
          # whole-string — `printf '%s' "$X" | grep -Eq '^...$'` is
          # line-anchored, so a multi-line value whose FIRST line matched would
          # pass and then smuggle extra key=value lines into $GITHUB_OUTPUT.
          REQUESTED_SHA="${INPUT_SHA:-${GITHUB_SHA:-}}"
          if [[ -z "$REQUESTED_SHA" ]]; then
            echo "image_sha is blank and GITHUB_SHA is unset" >&2
            exit 1
          fi
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Invalid image_sha: $REQUESTED_SHA (expected a 7-40 char hex git SHA)" >&2
            exit 1
          fi
          # launch.py's identity contract and the Batch image resolver
          # (src/scripts/resolve_training_image.py) both demand the FULL
          # lowercase 40-char SHA; expand an abbreviated input against the
          # fetch-depth-0 checkout (an unknown commit fails here, loudly).
          if ! SHA=$(git rev-parse --verify --end-of-options "${REQUESTED_SHA}^{commit}"); then
            echo "image_sha ${REQUESTED_SHA} is not a commit in this checkout: dispatch batch-image.yml on the branch first, or pass a SHA that exists on this ref" >&2
            exit 1
          fi
          if [[ -z "$SHA" || ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not expand image_sha to a full commit SHA: $SHA" >&2
            exit 1
          fi
          # positions: whole-string shape first ([[:blank:]] is space/tab only;
          # `read` stops at the first newline and would hide later tokens),
          # then every token must be a known position.
          if [[ ! "$POSITIONS" =~ ^[[:blank:]]*[A-Z]+([[:blank:]]+[A-Z]+)*[[:blank:]]*$ ]]; then
            echo "Invalid positions: $POSITIONS (expected space-separated tokens from QB RB WR TE K DST)" >&2
            exit 1
          fi
          read -ra POS_LIST <<< "$POSITIONS"
          for p in "${POS_LIST[@]}"; do
            case "$p" in
              QB|RB|WR|TE|K|DST) ;;
              *) echo "Invalid position: $p (expected QB RB WR TE K DST)" >&2; exit 1 ;;
            esac
          done
          if [[ ! "$SEED" =~ ^[0-9]+$ ]]; then
            echo "Invalid seed: $SEED (expected a non-negative integer)" >&2
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "prefix=experiments/benchmark/${SHA}/models" >> "$GITHUB_OUTPUT"
          echo "Experiment artifacts -> s3://${S3_BUCKET}/experiments/benchmark/${SHA}/models (NOT prod models/)"

      - name: Pin the sealed data release for this image
        # launch.py::pin_data_release refuses to train an image on a release
        # whose data-producer recipe (src.data.release.DATA_PRODUCER_PATHS at
        # the image's commit) differs from the release's, and the collect step
        # must see the same release to verify the per-position receipts — so
        # resolve it once here, before the job-def clone below, for both steps.
        # Blank input: the same resolver train-batch.yml's build_plan step waits
        # on (--pin-training writes FF_DATA_RELEASE / FF_DATASET_ID /
        # FF_DATA_FORMAT to GITHUB_ENV). A branch image whose recipe has no
        # published release can only get one from refresh-splits.yml, so fail
        # fast instead of waiting an hour like the production path does.
        env:
          HEAD_SHA: ${{ steps.ctx.outputs.sha }}
          DATA_RELEASE: ${{ github.event.inputs.data_release }}
        run: |
          set -euo pipefail
          case "$DATA_RELEASE" in
            "")
              python -m src.scripts.wait_data_release --bucket "$S3_BUCKET" \
                --revision "$HEAD_SHA" --timeout-seconds 30 --pin-training || {
                echo "::error::No sealed data release matches this image's data-producer recipe. Dispatch refresh-splits.yml on the branch to publish one, or re-dispatch with data_release=legacy (explicit, unverified inputs)." >&2
                exit 1
              }
              ;;
            legacy)
              echo "WARNING: explicit legacy data selected; the unversioned data/ raw + split objects are unverified and not comparable to release-pinned rows"
              echo "FF_DATA_RELEASE=legacy" >> "$GITHUB_ENV"
              ;;
            *)
              # An explicit release id is still validated against the image's
              # recipe by pin_data_release at submit time.
              # Whole-string [[ =~ ]] match (see the Resolve step): a
              # line-anchored grep would let a multi-line value through.
              if [[ ! "$DATA_RELEASE" =~ ^[0-9a-f]{64}$ ]]; then
                echo "Invalid data_release: $DATA_RELEASE (expected blank, 'legacy', or a 64-char hex release id)" >&2
                exit 1
              fi
              echo "FF_DATA_RELEASE=${DATA_RELEASE}" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Resolve Batch job-definition revision for this image
        # batch-image.yml stashes the job-def revision under the image's commit
        # SHA. Pinning ensures the Batch jobs run THIS branch's image, not
        # whatever 'latest' resolves to. Refuse to fall back (that would run
        # main's code and silently invalidate the experiment).
        id: revision
        env:
          HEAD_SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          set -euo pipefail
          REVISION=$(aws s3 cp \
            "s3://${S3_BUCKET}/job-def-revisions/${HEAD_SHA}.txt" - \
            --region "$AWS_REGION" --no-cli-pager 2>/dev/null || true)
          if [ -n "$REVISION" ]; then
            # Production image: batch-image.yml stashed a prod ff-training-job
            # revision under the merge SHA. Pin to it.
            echo "Pinning job submissions to ff-training-job:${REVISION}"
            echo "job_def=ff-training-job" >> "$GITHUB_OUTPUT"
            echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          else
            # Branch image: batch-image.yml only registers/stashes a prod job-def
            # revision on main, so a workflow_dispatch branch build has none. Clone
            # ff-ab-job onto ff-training:${HEAD_SHA} via the shared ADR-0020
            # primitive (same path ab-batch.yml uses), so production job-def names
            # never reference a branch image.
            echo "No prod revision for ${HEAD_SHA}; cloning ff-ab-job onto ff-training:${HEAD_SHA}"
            # resolve_job_definition logs "[ab] registered ..." to stdout before
            # returning the name:revision, so take only the final line (pipefail
            # above turns a resolver crash into a failed step instead of an
            # empty job_def/revision; the shape check below catches anything
            # else). The program reads HEAD_SHA / AWS_REGION from the
            # environment rather than having them shell-interpolated into the
            # Python source.
            JD=$(python -c 'import os, boto3; from src.tuning.launch_ab import resolve_job_definition; print(resolve_job_definition(os.environ["HEAD_SHA"], boto3.client("batch", region_name=os.environ["AWS_REGION"])))' | tail -n1)
            if [[ ! "$JD" =~ ^[A-Za-z0-9_-]+:[0-9]+$ ]]; then
              echo "resolve_job_definition returned '${JD}', expected <job-definition-name>:<revision>" >&2
              exit 1
            fi
            echo "Resolved job definition ${JD}"
            echo "job_def=${JD%%:*}" >> "$GITHUB_OUTPUT"
            echo "revision=${JD##*:}" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit Batch jobs and wait (isolated experiment prefix)
        env:
          POSITIONS: ${{ github.event.inputs.positions }}
          SEED: ${{ github.event.inputs.seed }}
          # ff-training-job for a main image, ff-ab-job for a cloned branch image.
          # launch.py binds this exact revision, checks its image tag equals
          # FF_TRAIN_GIT_SHA, and registers the source lineage under the
          # experiment prefix (a branch lineage is allowed there, never under
          # prod ``models/``). FF_LEGACY_RUN_ID (job env) + FF_DATA_RELEASE
          # (GITHUB_ENV, pinned above) complete the identity contract.
          FF_JOB_DEFINITION: ${{ steps.revision.outputs.job_def }}
          FF_JOB_DEFINITION_REVISION: ${{ steps.revision.outputs.revision }}
          FF_TRAIN_GIT_SHA: ${{ steps.ctx.outputs.sha }}
          # The isolation lever: train.py uploads its tarball + manifest here
          # instead of prod ``models/`` (forwarded into the container by
          # src/batch/launch.py::submit_job).
          FF_MODEL_S3_PREFIX: ${{ steps.ctx.outputs.prefix }}
        run: |
          set -euo pipefail
          # --skip-upload: CI has no local data/splits (the Batch jobs pull the
          # pinned S3 release). --append-history false: no training_runs/
          # descriptor or History row is created; the download step below
          # collects the run through its immutable output receipts instead.
          python -m src.batch.launch \
            --positions $POSITIONS \
            --seed "$SEED" \
            --skip-upload \
            --append-history false

      - name: Collect benchmark metrics from the experiment prefix
        env:
          POSITIONS: ${{ github.event.inputs.positions }}
          NOTE: ${{ github.event.inputs.note }}
          HEAD_SHA: ${{ steps.ctx.outputs.sha }}
          FF_MODEL_S3_PREFIX: ${{ steps.ctx.outputs.prefix }}
          # With FF_LEGACY_RUN_ID (job env) + FF_TRAIN_GIT_SHA set, benchmark.py
          # resolves each position through the immutable receipt this run's
          # job claimed (src/artifacts/receipts.py::download_run_artifact)
          # rather than the mutable <prefix>/<POS>/manifest.json, so a stale
          # artifact from an earlier experiment at this SHA can never be
          # collected; FF_DATA_RELEASE (GITHUB_ENV) must match the receipts.
          FF_TRAIN_GIT_SHA: ${{ steps.ctx.outputs.sha }}
          # No FF_MODEL_S3_BUCKET -> benchmark.py does NOT mirror to the website
          # History tab; the artifact below is the only output.
        run: |
          set -euo pipefail
          python -m src.batch.benchmark \
            --download-only \
            --positions $POSITIONS \
            --backend batch \
            --git-hash "$HEAD_SHA" \
            --note "$NOTE"

      - name: Upload benchmark results artifact
        # always(): a failed Spot fan-out still leaves partial metrics worth
        # downloading — but not when the Resolve step rejected the input
        # (there is nothing to collect and the artifact name would be empty).
        if: always() && steps.ctx.outputs.sha != ''
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ steps.ctx.outputs.sha }}
          path: |
            benchmark_history/*.json
            benchmark_results.json
          if-no-files-found: warn
