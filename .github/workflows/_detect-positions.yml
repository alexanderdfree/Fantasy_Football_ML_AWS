name: Detect Positions (reusable)

# Reusable workflow shared by train-batch.yml and train-ec2.yml — diffs the
# merge commit to decide which positions need retraining. workflow_dispatch
# honors the explicit input (break-glass); workflow_run scopes via git diff
# on the merge commit. The path → positions mapping lives in
# src/scripts/scope_positions.py and is contract-tested by
# tests/scripts/test_scope_positions.py — keep that module in sync with
# batch-image.yml's path filter if you change the global-trigger list.

on:
  workflow_call:
    outputs:
      positions:
        description: "Space-separated list of positions to train; empty means skip."
        value: ${{ jobs.detect.outputs.positions }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      positions: ${{ steps.scope.outputs.positions }}
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run: the merged SHA on main. workflow_dispatch: the
          # ref we were dispatched on.
          #
          # fetch-depth: 2 is the minimum to resolve ``HEAD^`` for both
          # the [docs-only] commit-subject walk and ``git diff HEAD^ HEAD``
          # (the workflow_run paths below). It is also safe for
          # workflow_dispatch: that branch returns early at
          # ``echo positions=$ALL`` before ever touching git history, so
          # the dispatch flow never needs more than HEAD itself. Were a
          # future refactor to reorder the dispatch handling below the
          # diff, the ``if ! git rev-parse --verify HEAD^`` guard further
          # down would fall through to the "default to all positions"
          # branch rather than crashing — bump this to 0 (full clone)
          # only if a future change actually needs deeper history.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          # The detect job only reads the diff and shells out to a pure-stdlib
          # python helper — never pushes commits, opens PRs, or otherwise calls
          # the GitHub API. Drop the auth token from the checked-out repo so
          # nothing in this job (or a future addition) can accidentally exfil
          # GITHUB_TOKEN via an actions/cache poisoning or similar. Closes
          # CodeQL actions/untrusted-checkout/medium.
          persist-credentials: false

      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          INPUT_POSITIONS: ${{ github.event.inputs.positions }}
        run: |
          set -eu
          ALL="QB RB WR TE K DST"

          # Dispatch with explicit input → use verbatim (break-glass).
          # Dispatch with empty input → retrain all (legacy semantics,
          # e.g. "retrain after data refresh").
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_POSITIONS" ]; then
              echo "Dispatch override: $INPUT_POSITIONS"
              echo "positions=$INPUT_POSITIONS" >> "$GITHUB_OUTPUT"
            else
              echo "Dispatch with empty input → all positions."
              echo "positions=$ALL" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # workflow_run: diff the merged commit against its first parent.
          # Defensive: on a degenerate repo with no parent, default to all.
          # Resolve HEAD^ up front so both the [docs-only] walk (below) and
          # the diff (further down) can use it as the base.
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "No parent commit — defaulting to all positions."
            echo "positions=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Opt-in: any commit in HEAD^..HEAD whose subject line contains
          # `[docs-only]` signals the author asserts the diff has no
          # behavioural impact (comment / docstring / import-reorder only)
          # and skips training. Mirrors tests.yml's detect job and
          # pre-pr.sh — same trust contract: CI cannot verify the assertion,
          # the author owns correctness.
          #
          # Per-commit subject-line scan — the awk filter keeps line 1 (the
          # commit subject) and any `* `-prefixed line (squash-merge
          # constituent subject) and drops prose body lines. Previous flat
          # grep against the full %B false-positived on commits that
          # *described* the [docs-only] mechanism in prose body text
          # (e.g. perf PR #293 / e802a47 got skipped because a constituent
          # CI commit's body wrote "the [docs-only] opt-in now also clears…").
          # Iterating per-commit (rather than cat'ing the whole range into
          # one stream) also prevents a body line of commit N+1 looking like
          # a subject of commit N due to lack of separators in
          # `git log --format=%B`. The range walk (vs HEAD-only) matters for
          # non-squash merges and direct multi-commit pushes to main, where
          # the [docs-only] tag may live in a constituent commit subject
          # rather than the merge commit itself.
          #
          # NOTE: this job is NOT exposed to the false-green bug that
          # tests.yml's pull_request detect had (TODO.md, 2026-05-29). That one
          # ran on the synthetic refs/pull/N/merge commit and ranged from a
          # lagging github.event.pull_request.base.sha, so `base.sha..HEAD`
          # swept in unrelated main commits merged after the PR's base. This
          # job runs only on workflow_run (post-merge) / workflow_dispatch —
          # HEAD is a REAL main commit and HEAD^ is its genuine predecessor, so
          # HEAD^..HEAD scopes to exactly what the squash/merge landed. Do NOT
          # "fix" this to `HEAD^2 --not HEAD^1`: that would drop the merge
          # commit's own subject on a non-squash merge, and break outright on
          # the linear squash-merge case (the common one), where HEAD has no
          # second parent.
          docs_only=false
          for sha in $(git log --format=%H HEAD^..HEAD); do
            if git log -1 --format=%B "$sha" | awk 'NR==1 || /^\* /' | grep -qF '[docs-only]'; then
              docs_only=true
              break
            fi
          done
          if [ "$docs_only" = "true" ]; then
            echo "[docs-only] detected in HEAD^..HEAD subject line(s) — skipping training."
            echo "positions=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only HEAD^ HEAD)
          echo "Changed files:"
          printf '  %s\n' $files

          # Pure-stdlib helper, no pip install needed; ubuntu-latest ships
          # python3. Empty stdout = nothing model-relevant changed → train
          # job skipped by the `if:` gate in the calling workflow.
          positions=$(printf '%s\n' "$files" | python3 -m src.scripts.scope_positions)
          if [ -z "$positions" ]; then
            echo "No model-relevant paths changed — skipping training."
          else
            echo "Scoped retrain: $positions"
          fi
          echo "positions=$positions" >> "$GITHUB_OUTPUT"
