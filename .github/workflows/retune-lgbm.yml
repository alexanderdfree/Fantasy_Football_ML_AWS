name: Retune LGBM

# Runs src/tuning/tune_lgbm.py on the EC2 trainer. Mirrors train-ec2.yml's
# instance start + SSM flow, but overrides the container entrypoint to run
# Optuna instead of src.batch.train. Ships tuned hyperparams as stdout — the
# caller hand-copies the best_params block into the position config in a
# follow-up PR.
#
# Trigger manually via Actions UI → "Retune LGBM" → Run workflow. Default
# position = RB so the 3-seed objective fits the hosted-runner budget; override
# positions for a larger manual batch.

on:
  workflow_dispatch:
    inputs:
      positions:
        description: "Space-separated positions to tune"
        default: "RB"
      n_trials:
        description: "Optuna trials per position"
        default: "50"
      seeds:
        description: "Comma-separated non-negative integer LightGBM seeds per trial"
        default: "42,43,44"
      timeout_sec:
        description: "Per-position Optuna timeout (sec, 0 = no cap)"
        default: "0"

concurrency:
  # Separate group from ``train-ec2`` so a new merge to main (which triggers
  # train-ec2 with cancel-in-progress: true) doesn't cancel an in-flight or
  # queued retune. OS-level mutual exclusion on the instance is handled by
  # the flock on /var/lock/ff-train.lock inside the SSM shell below — if
  # train-ec2 or another diagnostic is running, the retune's flock -n fails
  # with exit 2 and the workflow reports that cleanly.
  group: ec2-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ff-training

jobs:
  retune:
    runs-on: ubuntu-latest
    # Hosted runners cap long jobs around 6h, so the SSM command deadline stays
    # below that cap and leaves cleanup/log collection time.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = aws-actions/configure-aws-credentials v4
        # tip as of 2026-05-21.
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve instance ID
        id: inst
        run: |
          ID="${{ vars.EC2_TRAINER_INSTANCE_ID }}"
          if [ -z "$ID" ]; then
            echo "EC2_TRAINER_INSTANCE_ID repo variable is not set."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Resolve ECR image URI
        id: img
        run: |
          ACCT=$(aws sts get-caller-identity --query Account --output text)
          echo "uri=$ACCT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest" >> "$GITHUB_OUTPUT"

      - name: Start instance (no-op if already running)
        run: |
          aws ec2 start-instances --instance-ids "${{ steps.inst.outputs.id }}" --region "$AWS_REGION" >/dev/null
          aws ec2 wait instance-running --instance-ids "${{ steps.inst.outputs.id }}" --region "$AWS_REGION"

      - name: Wait for SSM agent online
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.inst.outputs.id }}" \
              --region "$AWS_REGION" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "None")
            if [ "$STATUS" = "Online" ]; then
              echo "SSM online"; exit 0
            fi
            echo "SSM status: $STATUS (attempt $i/30)"
            sleep 10
          done
          echo "Timed out waiting for SSM"; exit 1

      - name: Run Optuna retune via docker
        id: tune
        # ``env:`` indirection rather than direct ``${{ github.event.inputs.* }}``
        # interpolation into shell — matches the hardening pattern PR #258
        # applied to the train workflows. The inputs land as proper shell
        # variables here instead of being string-spliced into the script
        # source by GitHub Actions.
        env:
          INPUT_POSITIONS: ${{ github.event.inputs.positions }}
          INPUT_N_TRIALS: ${{ github.event.inputs.n_trials }}
          INPUT_SEEDS: ${{ github.event.inputs.seeds }}
          INPUT_TIMEOUT_SEC: ${{ github.event.inputs.timeout_sec }}
        run: |
          POSITIONS="${INPUT_POSITIONS:-RB}"
          N_TRIALS="${INPUT_N_TRIALS:-50}"
          SEEDS="${INPUT_SEEDS:-42,43,44}"
          TIMEOUT_SEC="${INPUT_TIMEOUT_SEC:-0}"
          IMAGE="${{ steps.img.outputs.uri }}"
          if ! printf '%s' "$SEEDS" | grep -Eq '^[0-9]+(,[0-9]+)*$'; then
            echo "Invalid seeds: $SEEDS"
            echo "Expected a comma-separated list of non-negative integers, e.g. 42,43,44."
            exit 1
          fi
          TIMEOUT_ARG=""
          if [ "$TIMEOUT_SEC" != "0" ]; then
            TIMEOUT_ARG="--timeout $TIMEOUT_SEC"
          fi
          # Override the container entrypoint to run src.tuning.tune_lgbm
          # instead of src.batch.train. Env vars mirror ff-train
          # (infra/ec2/user-data.sh). SSM uses /bin/sh (dash) which doesn't
          # support bash's ``exec 200>FILE ; flock -n 200`` form — switch to
          # ``flock -xn -E 99 FILE COMMAND ARGS...`` (POSIX). Host-side tee
          # dropped; full output lands in CloudWatch /ff/training via
          # --cloud-watch-output-config below.
          jq -n --arg cmd "set -u
          mkdir -p /opt/ff/scratch/input /opt/ff/scratch/raw /opt/ff/logs
          date -Iseconds > /opt/ff/logs/last-activity
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin \$(echo $IMAGE | cut -d/ -f1) >/dev/null
          docker pull $IMAGE
          flock -xn -E 99 /var/lock/ff-train.lock docker run --rm \
            --entrypoint python \
            -e S3_BUCKET=ff-predictor-training \
            -e S3_DATA_PREFIX=data \
            -e LOG_EVERY=10 \
            -e AWS_DEFAULT_REGION=$AWS_REGION \
            -v /opt/ff/scratch/input:/opt/ml/input/data/training \
            -v /opt/ff/scratch/raw:/opt/ml/code/data/raw \
            $IMAGE -m src.tuning.tune_lgbm $POSITIONS --n-trials $N_TRIALS --seeds \"$SEEDS\" $TIMEOUT_ARG
          RC=\$?
          date -Iseconds > /opt/ff/logs/last-activity
          if [ \$RC -eq 99 ]; then
            echo 'retune-lgbm: flock failed — train-ec2 or another diagnostic is running'
            exit 2
          fi
          exit \$RC
          " '{commands: [$cmd], executionTimeout: ["19800"]}' > /tmp/ssm-params.json
          # executionTimeout=19800 (5.5h) overrides AWS-RunShellScript's 1h
          # default while leaving hosted-runner time for cancel/log/artifact steps.
          CMD_ID=$(aws ssm send-command \
            --targets "Key=InstanceIds,Values=${{ steps.inst.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --comment "retune-lgbm ${{ github.sha }}" \
            --parameters file:///tmp/ssm-params.json \
            --cloud-watch-output-config "CloudWatchLogGroupName=/ff/training,CloudWatchOutputEnabled=true" \
            --region "$AWS_REGION" --query Command.CommandId --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Retune command: $CMD_ID"

      - name: Wait for retune to complete
        run: |
          # Keep this below the hosted-runner cap and matched to the SSM
          # executionTimeout override above.
          CMD_ID="${{ steps.tune.outputs.command_id }}"
          INST="${{ steps.inst.outputs.id }}"
          deadline=$(( $(date +%s) + 19800 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INST" \
              --region "$AWS_REGION" \
              --query Status --output text)
            case "$STATUS" in
              Success)                    echo "Retune succeeded"; exit 0 ;;
              Cancelled|TimedOut|Failed)  echo "Retune terminal: $STATUS"; exit 1 ;;
              Pending|InProgress|Delayed) echo "Status: $STATUS -- sleeping 60s"; sleep 60 ;;
              *)                          echo "Unknown status: $STATUS"; exit 1 ;;
            esac
          done
          echo "Timed out after 5.5 hours"; exit 1

      - name: Cancel SSM command on cancel/failure
        if: (cancelled() || failure()) && steps.tune.outputs.command_id != ''
        run: |
          aws ssm cancel-command \
            --command-id "${{ steps.tune.outputs.command_id }}" \
            --instance-ids "${{ steps.inst.outputs.id }}" \
            --region "$AWS_REGION" || true

      - name: Stream retune output to Actions log
        if: always()
        run: |
          OUT=$(aws ssm get-command-invocation \
            --command-id "${{ steps.tune.outputs.command_id }}" \
            --instance-id "${{ steps.inst.outputs.id }}" \
            --region "$AWS_REGION" \
            --query StandardOutputContent --output text)
          echo "$OUT"
          # SSM StandardOutputContent is capped at ~24KB — src.tuning.tune_lgbm
          # with LOG_EVERY=10 over 4 positions × 50 trials will exceed that. Full
          # logs land in CloudWatch /ff/training via --cloud-watch-output-config.
          {
            echo '## LGBM retune — tail of output'
            echo '```'
            printf '%s\n' "$OUT" | tail -80
            echo '```'
            echo ''
            echo 'Full log: CloudWatch `/ff/training` (Actions-runner output is truncated at ~24KB).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download results from S3
        if: success()
        run: |
          # src.tuning.tune_lgbm uploads the structured best-params JSON here.
          # Operators paste the lowercase `lgbm_*=...` lines emitted by
          # ``_format_config_lines`` into the affected position's
          # ``build_position_config(...)`` call in src/{pos.lower()}/config.py.
          # (No auto-rewrite step exists; manual paste is the current flow.)
          aws s3 cp s3://ff-predictor-training/tune_lgbm/tune_lgbm_results.json \
            tune_lgbm_results.json --region "$AWS_REGION"
          echo "== tune_lgbm_results.json =="
          cat tune_lgbm_results.json
          {
            echo ''
            echo '## tune_lgbm_results.json'
            echo '```json'
            cat tune_lgbm_results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tune_lgbm_results
          path: tune_lgbm_results.json
          retention-days: 30
