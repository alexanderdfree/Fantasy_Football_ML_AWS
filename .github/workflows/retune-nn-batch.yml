name: Retune NN on Batch (Spot)

# Manually-triggered Optuna sweep of the attention-NN hyperparameters across
# all six positions. Mirrors train-batch.yml's per-position fan-out — one
# Spot GPU host per position via AWS Batch, preferring g6.xlarge and falling
# back to g5.xlarge, saturating the 24-vCPU Spot G+VT quota (4 vCPU × 6
# positions = 24 vCPU). Inside each position job, the tuner passes
# --parallel-backend auto; inside the g6/L4 or g5/A10G Linux container the
# detect-platform path resolves that to NVIDIA CUDA MPS. Default is 3 workers
# plus FF_CUDA_GRAPH=1.
#
# NO ECS refresh, NO benchmark_history commit: tuning produces config
# *recommendations* (printed as paste-ready QB_ATTN_* / QB_NN_* constants),
# not model artifacts. Operators hand-paste winning params into the
# affected src/{pos}/config.py and let the normal training path produce
# the actual model on the next push.

on:
  workflow_dispatch:
    inputs:
      positions:
        description: "Space-separated positions to tune (subset of QB RB WR TE K DST)"
        default: "QB RB WR TE K DST"
      n_trials:
        description: "Optuna trials per position"
        default: "30"
      timeout_seconds:
        description: "Per-position wall-clock cap in seconds (blank = no cap; Batch wait timeout still applies)"
        default: ""
      mps_workers:
        description: "Concurrent MPS worker processes per Batch GPU"
        default: "3"
      cuda_graph:
        description: "Enable FF_CUDA_GRAPH for Batch tuning (true/false)"
        default: "true"
      attempt_timeout_seconds:
        description: "AWS Batch attempt timeout in seconds"
        default: "7200"

concurrency:
  # Serialize dispatches that share an Optuna SQLite study DB (the study
  # version keys off cuda_graph); distinct cuda_graph runs use separate DBs
  # and may proceed in parallel.
  group: retune-nn-batch-${{ inputs.cuda_graph }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ff-predictor-training

permissions:
  contents: read

jobs:
  parse:
    # Tiny job: split the space-delimited input into a JSON array the matrix
    # job below can consume. Also re-exports the raw string for the aggregator
    # job (which calls aggregate_results.py with --positions $POSITIONS).
    runs-on: ubuntu-latest
    outputs:
      positions: ${{ steps.parse.outputs.positions }}
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - id: parse
        env:
          POS_INPUT: ${{ github.event.inputs.positions }}
          N_TRIALS: ${{ github.event.inputs.n_trials }}
          MPS_WORKERS: ${{ github.event.inputs.mps_workers }}
          ATTEMPT_TIMEOUT_SECONDS: ${{ github.event.inputs.attempt_timeout_seconds }}
        run: |
          set -eu
          # Trim, collapse whitespace, reject empty input early.
          POS_LIST=$(printf '%s' "$POS_INPUT" | tr -s '[:space:]' ' ' | sed 's/^ //;s/ $//')
          if [ -z "$POS_LIST" ]; then
            echo "positions input is empty" >&2
            exit 1
          fi
          # Cost-ceiling sanity guard: 6 positions × 100 trials × ~2 min × g6
          # Spot ≈ ~$7 / run, which is fine. >100 trials/position usually means
          # an operator typo (e.g. "3000" instead of "30"); fail the workflow
          # before submitting six Spot jobs that would burn the budget. Bypass
          # by raising this ceiling consciously in a PR if you ever need a
          # bigger sweep.
          if ! [[ "$N_TRIALS" =~ ^[0-9]+$ ]]; then
            echo "n_trials must be a positive integer, got: $N_TRIALS" >&2
            exit 1
          fi
          if [ "$N_TRIALS" -gt 100 ]; then
            echo "n_trials=$N_TRIALS exceeds the 100-trials-per-position ceiling" >&2
            echo "(probable operator typo; bump the ceiling in this workflow if you really want it)" >&2
            exit 1
          fi
          if ! [[ "$MPS_WORKERS" =~ ^[0-9]+$ ]] || [ "$MPS_WORKERS" -lt 1 ]; then
            echo "mps_workers must be a positive integer" >&2
            exit 1
          fi
          if ! [[ "$ATTEMPT_TIMEOUT_SECONDS" =~ ^[0-9]+$ ]] || [ "$ATTEMPT_TIMEOUT_SECONDS" -lt 60 ]; then
            echo "attempt_timeout_seconds must be an integer >= 60" >&2
            exit 1
          fi
          MATRIX=$(printf '%s\n' "$POS_LIST" | jq -Rc 'split(" ") | map(select(length > 0))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "positions=$POS_LIST" >> "$GITHUB_OUTPUT"
          echo "Parsed positions: $POS_LIST"
          echo "Matrix JSON:      $MATRIX"

  submit:
    needs: parse
    runs-on: ubuntu-latest
    strategy:
      # Independent positions — one Spot failure shouldn't cancel the rest.
      # The aggregator runs unconditionally and collates what made it to S3.
      fail-fast: false
      matrix:
        position: ${{ fromJson(needs.parse.outputs.matrix) }}
    # 30 trials × ~2 min/trial on g6.xlarge ≈ 60 min; Spot retries can
    # bring per-position wall-clock to ~3 hr worst case. 4 hr ceiling
    # catches a stuck job before it pins the runner indefinitely.
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = aws-actions/configure-aws-credentials v4
        # tip as of 2026-05-21.
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install launch deps
        # launch_tune imports src.batch.launch, whose top-level
        # `from src.shared.registry import ...` pulls numpy via position_config;
        # boto3 covers the Batch submit + wait_for_jobs. (Without numpy this step
        # ImportError'd before submitting any job.) The container deps live in ECR.
        run: pip install boto3 numpy

      - name: Submit + wait for tune job (${{ matrix.position }})
        env:
          POS: ${{ matrix.position }}
          N_TRIALS: ${{ github.event.inputs.n_trials }}
          TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds }}
          MPS_WORKERS: ${{ github.event.inputs.mps_workers }}
          CUDA_GRAPH: ${{ github.event.inputs.cuda_graph }}
          ATTEMPT_TIMEOUT_SECONDS: ${{ github.event.inputs.attempt_timeout_seconds }}
        run: |
          set -eu
          ARGS="--positions $POS --n-trials $N_TRIALS --parallel-backend auto --n-jobs $MPS_WORKERS --cuda-graph $CUDA_GRAPH --attempt-timeout $ATTEMPT_TIMEOUT_SECONDS"
          if [ -n "$TIMEOUT_SECONDS" ]; then
            ARGS="$ARGS --timeout $TIMEOUT_SECONDS"
          fi
          echo "launch_tune args: $ARGS"
          python -m src.tuning.launch_tune $ARGS

  aggregate:
    needs: [parse, submit]
    runs-on: ubuntu-latest
    # always(): aggregate even if some positions failed, so the operator
    # can still see the winners from the rest. The aggregator skips missing
    # per-position files with a warning instead of erroring.
    if: always() && needs.parse.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = aws-actions/configure-aws-credentials v4
        # tip as of 2026-05-21.
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install aggregator deps
        run: pip install boto3

      - name: Aggregate per-position results from S3
        env:
          POSITIONS: ${{ needs.parse.outputs.positions }}
          CUDA_GRAPH: ${{ github.event.inputs.cuda_graph }}
        run: |
          set -eu
          STORAGE_VERSION="scheduler_v2_mps"
          case "$(printf '%s' "$CUDA_GRAPH" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on) STORAGE_VERSION="scheduler_v2_mps_graph" ;;
          esac
          mkdir -p tune_results
          # $POSITIONS is intentionally unquoted — argparse `nargs="+"` needs
          # the values as separate argv entries (e.g. "QB" "RB" "WR"), and
          # the parse step already trimmed/normalised whitespace + rejected
          # empty input. Quoting would pass the whole space-delimited string
          # as a single argv entry and trip choices validation.
          python -m src.tuning.aggregate_results \
            --positions $POSITIONS \
            --bucket "$S3_BUCKET" \
            --search-space-version "$STORAGE_VERSION" \
            --local-dir ./tune_results \
            --output tune_nn_results.json \
            --summary-output "$GITHUB_STEP_SUMMARY"

      - name: Upload merged results JSON
        uses: actions/upload-artifact@v7
        with:
          name: tune_nn_results
          path: tune_nn_results.json
          if-no-files-found: warn
