name: Scheduler-type ablation (Batch, branch override)

# ⚠️ BRANCH-ONLY OVERRIDE of retune-nn-batch.yml — DO NOT MERGE this file to main
# (main's version is the real NN Optuna retune). This branch version exists so
# the LR-scheduler-type A/B can be dispatched on AWS Batch WITHOUT merging:
#
#   gh workflow run retune-nn-batch.yml --ref claude/scheduler-type-ablation \
#       -f positions="QB RB WR TE K DST"
#
# A new workflow file is not dispatchable until it's on the default branch, so we
# overload this already-registered filename and run the branch's version via
# --ref (workflow_dispatch runs the ref's job definitions; inputs validate
# against main's set, where `positions` exists). The image is built separately
# from this branch via `gh workflow run batch-image.yml --ref <branch>` — that
# does NOT trigger train-batch (its workflow_run filter is branches:[main]).
#
# Per-position fan-out: one Spot g6.xlarge per position via AWS Batch (24-vCPU
# Spot G+VT quota). Each container runs the 3-way (onecycle/cosine/plateau) A/B
# across SEEDS, eager (FF_CUDA_GRAPH=0, set by the launcher) for bit-comparable
# deltas, and uploads s3://$S3_BUCKET/ablate_scheduler/{pos}/result.json. The
# aggregate job merges them into a step-summary table + an artifact. No model
# artifact upload, no benchmark_history commit — diagnostic only.

on:
  workflow_dispatch:
    inputs:
      positions:
        description: "Space-separated positions (subset of QB RB WR TE K DST)"
        default: "QB RB WR TE K DST"

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ff-predictor-training
  SEEDS: "42,43,44"

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      positions: ${{ steps.parse.outputs.positions }}
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - id: parse
        env:
          POS_INPUT: ${{ github.event.inputs.positions }}
        run: |
          set -eu
          POS_LIST=$(printf '%s' "$POS_INPUT" | tr -s '[:space:]' ' ' | sed 's/^ //;s/ $//')
          if [ -z "$POS_LIST" ]; then
            POS_LIST="QB RB WR TE K DST"
          fi
          MATRIX=$(printf '%s\n' "$POS_LIST" | jq -Rc 'split(" ") | map(select(length > 0))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "positions=$POS_LIST" >> "$GITHUB_OUTPUT"
          echo "Positions: $POS_LIST"
          echo "Matrix:    $MATRIX"

  submit:
    needs: parse
    runs-on: ubuntu-latest
    strategy:
      # Independent positions — one Spot failure shouldn't cancel the rest.
      fail-fast: false
      matrix:
        position: ${{ fromJson(needs.parse.outputs.matrix) }}
    # 3 seeds x 3 schedulers = 9 runs/position, no LightGBM; ~10-30 min on g6,
    # Spot retries can extend it. 3h ceiling matches the launcher wait timeout.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        # SHA = aws-actions/configure-aws-credentials v4 (matches the repo's other workflows).
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install launch deps
        # launch_ablate_scheduler imports src.batch.launch, whose top-level
        # `from src.shared.registry import ...` pulls numpy via position_config.
        # boto3 covers the Batch submit + wait_for_jobs; the container carries
        # the heavy deps in the ECR image.
        run: pip install boto3 numpy

      - name: Submit + wait for ablation job (${{ matrix.position }})
        env:
          POS: ${{ matrix.position }}
        run: |
          set -eu
          echo "Submitting scheduler-type ablation for $POS (seeds $SEEDS)"
          python -m src.tuning.launch_ablate_scheduler --positions "$POS" --seeds "$SEEDS"

  aggregate:
    needs: [parse, submit]
    runs-on: ubuntu-latest
    # always(): aggregate whatever made it to S3 even if some positions failed.
    if: always() && needs.parse.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install aggregator deps
        run: pip install boto3

      - name: Aggregate per-position results from S3
        env:
          POSITIONS: ${{ needs.parse.outputs.positions }}
        run: |
          set -eu
          # $POSITIONS intentionally unquoted — argparse nargs="+" needs separate argv entries.
          python -m src.tuning.aggregate_scheduler \
            --positions $POSITIONS \
            --bucket "$S3_BUCKET" \
            --output scheduler_ablation_results.json \
            --summary-output "$GITHUB_STEP_SUMMARY"

      - name: Upload merged results JSON
        uses: actions/upload-artifact@v4
        with:
          name: scheduler_ablation_results
          path: scheduler_ablation_results.json
          if-no-files-found: warn
