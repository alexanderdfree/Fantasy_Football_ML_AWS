name: Train on Batch (Spot)

# Active training path when BATCH_ACTIVE=true. Fires after batch-image.yml
# pushes a fresh image to ECR, then submits one Batch job per position to the
# ff-training-queue queue backed by ordered Spot compute environments:
# ff-gpu-spot (g6 primary) then ff-gpu-spot-g5 (g5 fallback). Each position
# trains in parallel on its own 4-vCPU GPU host. See docs/batch_design.md.
#
# When BATCH_ACTIVE != 'true' the gate on the `train` job below skips this
# workflow on workflow_run; train-ec2.yml stays active. workflow_dispatch
# always bypasses the gate as a smoke-test break-glass.

on:
  workflow_run:
    workflows: ["Build & Push Batch Training Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      positions:
        description: "Space-separated positions to train"
        default: "QB RB WR TE K DST"
      seed:
        description: "Random seed"
        default: "42"
      image_sha:
        description: "Optional image SHA whose Batch job-definition revision should be pinned"
        default: ""

concurrency:
  # Group keyed by the SHA the upstream image was built from (workflow_run)
  # or the dispatch ref (workflow_dispatch). Different SHAs preserve the
  # Spot fan-out + cross-PR parallelism the original no-concurrency comment
  # intended; same-SHA duplicates serialize. GitHub Actions fires
  # workflow_run.completed multiple times per upstream completion (observed
  # 2–3 deliveries per merge on the 2026-05-21 sweep) — without this group,
  # every duplicate burned ~15 min of CI on a run whose only possible outcome
  # was a no-op against the prior run's submitted Batch jobs. cancel-in-progress
  # is false because the first run may already be mid-submit when the
  # duplicate fires; canceling could orphan Batch jobs at the AWS layer. The
  # `dedup_check` job below short-circuits the queued duplicate so it spends
  # ~1 min on detect/dedup-API-call rather than the full ~15 min. The
  # constrained warm-EC2 path keeps its own `train-ec2` cancel-in-progress
  # group; that decision lives with the constrained path.
  group: train-batch-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ff-predictor-training
  # No ECS_CLUSTER/ECS_SERVICE here — PR #330 removed the post-train ECS
  # refresh step from this workflow (the serving container's in-flight
  # manifest poller now picks up new stable artifacts without a forced
  # rollover), so this path no longer touches ECS. The EC2 path keeps its
  # ECS rollover, so train-ec2.yml still defines them.
  # Required for `uv pip install -r requirements-dev.txt` to resolve transitive
  # deps that exist on multiple indexes (e.g. `requests`, found on PyTorch CPU
  # index but at a different version than the one resolved by other deps —
  # without unsafe-best-match, uv refuses to look past the first index and
  # fails dependency resolution). Matches tests.yml line 22's setting.
  # Caught 2026-05-21 when PR #301's train-batch run failed at deps install
  # with "no version of requests==2.33.0" — same code path that's been
  # working for tests.yml since migration but silently absent here.
  UV_INDEX_STRATEGY: unsafe-best-match
  # Public serving URL for the post-train cache-warm probe. NOT an ECS var —
  # warming goes through the ALB like any user request (a plain HTTPS GET to
  # /warm), not the ECS control plane, so it doesn't reintroduce the post-train
  # ECS coupling PR #330 removed. See the "Warm serving cache" step.
  SERVICE_URL: https://alexfree.me

permissions:
  contents: read

jobs:
  detect:
    # Shared with train-ec2.yml via _detect-positions.yml. See that file for
    # the path → positions logic; src/scripts/scope_positions.py is the
    # contract-tested mapping.
    uses: ./.github/workflows/_detect-positions.yml

  dedup_check:
    # GitHub Actions fires workflow_run.completed multiple times per
    # upstream completion (observed 2–3 deliveries per merge). The
    # workflow-level concurrency group serializes same-SHA runs, then
    # this job short-circuits subsequent duplicates by checking an S3
    # success marker that the train job writes only on real train
    # success. Manual workflow_dispatch bypasses dedup because operators
    # dispatch deliberately. S3 HEAD is ~200 ms — invisible compared to
    # the ~15 min train job it potentially saves.
    #
    # S3 marker (not the prior `gh run list --commit "$HEAD_SHA"` query):
    # GitHub Actions exposes TWO different head_sha values on a
    # workflow_run-triggered run — the event-payload
    # `workflow_run.head_sha` (stable, = the SHA the upstream image was
    # built FROM) and the run-LEVEL head_sha (= current main HEAD when
    # the downstream run was queued). `gh run list --commit` filters by
    # the latter, but the dedup query passed the former, so on rapid
    # back-to-back merges the two diverged for the same run and dedup
    # false-skipped genuine trains (PR #309 on 2026-05-21, deduped
    # against PR #307's run #69 whose run-level head_sha had raced to
    # 04ef622). The S3 marker is keyed by workflow_run.head_sha — the
    # same identifier used by the working job-def-revisions/${HEAD_SHA}.txt
    # pattern below — so writer and reader can't drift. The marker is
    # written by the train job ONLY after artifact-freshness passes, so
    # it also fixes the prior bug where a positions=empty run that
    # skipped train was treated as a "successful train" by dedup.
    #
    # Gated on BATCH_ACTIVE (mirroring the `train` job's gate) so the EC2
    # rollback path doesn't burn CI minutes + an S3 head-object call on
    # every batch-image.yml completion. workflow_dispatch still runs it so
    # an operator smoke-test of the Batch path resolves dedup normally.
    # When skipped, `train`'s `if:` already short-circuits on the same
    # BATCH_ACTIVE clause (and a skipped job's empty `skip` output is
    # `!= 'true'`), so the gate stays consistent.
    if: vars.BATCH_ACTIVE == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        if: github.event_name == 'workflow_run'
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = aws-actions/configure-aws-credentials v4
        # tip as of 2026-05-21.
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "Event $EVENT_NAME bypasses dedup (manual dispatch always runs)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if aws s3api head-object \
               --bucket "$S3_BUCKET" \
               --key "train-success-markers/${HEAD_SHA}.txt" \
               --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Found prior train-success marker for $HEAD_SHA — short-circuiting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No prior marker for $HEAD_SHA — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  train:
    needs: [detect, dedup_check]
    # Gate: (a) detect found something to train; (b) either a manual dispatch
    # (smoke-test break-glass, bypasses BATCH_ACTIVE), or the upstream image
    # build succeeded AND BATCH_ACTIVE=true AND no prior successful run for
    # this SHA (dedup short-circuit on duplicate workflow_run fires).
    if: >
      needs.detect.outputs.positions != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.BATCH_ACTIVE == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        needs.dedup_check.outputs.skip != 'true'))
    runs-on: ubuntu-latest
    # Worst case: attempts=3 Spot retries × 1800s per attempt = 90 min per
    # chronically-interrupted position, parallel = 90 min + cold-start + post.
    # launch.py blocks for up to its WAIT_TIMEOUT_SECONDS=10800 (180 min)
    # default in "Submit Batch jobs and wait"; the job ceiling MUST sit above
    # that so the post-train steps (freshness verify, benchmark append, push,
    # marker write) have headroom rather than being killed mid-wait — a kill
    # there skips the success-marker write and the next workflow_run.completed
    # delivery re-triggers a full retrain. 210 = 180 wait + 30 min headroom.
    timeout-minutes: 210
    permissions:
      contents: write
    steps:
      - name: Configure AWS credentials
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = aws-actions/configure-aws-credentials v4
        # tip as of 2026-05-21.
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0
          # Admin PAT so the later benchmark-history push bypasses main's
          # required status checks (enforce_admins=false on classic protection).
          token: ${{ secrets.PROTECTED_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = astral-sh/setup-uv v6.8.0.
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - name: Install launch + benchmark deps
        # requirements-dev.txt mirrors train-ec2.yml — src/batch/benchmark.py's
        # import chain pulls torch. src/batch/launch.py needs boto3, which is
        # in requirements.txt.
        run: uv pip install --system -r requirements-dev.txt

      - name: Resolve Batch job-definition revision for this image
        # batch-image.yml stashed the revision number under the image's commit
        # SHA after registering it. Without pinning, AWS Batch resolves bare
        # job-definition names to the latest active revision at submit time —
        # so two parallel train-batch runs (image A and image B, both
        # registered in the same window) submit against the same (latest)
        # revision, and the run triggered by image A can silently train image
        # B's code. Manual dispatch can opt into the same pin by passing
        # image_sha; omitted image_sha intentionally preserves break-glass
        # bare-name resolution.
        id: revision
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.image_sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "No image SHA supplied; falling back to bare job-definition resolution."
            echo "revision=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REVISION=$(aws s3 cp \
            "s3://${S3_BUCKET}/job-def-revisions/${HEAD_SHA}.txt" - \
            --region "$AWS_REGION" \
            --no-cli-pager)
          if [ -z "$REVISION" ]; then
            echo "ERROR: no revision file at s3://${S3_BUCKET}/job-def-revisions/${HEAD_SHA}.txt" >&2
            echo "Refusing to fall back to latest revision — that reintroduces the race." >&2
            exit 1
          fi
          echo "Pinning job submissions to ${JOB_DEFINITION:-ff-training-job}:${REVISION}"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Wait for fresh data splits (refresh-splits race gate)
        # refresh-splits.yml rebuilds + uploads data/splits/ to S3 on the same
        # merge that triggered this train (path-filtered on src/data/** + skill
        # configs). It takes ~14 min; the batch-image build that gates this
        # workflow is ~9 min, so without this gate the Batch jobs download
        # last-commit's splits and train one commit behind — the #383 nflreadpy
        # migration's data only landed on a later manual retrain (see TODO.md).
        # Wait for refresh-splits' per-SHA "ready" marker before submitting.
        #
        # All paths PROCEED — fail-safe, never blocks the pipeline:
        #   ready present       -> splits fresh, proceed.
        #   no pending marker   -> refresh-splits didn't fire for this SHA (no
        #                          splits-affecting change), proceed immediately.
        #   pending, not ready  -> rebuild in flight; poll ~20 min for ready,
        #                          then proceed (::warning::) on timeout.
        # Skipped on workflow_dispatch (operators dispatch deliberately, after
        # refresh-splits has finished — mirrors the dedup_check gate). Keyed by
        # workflow_run.head_sha, matching the job-def-revisions/${SHA}.txt and
        # train-success-markers/${SHA}.txt conventions.
        if: github.event_name == 'workflow_run'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -u
          base="splits-rebuild-markers"
          have() {
            aws s3api head-object --bucket "$S3_BUCKET" --key "$1" \
              --region "$AWS_REGION" >/dev/null 2>&1
          }
          if have "${base}/ready/${HEAD_SHA}.txt"; then
            echo "splits-ready marker present for ${HEAD_SHA} — splits are fresh."
            exit 0
          fi
          if ! have "${base}/pending/${HEAD_SHA}.txt"; then
            echo "No refresh-splits marker for ${HEAD_SHA} (no splits-affecting change) — proceeding."
            exit 0
          fi
          echo "refresh-splits is rebuilding splits for ${HEAD_SHA}; waiting for the ready marker..."
          for i in $(seq 1 40); do
            sleep 30
            if have "${base}/ready/${HEAD_SHA}.txt"; then
              echo "splits-ready marker appeared after ~$((i * 30))s — proceeding with fresh splits."
              exit 0
            fi
          done
          echo "::warning::splits-ready marker for ${HEAD_SHA} not seen within ~20 min; proceeding with current S3 splits (fail-safe)."

      - name: Submit Batch jobs and wait
        id: train
        env:
          POSITIONS: ${{ needs.detect.outputs.positions }}
          # Empty when workflow_dispatch (no upstream image build to pin to);
          # launch.py treats empty as "no revision" and falls back to name-only
          # resolution (current behavior).
          FF_JOB_DEFINITION_REVISION: ${{ steps.revision.outputs.revision }}
          # The SHA the image being trained was built from. Threads through
          # launch.py → containerOverrides → train.py → benchmark_metrics.json,
          # so benchmark.py can warn when any position's recorded SHA diverges
          # from the run's expected SHA. Manual dispatch stamps the dispatch
          # ref SHA unless image_sha was provided for a specific image.
          FF_TRAIN_GIT_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.image_sha || github.sha }}
          # CUDA graphs autodetect ON in the container on the Batch GPU pool
          # (g6/L4 sm_89 primary, g5/A10G sm_86 fallback) —
          # cuda_graph_enabled() defaults on for sm_80+, so the fan-out is
          # graphed by default. This repo variable is an optional FLEET OVERRIDE,
          # not the trigger: leave it unset for the autodetect default, or set
          # FF_BATCH_CUDA_GRAPH=0 to force the whole fan-out back to the eager
          # path. launch.py forwards it to the container only when set.
          FF_CUDA_GRAPH: ${{ vars.FF_BATCH_CUDA_GRAPH }}
          SEED: ${{ github.event.inputs.seed || '42' }}
        run: |
          STARTED_AT=$(date +%s)
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          # SEED arrives via env (above) to avoid splicing workflow_dispatch
          # input into the shell at templating time; validate it's an integer.
          case "$SEED" in
            ""|*[!0-9]*) echo "Invalid seed: $SEED" >&2; exit 1 ;;
          esac
          # launch.py blocks on wait_for_jobs(); returns 0 only if all
          # positions reach SUCCEEDED. --skip-upload because CI has no local
          # data/splits/*.parquet — the splits in s3://ff-predictor-training/data/
          # are refreshed out-of-band by a developer running launch.py from a
          # workstation. --append-history false because the dedicated
          # "Append Batch run to benchmark_history/" step below runs
          # benchmark.py --download-only with the image SHA + PR number;
          # letting launch.py also auto-append would write a duplicate,
          # mislabeled row per run.
          python -m src.batch.launch \
            --positions $POSITIONS \
            --seed "$SEED" \
            --skip-upload \
            --append-history false

      - name: Verify model artifact freshness
        # Anchor on when training STARTED, not "now" — Spot parallelism makes
        # this less likely to false-trip than the sequential EC2 path, but
        # the same logic protects against e.g. a chronically retrying job
        # whose artifact predates this run.
        env:
          POSITIONS: ${{ needs.detect.outputs.positions }}
          FF_MODEL_S3_PREFIX: models
        run: |
          train_started_at="${{ steps.train.outputs.started_at }}"
          # An empty anchor means the train step never recorded started_at
          # (it exited before the `echo ... >> GITHUB_OUTPUT` line). Without
          # this guard, the `age=$(( train_started_at - lm_ts ))` arithmetic
          # below treats "" as 0, every artifact's age goes negative, the
          # STALE check (age > 1200) is never tripped, and the gate
          # false-passes a run whose freshness was never actually verified.
          # Fail loud instead. (Kept as an explicit check rather than
          # `set -eu` so the loop's `fail=1` accumulation + `exit $fail`
          # tail semantics are unchanged.)
          if [ -z "$train_started_at" ]; then
            echo "ERROR: train step did not emit started_at — cannot verify artifact freshness." >&2
            exit 1
          fi
          echo "| Position | Status | LastModified | Size (MB) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|--------------|-----------|" >> "$GITHUB_STEP_SUMMARY"
          model_prefix="${FF_MODEL_S3_PREFIX:-models}"
          model_prefix="${model_prefix#/}"
          model_prefix="${model_prefix%/}"
          if [ -z "$model_prefix" ]; then model_prefix="models"; fi
          fail=0
          for POS in $POSITIONS; do
            # Anchor on manifest.json — it's the atomic last write of
            # src.batch.train.upload_artifacts. The legacy models/{POS}/model.tar.gz
            # mirror was removed by the parallel-Batch race fix (commits
            # f65bcbe + be56b0d); checking it would trip STALE on every run.
            META=$(aws s3api head-object \
              --bucket "$S3_BUCKET" \
              --key "${model_prefix}/$POS/manifest.json" \
              --region "$AWS_REGION" 2>/dev/null || echo '{}')
            LM=$(echo "$META" | jq -r '.LastModified // empty')
            SZ=$(echo "$META" | jq -r '.ContentLength // 0')
            if [ -z "$LM" ]; then
              echo "| $POS | MISSING | — | — |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
              continue
            fi
            lm_ts=$(date -d "$LM" +%s)
            age=$(( train_started_at - lm_ts ))
            status="OK"
            if [ "$age" -gt 1200 ]; then status="STALE (${age}s before train start)"; fail=1; fi
            mb=$(awk "BEGIN{printf \"%.1f\", $SZ/1048576}")
            echo "| $POS | $status | $LM | $mb |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $fail

      - name: Append Batch run to benchmark_history/
        # Mirrors the JSON to s3://{bucket}/models/benchmark_history/ (see
        # src/batch/benchmark.py::_maybe_upload_to_s3) so the serving
        # container's boot-time sync_benchmark_history_from_s3 picks it up
        # on the next task roll. PR #330 removed this workflow's forced ECS
        # service refresh (the EC2 path keeps it; see train-ec2.yml's
        # "Refresh ECS service" step), so there is no ordering dependency on
        # an ECS step here anymore — the History tab simply reflects the
        # S3-mirrored JSON whenever serving tasks next cycle.
        env:
          GH_TOKEN: ${{ github.token }}
          FF_MODEL_S3_BUCKET: ${{ env.S3_BUCKET }}
          FF_MODEL_S3_PREFIX: models
          # The sm_80+ Batch GPU path autodetects graphs ON, so rows are
          # labeled graphed below (keeps them separate from the pre-cutover eager
          # baseline — graphed and eager rows aren't bit-comparable). This
          # optional fleet override (FF_BATCH_CUDA_GRAPH=0) forces eager + the
          # plain label.
          FF_CUDA_GRAPH: ${{ vars.FF_BATCH_CUDA_GRAPH }}
          POSITIONS: ${{ needs.detect.outputs.positions }}
          # Branch + head SHA come from a workflow_run trigger whose payload
          # is attacker-controllable (e.g. a fork that happens to share a
          # branch name). CodeQL flags any direct ${{ }} interpolation into a
          # ``run:`` block as a code-injection vector even when the upstream
          # path filters look safe; routing through env vars makes the value
          # a normal shell variable that downstream commands can quote.
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.image_sha }}
        run: |
          PR_NUMBER=""
          if [ -n "$HEAD_SHA" ]; then
            PR_NUMBER=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
              --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          git fetch origin "$BRANCH"
          git pull --rebase origin "$BRANCH"
          PR_ARGS=()
          if [ -n "$PR_NUMBER" ]; then
            PR_ARGS=(--pr-number "$PR_NUMBER")
            echo "Resolved PR #$PR_NUMBER for $HEAD_SHA"
          else
            echo "No PR resolved for $HEAD_SHA (direct push or workflow_dispatch)"
          fi
          # Human label for the note: image-build SHA when present, else the
          # workspace SHA on a manual dispatch. Truncated to 7 chars.
          NOTE_SHA="${HEAD_SHA:-$GITHUB_SHA}"
          NOTE_SHA="${NOTE_SHA::7}"
          # ``--git-hash "$HEAD_SHA"``: pin the recorded SHA to the image
          # build SHA (``github.event.workflow_run.head_sha``), NOT
          # ``$GITHUB_SHA``. On a workflow_run trigger ``$GITHUB_SHA`` is the
          # run-LEVEL head_sha (current main HEAD when this run was queued),
          # which diverges from the image-build SHA on rapid back-to-back
          # merges — the same two-head_sha trap the dedup_check fix
          # documents. ``$HEAD_SHA`` is the stable image-build SHA that
          # FF_TRAIN_GIT_SHA stamps into each position's metrics, so the
          # recorded ``git_hash`` matches benchmark.py's per-position
          # coherency check (find_git_sha_divergence) instead of
          # false-flagging divergence. Empty under workflow_dispatch (no
          # upstream image build); benchmark.py then falls back to the
          # workspace HEAD via get_git_hash(), which is correct for a
          # manual run. See TODO.md "Benchmark git_hash recorded the wrong
          # SHA on rapid back-to-back merges" archive entry.
          # Hardware label for the History tab is DERIVED AT RUNTIME by
          # src/batch/benchmark.py from the gpu_name + cuda_graph_active fields
          # src/batch/train.py stamps into each position's benchmark_metrics.json,
          # so it tracks the live CE with no edit here (g6.xlarge / L4 sm_89 or
          # g5.xlarge / A10G sm_86 + ", CUDA-graph" today; auto-updates if the
          # CE ever changes again) —
          # the silent-drift the old hardcoded string risked is gone. The value
          # below is only a FALLBACK, used when a run carries no GPU metadata
          # (pre-stamping artifacts / all-CPU run); it mirrors the current
          # g6-preferred/g5-fallback graphed pool, and the force-off case keeps
          # the fallback honest when FF_CUDA_GRAPH disables capture.
          INSTANCE_TYPE="g6.xlarge/g5.xlarge (Spot, CUDA-graph)"
          case "$(echo "${FF_CUDA_GRAPH:-}" | tr 'A-Z' 'a-z')" in
            0|false|no|off) INSTANCE_TYPE="g6.xlarge/g5.xlarge (Spot)" ;;
          esac
          python -m src.batch.benchmark \
            --download-only \
            --backend batch \
            --instance-type "$INSTANCE_TYPE" \
            --positions $POSITIONS \
            --note "Batch Spot auto-run (${NOTE_SHA})" \
            --git-hash "$HEAD_SHA" \
            "${PR_ARGS[@]}"

      - name: Commit and push benchmark_history/
        env:
          # Same env-indirection rationale as the previous step.
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.image_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmark_history/
          if git diff --cached --quiet -- benchmark_history/; then
            echo "No history changes — skipping commit."
            exit 0
          fi
          staged=$(git diff --cached --name-only)
          unexpected=$(echo "$staged" | grep -v '^benchmark_history/' || true)
          if [ -n "$unexpected" ]; then
            echo "ERROR: unexpected staged paths (expected benchmark_history/ only):"
            echo "$unexpected"
            exit 1
          fi
          # Label the commit with the image/head SHA the benchmark JSON pins
          # (HEAD_SHA), not the run-level GITHUB_SHA which diverges on rapid
          # merges — keeps `git log --grep <sha>` correlation intact.
          MSG_SHA="${HEAD_SHA:-$GITHUB_SHA}"
          git commit -m "chore(ci): append Batch benchmark run ${MSG_SHA::7}"
          for attempt in 1 2 3; do
            if git push origin HEAD:"refs/heads/$BRANCH"; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed — rebasing and retrying"
            git pull --rebase origin "$BRANCH"
          done
          echo "Push failed after 3 attempts"
          exit 1

      - name: Write train-success marker for dedup
        # Atomic dedup marker for the next workflow_run.completed delivery
        # of the same upstream image build (GitHub fires 2–3 per upstream
        # completion). Keyed by workflow_run.head_sha to match the
        # job-def-revisions/ convention below — same identifier on both
        # writer and reader prevents the run-level vs workflow_run
        # head_sha drift that false-skipped PR #309 on 2026-05-21.
        #
        # Placed AFTER both freshness verification AND the benchmark commit
        # push. The implicit ``if: success()`` on each step means a failure
        # in any earlier step (artifact freshness, benchmark append, git
        # push) skips the marker — re-runs then go through the full train
        # path rather than short-circuiting on a partial-success marker.
        # Trade-off: a transient push failure on benchmark_history/ now
        # causes a full retrain on the next workflow_run.completed delivery
        # (~15 min), where the previous ordering would have skipped that
        # retrain via the already-written marker. The retrain is the safer
        # failure mode — it guarantees benchmark/marker consistency
        # (S3 marker present ⇒ benchmark already on main) and avoids the
        # orphan-benchmark state where the marker says "trained" but the
        # benchmark never landed.
        if: github.event_name != 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" | aws s3 cp - \
            "s3://${S3_BUCKET}/train-success-markers/${HEAD_SHA}.txt" \
            --region "$AWS_REGION" \
            --no-cli-pager

  # Post-train serving-cache warm — split out of the `train` job (was its
  # next-to-last step) so its up-to-180s fingerprint poll no longer sits on
  # the critical path ahead of the benchmark-history commit and the dedup
  # success-marker write. Those now land ~3 min sooner (History tab + the
  # marker that gates the next push's retrain), while this best-effort warm
  # runs in parallel and `needs: train` so it only fires after a clean train.
  # It needs nothing AWS-side (no creds / no checkout) — just an HTTPS GET to
  # SERVICE_URL/warm through the ALB, exactly like a user request — so a bare
  # ubuntu runner with the inherited workflow-level SERVICE_URL env suffices.
  warm_cache:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Warm serving cache
        # Move the post-retrain recompute off the user request path. The
        # in-flight refresh poller (FF_MODEL_REFRESH_INTERVAL_S, default 30s)
        # swaps the freshly-trained models into the running tasks; the next
        # /warm (the same _ensure_metrics() the first /api/predictions a user
        # makes would run) recomputes predictions + re-uploads the S3 cache
        # (D14). Probing /warm here means a CI runner eats that 30-60s, not a
        # real visitor — and guarantees the fresh cache exists in S3 before
        # traffic, so any later container hydrates instantly.
        #
        # Best-effort: a warm miss must never fail the train workflow. The
        # existing post_fork pre-warm + lazy compute paths are the backstop.
        # As its own job this is doubly decoupled — even a hung poll can't
        # delay the marker/commit, which already completed in `train`.
        continue-on-error: true
        run: |
          warm_url="${SERVICE_URL%/}/warm"
          echo "Warming $warm_url"
          # Baseline fingerprint before the running tasks swap in the new
          # models. This first probe may itself take 30-60s if it lands on a
          # cold / just-refreshed worker — that's the point: a runner pays it.
          baseline=$(curl -fsS --max-time 150 "$warm_url" | jq -r '.fingerprint // empty' || true)
          echo "baseline fingerprint: ${baseline:-<none>}"
          # Poll until the content-based fingerprint advances past baseline
          # (confirms the poller swapped the freshly-trained models and a
          # worker recomputed + re-uploaded the S3 cache), bounded so a no-op
          # run (e.g. baseline already current) can't hang the job.
          deadline=$(( $(date +%s) + 180 ))
          advanced=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep 15
            current=$(curl -fsS --max-time 150 "$warm_url" | jq -r '.fingerprint // empty' || true)
            echo "  probe fingerprint: ${current:-<none>}"
            if [ -n "$current" ] && [ -n "$baseline" ] && [ "$current" != "$baseline" ]; then
              advanced="$current"
              break
            fi
          done
          if [ -n "$advanced" ]; then
            echo "fingerprint advanced to $advanced — new models live, cache rebuilt."
          else
            echo "fingerprint stable at ${baseline:-<none>} (already current, or no model change) — spreading warm anyway."
          fi
          # Spread the warm across the desiredCount=2 tasks' gunicorn workers;
          # the ALB distributes these GETs, so each call may land on a
          # different not-yet-warm worker and trigger its recompute + upload.
          # Fire them CONCURRENTLY: same 12-call coverage, but the step's
          # wall-clock collapses from sum(calls) to ~max(call). gunicorn's
          # per-worker request serialization still bounds in-flight recomputes
          # to the worker count, so concurrency doesn't add memory pressure —
          # it only removes the round-trip serialization on a best-effort
          # post-train step that just holds the CI runner. Each curl keeps its
          # own --max-time + `|| true`, and `wait` reaps them all (this step is
          # continue-on-error, so a slow worker can't fail the workflow).
          for _ in $(seq 1 12); do
            curl -fsS --max-time 150 "$warm_url" \
              | jq -c '{fingerprint, rows, elapsed_s, degraded_positions}' || true &
          done
          wait
