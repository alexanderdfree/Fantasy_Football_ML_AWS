name: Train on Batch (Spot)

# Active training path when BATCH_ACTIVE=true. Fires after batch-image.yml
# pushes a fresh image to ECR, then submits one Batch job per position to the
# ff-gpu-spot Compute Environment. Each position trains in parallel on its own
# Spot g4dn.xlarge. See docs/batch_design.md.
#
# When BATCH_ACTIVE != 'true' the gate on the `train` job below skips this
# workflow on workflow_run; train-ec2.yml stays active. workflow_dispatch
# always bypasses the gate as a smoke-test break-glass.

on:
  workflow_run:
    workflows: ["Build & Push Batch Training Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      positions:
        description: "Space-separated positions to train"
        default: "QB RB WR TE K DST"
      seed:
        description: "Random seed"
        default: "42"

concurrency:
  # Group keyed by the SHA the upstream image was built from (workflow_run)
  # or the dispatch ref (workflow_dispatch). Different SHAs preserve the
  # Spot fan-out + cross-PR parallelism the original no-concurrency comment
  # intended; same-SHA duplicates serialize. GitHub Actions fires
  # workflow_run.completed multiple times per upstream completion (observed
  # 2–3 deliveries per merge on the 2026-05-21 sweep) — without this group,
  # every duplicate burned ~15 min of CI on a run whose only possible outcome
  # was a no-op against the prior run's submitted Batch jobs. cancel-in-progress
  # is false because the first run may already be mid-submit when the
  # duplicate fires; canceling could orphan Batch jobs at the AWS layer. The
  # `dedup_check` job below short-circuits the queued duplicate so it spends
  # ~1 min on detect/dedup-API-call rather than the full ~15 min. The
  # constrained warm-EC2 path keeps its own `train-ec2` cancel-in-progress
  # group; that decision lives with the constrained path.
  group: train-batch-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ff-predictor-training
  ECS_CLUSTER: fantasy-cluster
  ECS_SERVICE: fantasy-service
  # Required for `uv pip install -r requirements-dev.txt` to resolve transitive
  # deps that exist on multiple indexes (e.g. `requests`, found on PyTorch CPU
  # index but at a different version than the one resolved by other deps —
  # without unsafe-best-match, uv refuses to look past the first index and
  # fails dependency resolution). Matches tests.yml line 22's setting.
  # Caught 2026-05-21 when PR #301's train-batch run failed at deps install
  # with "no version of requests==2.33.0" — same code path that's been
  # working for tests.yml since migration but silently absent here.
  UV_INDEX_STRATEGY: unsafe-best-match

permissions:
  contents: read

jobs:
  detect:
    # Shared with train-ec2.yml via _detect-positions.yml. See that file for
    # the path → positions logic; src/scripts/scope_positions.py is the
    # contract-tested mapping.
    uses: ./.github/workflows/_detect-positions.yml

  dedup_check:
    # Workflow-level concurrency serializes same-SHA runs. By the time a
    # queued duplicate runs this job, the first run has either succeeded
    # (this sets skip=true → train short-circuits) or failed (skip=false →
    # train retries). Manual workflow_dispatch bypasses dedup because
    # operators dispatch deliberately. Even on the first run for a fresh
    # SHA the API call is ~3 s — cheap enough that the always-on overhead
    # is invisible compared to the ~15 min train job it potentially saves.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    permissions:
      contents: read
      actions: read
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "Event $EVENT_NAME bypasses dedup (manual dispatch always runs)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --commit filters server-side, so the --limit cap is now "up to N
          # runs for THIS SHA" (effectively unbounded — a SHA realistically
          # only fires 2-3 duplicates) rather than "up to N total successes
          # across all SHAs" (where 20+ unrelated successes could mask Run 1).
          # `|| echo "0"` defaults to "no prior found → proceed" if the gh
          # API call fails transiently — better to over-run (one unnecessary
          # re-train) than under-train (silent skip due to network blip,
          # because `needs: dedup_check` would otherwise cascade to a train-
          # job skip if this job exits non-zero under set -eu).
          PRIOR=$(gh run list \
            --repo "$REPO" \
            --workflow=train-batch.yml \
            --commit "$HEAD_SHA" \
            --status=success \
            --limit=20 \
            --json databaseId \
            --jq "[.[] | select((.databaseId | tostring) != \"$RUN_ID\")] | length" \
            2>/dev/null || echo "0")
          if [ "${PRIOR:-0}" -gt 0 ]; then
            echo "Found $PRIOR prior successful train-batch run(s) for $HEAD_SHA — short-circuiting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No prior successful runs for $HEAD_SHA — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  train:
    needs: [detect, dedup_check]
    # Gate: (a) detect found something to train; (b) either a manual dispatch
    # (smoke-test break-glass, bypasses BATCH_ACTIVE), or the upstream image
    # build succeeded AND BATCH_ACTIVE=true AND no prior successful run for
    # this SHA (dedup short-circuit on duplicate workflow_run fires).
    if: >
      needs.detect.outputs.positions != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.BATCH_ACTIVE == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        needs.dedup_check.outputs.skip != 'true'))
    runs-on: ubuntu-latest
    # Worst case: attempts=3 Spot retries × 1800s per attempt = 90 min per
    # chronically-interrupted position, parallel = 90 min + cold-start + post.
    # 180 min ceiling keeps a hung run from spinning forever.
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0
          # Admin PAT so the later benchmark-history push bypasses main's
          # required status checks (enforce_admins=false on classic protection).
          token: ${{ secrets.PROTECTED_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - name: Install launch + benchmark deps
        # requirements-dev.txt mirrors train-ec2.yml — src/batch/benchmark.py's
        # import chain pulls torch. src/batch/launch.py needs boto3, which is
        # in requirements.txt.
        run: uv pip install --system -r requirements-dev.txt

      - name: Resolve Batch job-definition revision for this image
        # batch-image.yml stashed the revision number under the image's commit
        # SHA after registering it. Without pinning, AWS Batch resolves bare
        # job-definition names to the latest active revision at submit time —
        # so two parallel train-batch runs (image A and image B, both
        # registered in the same window) submit against the same (latest)
        # revision, and the run triggered by image A can silently train image
        # B's code. workflow_dispatch (smoke-test break-glass) has no upstream
        # workflow_run, so it falls back to bare-name resolution.
        id: revision
        if: github.event_name != 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          REVISION=$(aws s3 cp \
            "s3://${S3_BUCKET}/job-def-revisions/${HEAD_SHA}.txt" - \
            --region "$AWS_REGION" \
            --no-cli-pager)
          if [ -z "$REVISION" ]; then
            echo "ERROR: no revision file at s3://${S3_BUCKET}/job-def-revisions/${HEAD_SHA}.txt" >&2
            echo "Refusing to fall back to latest revision — that reintroduces the race." >&2
            exit 1
          fi
          echo "Pinning job submissions to ${JOB_DEFINITION:-ff-training-job}:${REVISION}"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Submit Batch jobs and wait
        id: train
        env:
          POSITIONS: ${{ needs.detect.outputs.positions }}
          # Empty when workflow_dispatch (no upstream image build to pin to);
          # launch.py treats empty as "no revision" and falls back to name-only
          # resolution (current behavior).
          FF_JOB_DEFINITION_REVISION: ${{ steps.revision.outputs.revision }}
          # The SHA the image being trained was built from. Threads through
          # launch.py → containerOverrides → train.py → benchmark_metrics.json,
          # so benchmark.py can warn when any position's recorded SHA diverges
          # from the run's expected SHA. Empty under workflow_dispatch (no
          # upstream image build); benchmark.py treats empty as "skip the
          # coherency check."
          FF_TRAIN_GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          STARTED_AT=$(date +%s)
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          SEED="${{ github.event.inputs.seed || '42' }}"
          # launch.py blocks on wait_for_jobs(); returns 0 only if all
          # positions reach SUCCEEDED. --skip-upload because CI has no local
          # data/splits/*.parquet — the splits in s3://ff-predictor-training/data/
          # are refreshed out-of-band by a developer running launch.py from a
          # workstation.
          python -m src.batch.launch \
            --positions $POSITIONS \
            --seed "$SEED" \
            --skip-upload

      - name: Verify model artifact freshness
        # Anchor on when training STARTED, not "now" — Spot parallelism makes
        # this less likely to false-trip than the sequential EC2 path, but
        # the same logic protects against e.g. a chronically retrying job
        # whose artifact predates this run.
        env:
          POSITIONS: ${{ needs.detect.outputs.positions }}
        run: |
          train_started_at="${{ steps.train.outputs.started_at }}"
          echo "| Position | Status | LastModified | Size (MB) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|--------------|-----------|" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for POS in $POSITIONS; do
            META=$(aws s3api head-object \
              --bucket "$S3_BUCKET" \
              --key "models/$POS/model.tar.gz" \
              --region "$AWS_REGION" 2>/dev/null || echo '{}')
            LM=$(echo "$META" | jq -r '.LastModified // empty')
            SZ=$(echo "$META" | jq -r '.ContentLength // 0')
            if [ -z "$LM" ]; then
              echo "| $POS | MISSING | — | — |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
              continue
            fi
            lm_ts=$(date -d "$LM" +%s)
            age=$(( train_started_at - lm_ts ))
            status="OK"
            if [ "$age" -gt 1200 ]; then status="STALE (${age}s before train start)"; fail=1; fi
            mb=$(awk "BEGIN{printf \"%.1f\", $SZ/1048576}")
            echo "| $POS | $status | $LM | $mb |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $fail

      - name: Append Batch run to benchmark_history/
        # MUST run before "Refresh ECS service" — the benchmark append also
        # mirrors the JSON to s3://{bucket}/models/benchmark_history/ (see
        # src/batch/benchmark.py::_maybe_upload_to_s3). The new ECS task's
        # boot-time sync_benchmark_history_from_s3 reads that prefix, and the
        # in-container result is cached for the task's lifetime (cache key is
        # the dir mtime, which never bumps post-boot). Refreshing ECS before
        # the new JSON exists in S3 means the History tab won't show this run
        # until the next training run rolls the service.
        env:
          GH_TOKEN: ${{ github.token }}
          FF_MODEL_S3_BUCKET: ${{ env.S3_BUCKET }}
          FF_MODEL_S3_PREFIX: models
          POSITIONS: ${{ needs.detect.outputs.positions }}
          # Branch + head SHA come from a workflow_run trigger whose payload
          # is attacker-controllable (e.g. a fork that happens to share a
          # branch name). CodeQL flags any direct ${{ }} interpolation into a
          # ``run:`` block as a code-injection vector even when the upstream
          # path filters look safe; routing through env vars makes the value
          # a normal shell variable that downstream commands can quote.
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUMBER=""
          if [ -n "$HEAD_SHA" ]; then
            PR_NUMBER=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
              --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          git fetch origin "$BRANCH"
          git pull --rebase origin "$BRANCH"
          PR_ARGS=()
          if [ -n "$PR_NUMBER" ]; then
            PR_ARGS=(--pr-number "$PR_NUMBER")
            echo "Resolved PR #$PR_NUMBER for $HEAD_SHA"
          else
            echo "No PR resolved for $HEAD_SHA (direct push or workflow_dispatch)"
          fi
          # ``--git-hash $GITHUB_SHA``: pin the recorded SHA to the image
          # SHA, not the workspace HEAD — the ``git pull --rebase`` above
          # can advance the workspace past the image-build SHA when PRs
          # land mid-run. See TODO.md "Benchmark git_hash recorded the
          # wrong SHA on rapid back-to-back merges" archive entry.
          python -m src.batch.benchmark \
            --download-only \
            --backend batch \
            --instance-type "g4dn.xlarge (Spot)" \
            --positions $POSITIONS \
            --note "Batch Spot auto-run (${GITHUB_SHA::7})" \
            --git-hash "$GITHUB_SHA" \
            "${PR_ARGS[@]}"

      - name: Kick off ECS rolling deploy (non-blocking)
        # Same flow as train-ec2.yml — force a rolling redeploy so the
        # task's boot-time sync_models_from_s3 picks up the freshly promoted
        # manifests AND sync_benchmark_history_from_s3 picks up the JSON
        # uploaded by the previous step. update-service returns ~1s; the
        # services-stable wait moved to ecs_refresh_sentinel below (~3 min
        # off the critical path). Model-load-regression detection rationale
        # is preserved there. Note: PR #302's in-flight per-position
        # manifest poll already delivers fresh models within ~30s of the
        # Batch position's manifest write, so this ECS refresh is
        # belt-and-suspenders for model delivery — kept until in-flight
        # refresh is proven over 2 retrain cycles, then can be removed
        # entirely.
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --force-new-deployment \
            --no-cli-pager > /dev/null

      - name: Commit and push benchmark_history/
        env:
          # Same env-indirection rationale as the previous step.
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmark_history/
          if git diff --cached --quiet -- benchmark_history/; then
            echo "No history changes — skipping commit."
            exit 0
          fi
          staged=$(git diff --cached --name-only)
          unexpected=$(echo "$staged" | grep -v '^benchmark_history/' || true)
          if [ -n "$unexpected" ]; then
            echo "ERROR: unexpected staged paths (expected benchmark_history/ only):"
            echo "$unexpected"
            exit 1
          fi
          git commit -m "chore(ci): append Batch benchmark run ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            if git push origin HEAD:"refs/heads/$BRANCH"; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed — rebasing and retrying"
            git pull --rebase origin "$BRANCH"
          done
          echo "Push failed after 3 attempts"
          exit 1

  ecs_refresh_sentinel:
    # Non-blocking wait for ECS to stabilize after the rolling deploy kicked
    # off in the train job. Split off the critical path to cut ~3 min off
    # train-batch.yml wall-clock (~20% of the 15-min pipeline). PR #302's
    # in-flight per-position manifest poll already makes the ECS refresh
    # redundant for model delivery (first-finished position is live within
    # ~30s of its manifest write); this sentinel is retained as the belt-
    # and-suspenders path until the in-flight refresh is proven over 2
    # retrain cycles (per PR #302's planned follow-up). Preserves the
    # model-load-regression detection rationale from the original step.
    needs: train
    runs-on: ubuntu-latest
    # Failure here does NOT fail the headline workflow — the model is
    # already in S3 and the in-flight serving refresh path picks it up
    # within ~30s. A stalled services-stable surfaces in this job's status
    # and the workflow summary; the training pipeline reports green
    # regardless.
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for ECS service to stabilize
        id: wait
        run: |
          if aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"; then
            echo "ECS service stabilized successfully."
            echo "- ECS refresh: service stabilized within wait window." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ECS service did not stabilize within wait window."
            echo "- ECS refresh: **service did not stabilize within wait window** — investigate ECS task health (in-flight model refresh path still active, so serving is likely unaffected)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
