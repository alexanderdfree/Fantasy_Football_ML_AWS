name: Train on Batch (Spot)

# Active training path when BATCH_ACTIVE=true. Fires after batch-image.yml
# pushes a fresh image to ECR, then submits one Batch job per position to the
# ff-training-queue queue backed by a single diversified Spot compute
# environment ff-gpu-spot (instanceTypes g6.xlarge + g5.xlarge, picked by
# SPOT_PRICE_CAPACITY_OPTIMIZED). Each position trains in parallel on its own
# 4-vCPU single-GPU host. See docs/batch_design.md.
#
# When BATCH_ACTIVE != 'true' the gate on the `train` job below skips this
# workflow on workflow_run; train-ec2.yml stays active. workflow_dispatch
# always bypasses the gate as a smoke-test break-glass.

on:
  workflow_run:
    workflows: ["Build & Push Batch Training Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      positions:
        description: "Space-separated positions to train"
        default: "QB RB WR TE K DST"
      seed:
        description: "Random seed"
        default: "42"
      image_sha:
        description: "Full 40-character source SHA of an already-built training image"
        required: true
        type: string

concurrency:
  # Group keyed by the SHA the upstream image was built from (workflow_run)
  # or the dispatch ref (workflow_dispatch). Different SHAs preserve the
  # Spot fan-out + cross-PR parallelism the original no-concurrency comment
  # intended; same-SHA duplicates serialize. GitHub Actions fires
  # workflow_run.completed multiple times per upstream completion (observed
  # 2–3 deliveries per merge on the 2026-05-21 sweep) — without this group,
  # every duplicate burned ~15 min of CI on a run whose only possible outcome
  # was a no-op against the prior run's submitted Batch jobs. cancel-in-progress
  # is false because the first run may already be mid-submit when the
  # duplicate fires; canceling could orphan Batch jobs at the AWS layer. The
  # `dedup_check` job below short-circuits the queued duplicate so it spends
  # ~1 min on detect/dedup-API-call rather than the full ~15 min. The
  # constrained warm-EC2 path keeps its own `train-ec2` cancel-in-progress
  # group; that decision lives with the constrained path.
  group: train-batch-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  FF_MAINTENANCE_LOCK_TABLE: ${{ vars.FF_MAINTENANCE_LOCK_TABLE }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ff-predictor-training
  FF_BENCHMARK_RUN_ID: train-${{ github.run_id }}-${{ github.run_attempt }}
  # Serving ECS service, rolled after a successful train (see the ecs_rollout
  # job). PR #330 removed the post-train rollover on the theory that the
  # in-flight manifest poller (FF_MODEL_REFRESH_INTERVAL_S) would hot-swap new
  # stable artifacts without one. That holds for a weight-only retrain, but an
  # architecture-changing retrain leaves a long-running task's loaded checkpoint
  # shape-incompatible with the new serving code: e.g. #1175 dropped the
  # opp-defense attention branch for QB/RB/WR/TE, so load_state_dict on the old
  # two-branch artifact failed, attn preds went NaN, and the comparison/metrics
  # tabs silently dropped those positions until a task happened to recycle —
  # fantasy.alexfree.me served that stale state for ~4 days (2026-06-15→06-19,
  # see TODO.md fixed-archive). A forced rollover guarantees a clean boot-time
  # sync against the freshly promoted stable artifact. Mirrors train-ec2.yml.
  ECS_CLUSTER: fantasy-cluster
  ECS_SERVICE: fantasy-service
  # Required for `uv pip install -r requirements-dev.txt` to resolve transitive
  # deps that exist on multiple indexes (e.g. `requests`, found on PyTorch CPU
  # index but at a different version than the one resolved by other deps —
  # without unsafe-best-match, uv refuses to look past the first index and
  # fails dependency resolution). Matches tests.yml line 22's setting.
  # Caught 2026-05-21 when PR #301's train-batch run failed at deps install
  # with "no version of requests==2.33.0" — same code path that's been
  # working for tests.yml since migration but silently absent here.
  UV_INDEX_STRATEGY: unsafe-best-match
  # Stream launch.py / benchmark.py output as it happens. Without this, Python
  # block-buffers stdout on the non-TTY runner and the entire 3h poll log
  # flushes only at process exit — the 2026-06-08/06-10 Spot-starvation
  # timeouts (runs 27161472255 / 27299375573) showed 3h of dead air and then
  # every line stamped with the exit time, which made live triage and
  # post-hoc forensics needlessly hard.
  PYTHONUNBUFFERED: "1"
  # Public serving URL for the post-train cache-warm probe. Distinct from the
  # ECS control-plane vars above (used by ecs_rollout): warming is a plain
  # HTTPS GET to /warm through the ALB, exactly like a user request. See the
  # "Warm serving cache" step.
  # The Flask app is on the `fantasy` subdomain (apex is a separate personal
  # site — see deploy.yml); the stale apex value here meant every post-train
  # warm probe silently 404'd and the S3 predictions cache went stale
  # (caught 2026-06-11: cache stamped Jun-8 despite ~10 retrains).
  SERVICE_URL: https://fantasy.alexfree.me

permissions:
  contents: read

jobs:
  detect:
    # Shared with train-ec2.yml via _detect-positions.yml. See that file for
    # the path → positions logic; src/scripts/scope_positions.py is the
    # contract-tested mapping.
    uses: ./.github/workflows/_detect-positions.yml

  dedup_check:
    # GitHub Actions fires workflow_run.completed multiple times per
    # upstream completion (observed 2–3 deliveries per merge). The
    # workflow-level concurrency group serializes same-SHA runs, then
    # this job short-circuits subsequent duplicates by checking an S3
    # success marker that the train job writes only on real train
    # success. Manual workflow_dispatch bypasses dedup because operators
    # dispatch deliberately. S3 HEAD is ~200 ms — invisible compared to
    # the ~15 min train job it potentially saves.
    #
    # S3 marker (not the prior `gh run list --commit "$HEAD_SHA"` query):
    # GitHub Actions exposes TWO different head_sha values on a
    # workflow_run-triggered run — the event-payload
    # `workflow_run.head_sha` (stable, = the SHA the upstream image was
    # built FROM) and the run-LEVEL head_sha (= current main HEAD when
    # the downstream run was queued). `gh run list --commit` filters by
    # the latter, but the dedup query passed the former, so on rapid
    # back-to-back merges the two diverged for the same run and dedup
    # false-skipped genuine trains (PR #309 on 2026-05-21, deduped
    # against PR #307's run #69 whose run-level head_sha had raced to
    # 04ef622). The S3 marker is keyed by workflow_run.head_sha — the
    # same identifier used by the working job-def-revisions/${HEAD_SHA}.txt
    # pattern below — so writer and reader can't drift. The marker is
    # written by the train job ONLY after artifact-freshness passes, so
    # it also fixes the prior bug where a positions=empty run that
    # skipped train was treated as a "successful train" by dedup.
    #
    # Gated on BATCH_ACTIVE (mirroring the `train` job's gate) so the EC2
    # rollback path doesn't burn CI minutes + an S3 head-object call on
    # every batch-image.yml completion. workflow_dispatch still runs it so
    # an operator smoke-test of the Batch path resolves dedup normally.
    # When skipped, `train`'s `if:` already short-circuits on the same
    # BATCH_ACTIVE clause (and a skipped job's empty `skip` output is
    # `!= 'true'`), so the gate stays consistent.
    if: vars.BATCH_ACTIVE == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        if: github.event_name == 'workflow_run'
        # SHA-pinned per CodeQL actions/unpinned-tag; version is recorded below.
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "Event $EVENT_NAME bypasses dedup (manual dispatch always runs)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if aws s3api head-object \
               --bucket "$S3_BUCKET" \
               --key "train-success-markers/${HEAD_SHA}.txt" \
               --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Found prior train-success marker for $HEAD_SHA — short-circuiting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No prior marker for $HEAD_SHA — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  train:
    outputs:
      data_release: ${{ steps.build_plan.outputs.dataset_id }}
    needs: [detect, dedup_check]
    # Gate: (a) detect found something to train; (b) either a manual dispatch
    # (smoke-test break-glass, bypasses BATCH_ACTIVE), or the upstream image
    # build succeeded AND BATCH_ACTIVE=true AND no prior successful run for
    # this SHA (dedup short-circuit on duplicate workflow_run fires).
    if: >
      needs.detect.outputs.positions != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.BATCH_ACTIVE == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        needs.dedup_check.outputs.skip != 'true'))
    runs-on: ubuntu-latest
    # Budget (GitHub-hosted job hard cap is 360):
    #   setup + submit            ~2 min
    #   splits-ready gate         ≤21 min (its 20-min poll + overhead)
    #   launch.py wait            ≤300 min (FF_WAIT_TIMEOUT=18000 below)
    #   recovery re-check         ≤10 min (only runs when the wait failed)
    #   post steps (verify/append/push/marker)  ~5 min
    #   total ≈ 338, ceiling 350 keeps ~12 min slack.
    # The wait was raised from the launch.py default of 180 min after the
    # 2026-06-08/06-10 Spot capacity starvation (runs 27161472255 /
    # 27299375573): jobs sat RUNNABLE ~3h, the wait expired, and the jobs
    # SUCCEEDED 3-29 min later — training itself takes ~1 min/position, so
    # queue time dominates and the wait should consume the job's headroom
    # rather than give up with 30 idle minutes left. The ceiling MUST stay
    # above the wait so the post-train steps (freshness verify, benchmark
    # append, push, marker write) run rather than being killed mid-wait — a
    # kill there skips the success-marker write and the next
    # workflow_run.completed delivery re-triggers a full retrain.
    timeout-minutes: 350
    permissions:
      contents: write
      # For the loud-failure path: the recovery step files a tracking issue
      # when training never reaches SUCCEEDED, so a missing benchmark row is
      # impossible to miss (the failed run itself proved easy to overlook —
      # both starvation timeouts went unnoticed until the rows were missed).
      issues: write
    steps:
      - name: Configure AWS credentials
        # SHA-pinned per CodeQL actions/unpinned-tag; version is recorded below.
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0
          # Admin PAT so the later benchmark-history push bypasses main's
          # required status checks (enforce_admins=false on classic protection).
          token: ${{ secrets.PROTECTED_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        # SHA-pinned per CodeQL actions/unpinned-tag; version is recorded below.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - name: Install launch + benchmark deps
        # requirements-dev.txt mirrors train-ec2.yml — src/batch/benchmark.py's
        # import chain pulls torch. src/batch/launch.py needs boto3, which is
        # in requirements.txt.
        run: uv pip install --system -r requirements-dev.txt

      - name: Resolve Batch job-definition revision for this image
        # batch-image.yml stashed the revision number under the image's commit
        # SHA after registering it. Without pinning, AWS Batch resolves bare
        # job-definition names to the latest active revision at submit time —
        # so two parallel train-batch runs (image A and image B, both
        # registered in the same window) submit against the same (latest)
        # revision, and the run triggered by image A can silently train image
        # B's code. Manual dispatch requires the same explicit image pin.
        id: revision
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.image_sha }}
          BATCH_SPLIT_ACTIVE: ${{ vars.BATCH_SPLIT_ACTIVE }}
        run: |
          set -euo pipefail
          args=(batch --sha "$HEAD_SHA" --bucket "$S3_BUCKET")
          if [ "${BATCH_SPLIT_ACTIVE,,}" = "true" ]; then
            args+=(--split)
          fi
          python -m src.scripts.resolve_training_image "${args[@]}"

      - name: Register image source and select immutable execution plan
        id: build_plan
        timeout-minutes: 62
        env:
          CODE_SHA: ${{ steps.revision.outputs.image_sha }}
          GPU_REVISION: ${{ steps.revision.outputs.revision }}
          CPU_REVISION: ${{ steps.revision.outputs.cpu_revision }}
          SPLIT_ACTIVE: ${{ vars.BATCH_SPLIT_ACTIVE }}
          POSITIONS: ${{ needs.detect.outputs.positions }}
          SEED: ${{ github.event.inputs.seed || '42' }}
        run: |
          set -euo pipefail
          gpu="ff-training-job${GPU_REVISION:+:$GPU_REVISION}"
          args=(--bucket "$S3_BUCKET" --code-sha "$CODE_SHA"
                --gpu-definition "$gpu" --positions $POSITIONS --seed "$SEED"
                --timeout 3600 --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                --output batch_build_plan.json)
          if [ "${SPLIT_ACTIVE,,}" = "true" ]; then
            args+=(--cpu-definition "ff-training-cpu-job${CPU_REVISION:+:$CPU_REVISION}")
          fi
          # Missing CODE_SHA on manual dispatch is inferred from the pinned
          # image definition. Wait for that image's exact data-source tree;
          # missing mappings, failed refreshes and timeouts block submission.
          # The command registers full source ancestry and reserves publication
          # intents before writing the plan shared by every split job/retry.
          python -m src.orchestration.build_plan "${args[@]}"

      - name: Submit Batch jobs and wait
        id: train
        # Don't fail the job here: the recovery step below re-checks the
        # submitted jobs when this step exits non-zero (Spot starvation can
        # outlast any fixed wait — see the timeout-minutes comment), and the
        # final "Fail when training did not complete" step restores the
        # failure when recovery doesn't pan out. Downstream steps gate on
        # steps.train.outcome / steps.recover.outputs.recovered explicitly.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          POSITIONS: ${{ needs.detect.outputs.positions }}
          # 300 min (vs the launch.py default of 180): Spot queue time
          # dominates the ~1 min/position training, so spend the job's
          # headroom waiting. Keep below the step/job ceilings so launch.py
          # exits on its own clean TIMED_OUT path (full log, per-position
          # status) instead of being SIGKILLed mid-poll.
          FF_WAIT_TIMEOUT: "18000"
          # Breadcrumb consumed by the recovery step: launch.py records the
          # submitted job ids + expected positions here so a wait that
          # expired minutes before the jobs reached SUCCEEDED can still be
          # turned into a completed run (append + marker) instead of a
          # silently missing benchmark row.
          FF_BATCH_JOB_IDS_FILE: batch_job_ids.json
          FF_REQUIRE_BUILD_PLAN: "1"
          FF_BUILD_PLAN_ID: ${{ steps.build_plan.outputs.build_plan_id }}
          FF_DATASET_ID: ${{ steps.build_plan.outputs.dataset_id }}
          FF_DATA_RELEASE: ${{ steps.build_plan.outputs.dataset_id }}
          FF_DATA_FORMAT: data-release-v1
          # Makes launch.py's _emit_batch_lifecycle_ledger write the W0
          # orchestration-vs-run breakdown (per-job queue_provision_s / run_s)
          # to the workspace; the "Persist Batch lifecycle ledger" step below
          # mirrors it to S3 so a warm-AMI before/after cold-start comparison
          # has a durable baseline. Otherwise the ledger is log-only/ephemeral
          # (only the [timing] phase=batch_lifecycle CloudWatch lines survive).
          FF_BATCH_LIFECYCLE_FILE: batch_lifecycle.json
          # Empty when workflow_dispatch (no upstream image build to pin to);
          # launch.py treats empty as "no revision" and falls back to name-only
          # resolution (current behavior).
          FF_JOB_DEFINITION_REVISION: ${{ steps.revision.outputs.revision }}
          FF_JOB_DEFINITION_CPU_REVISION: ${{ steps.revision.outputs.cpu_revision }}
          # The SHA the image being trained was built from. Threads through
          # launch.py → containerOverrides → train.py → benchmark_metrics.json,
          # so benchmark.py can warn when any position's recorded SHA diverges
          # from the run's expected SHA. Manual dispatch without image_sha
          # uses the resolved image tag, which may predate the runner checkout.
          FF_TRAIN_GIT_SHA: ${{ steps.build_plan.outputs.git_sha }}
          # CUDA graphs autodetect ON in the container on the Batch GPU pool
          # (g6/L4 sm_89 primary, g5/A10G sm_86 fallback) —
          # cuda_graph_enabled() defaults on for sm_80+, so the fan-out is
          # graphed by default. This repo variable is an optional FLEET OVERRIDE,
          # not the trigger: leave it unset for the autodetect default, or set
          # FF_BATCH_CUDA_GRAPH=0 to force the whole fan-out back to the eager
          # path. launch.py forwards it to the container only when set.
          FF_CUDA_GRAPH: ${{ vars.FF_BATCH_CUDA_GRAPH }}
          # The FULL-STEP graph (gather+forward+loss+backward) also autodetects
          # ON for sm_80+ via cuda_graph_full_enabled(). This SECOND optional
          # fleet override degrades full-step → model-only across the fan-out
          # (keeps the ~1.84x model-only win) WITHOUT going all-eager: leave it
          # unset for the autodetect default, or set FF_BATCH_CUDA_GRAPH_FULL=0
          # to drop to the model-only graph (use FF_BATCH_CUDA_GRAPH=0 above for
          # full eager). launch.py forwards it to the container only when set.
          FF_CUDA_GRAPH_FULL: ${{ vars.FF_BATCH_CUDA_GRAPH_FULL }}
          BATCH_SPLIT_ACTIVE: ${{ vars.BATCH_SPLIT_ACTIVE }}
          EVENT_NAME: ${{ github.event_name }}
          SEED: ${{ github.event.inputs.seed || '42' }}
        run: |
          STARTED_AT=$(date +%s)
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          # SEED arrives via env (above) to avoid splicing workflow_dispatch
          # input into the shell at templating time; validate it's an integer.
          case "$SEED" in
            ""|*[!0-9]*) echo "Invalid seed: $SEED" >&2; exit 1 ;;
          esac
          # launch.py blocks on wait_for_jobs(); returns 0 only if all
          # positions reach SUCCEEDED. --skip-upload because CI selected an
          # immutable dataset/build plan above; every container materializes
          # that snapshot rather than reading the mutable legacy data/ prefix.
          # Completing jobs publish the immutable run history; the later append
          # step retrieves the same row for the git audit trail.
          PR_NUMBER=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${FF_TRAIN_GIT_SHA}/pulls" \
            --jq '.[0].number // empty' 2>/dev/null || true)
          LAUNCH_ARGS=(
            --positions $POSITIONS
            --seed "$SEED"
            --skip-upload
            --history-run-id "$FF_BENCHMARK_RUN_ID"
            --collect-history false
          )
          if [ -n "$PR_NUMBER" ]; then LAUNCH_ARGS+=(--pr-number "$PR_NUMBER"); fi
          split_active=$(echo "${BATCH_SPLIT_ACTIVE:-false}" | tr 'A-Z' 'a-z')
          if [ "$split_active" = "true" ]; then
            if [ -z "${FF_JOB_DEFINITION_CPU_REVISION:-}" ]; then
              echo "ERROR: split mode requires the plan's pinned CPU revision." >&2
              exit 1
            fi
            export FF_JOB_DEFINITION_CPU="ff-training-cpu-job"
            export FF_JOB_QUEUE_CPU="ff-cpu-training-queue"
            split_sha="${FF_TRAIN_GIT_SHA:-$GITHUB_SHA}"
            SPLIT_RUN_ID="${split_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            LAUNCH_ARGS+=(--split --split-run-id "$SPLIT_RUN_ID")
            echo "Split Batch mode active: split_run_id=$SPLIT_RUN_ID"
          fi
          python -m src.batch.launch "${LAUNCH_ARGS[@]}"

      - name: Recover - re-check Batch job status after a failed wait
        # launch.py exiting non-zero means some job wasn't SUCCEEDED when its
        # wait expired — NOT that training failed. On 2026-06-08 (run
        # 27161472255) all six Spot-starved jobs SUCCEEDED 0.5-3.5 min after
        # the wait gave up; the benchmark append, history push, and dedup
        # marker were all skipped and the run's MAE record silently vanished.
        # This step re-checks the exact submitted job ids (launch.py's
        # FF_BATCH_JOB_IDS_FILE breadcrumb) with a bounded grace poll, and
        # flips `recovered=true` when every job reached SUCCEEDED and every
        # expected position was actually submitted — the downstream steps then
        # proceed as if the wait had seen the completions itself. When the
        # jobs still aren't done (or genuinely FAILED), it files a tracking
        # issue so the missing benchmark row is loud, and leaves the final
        # fail step to redden the job. Fail-open: this step always exits 0 so
        # an AWS API hiccup here can't mask the real outcome.
        id: recover
        if: steps.train.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.build_plan.outputs.git_sha }}
        run: |
          set -u
          recovered=false
          states_summary="(no job-ids breadcrumb — launch.py failed before submitting)"
          if [ -f batch_job_ids.json ]; then
            mapfile -t ids < <(jq -r '.jobs[]' batch_job_ids.json)
            covered=$(jq -r '(.jobs | keys) as $k
              | [.expected_positions[] | . as $p
                 | ($k | map(. == $p or startswith($p + "/")) | any)] | all' \
              batch_job_ids.json)
            if [ "${#ids[@]}" -eq 0 ] || [ "$covered" != "true" ]; then
              states_summary="(submit was partial: jobs=${#ids[@]}, expected positions not all covered)"
            else
              # Grace poll: 20 x 30s = 10 min. Sized for the observed gap
              # between wait expiry and late Spot completions (3.5 min on
              # 06-08); anything longer is handled by the bigger
              # FF_WAIT_TIMEOUT, and anything longer still is a real failure.
              for i in $(seq 1 20); do
                states=$(aws batch describe-jobs --jobs "${ids[@]}" \
                  --region "$AWS_REGION" --output json \
                  | jq -r '.jobs[].status' || true)
                n_seen=$(printf '%s\n' "$states" | grep -c . || true)
                states_summary=$(printf '%s\n' "$states" | sort | uniq -c | tr -s ' ' | tr '\n' ';')
                if [ "$n_seen" -eq "${#ids[@]}" ] \
                   && ! printf '%s\n' "$states" | grep -qv '^SUCCEEDED$'; then
                  recovered=true
                  break
                fi
                # A terminal FAILED can't un-fail; stop polling early.
                if printf '%s\n' "$states" | grep -q '^FAILED$'; then
                  break
                fi
                sleep 30
              done
            fi
          fi
          echo "recovered=$recovered" >> "$GITHUB_OUTPUT"
          if [ "$recovered" = "true" ]; then
            echo "::warning::launch.py wait expired but all Batch jobs reached SUCCEEDED — proceeding with benchmark append + marker (states: $states_summary)"
            exit 0
          fi
          echo "::error::Batch training for ${HEAD_SHA::7} did not complete within the wait: $states_summary. Completing jobs can still publish history."
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "train-batch: run for ${HEAD_SHA::7} exceeded the workflow wait" \
            --body "$(printf '%s\n' \
              "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "Head SHA: ${HEAD_SHA}" \
              "Batch job states at last check: ${states_summary}" \
              "" \
              "The wait + recovery grace poll expired. Full/merge jobs publish their own immutable results for ${FF_BENCHMARK_RUN_ID}; once all positions finish, the last job publishes the History row to S3 even though this workflow has stopped waiting. The git history commit and train-success marker were skipped. To retry collection without retraining, run src.batch.benchmark --download-only --run-id ${FF_BENCHMARK_RUN_ID} with this run's positions. A failed position still requires investigation.")" \
            || echo "::warning::could not file tracking issue (continuing)"
          exit 0

      - name: Persist Batch lifecycle ledger
        # Mirror the W0 orchestration-vs-run ledger (written by launch.py to
        # batch_lifecycle.json via FF_BATCH_LIFECYCLE_FILE on the train step) to
        # s3://{bucket}/batch_lifecycle/{sha}-{run}.json so a warm-AMI cutover's
        # before/after cold-start win has a durable queue_provision_s baseline
        # to diff against — as shipped the ledger is otherwise log-only and
        # vanishes with the run's CloudWatch logs. if: always() because the
        # train step exits non-zero on a Spot timeout, yet launch.py still
        # writes a ledger for every job that reached a terminal state
        # (SUCCEEDED/FAILED) — so a partial fan-out is still captured. A run
        # where NO job terminated (pure Spot starvation / all TIMED_OUT) or
        # where launch.py died before submitting writes nothing, and the
        # file-existence guard below skips cleanly.
        if: always()
        env:
          HEAD_SHA: ${{ steps.build_plan.outputs.git_sha }}
        run: |
          if [ ! -f batch_lifecycle.json ]; then
            echo "No batch_lifecycle.json — launch.py wrote no ledger (no jobs reached terminal state); skipping."
            exit 0
          fi
          key="batch_lifecycle/${HEAD_SHA}-${GITHUB_RUN_ID}.json"
          if aws s3 cp batch_lifecycle.json "s3://${S3_BUCKET}/${key}" --region "$AWS_REGION"; then
            echo "Persisted Batch lifecycle ledger to s3://${S3_BUCKET}/${key}"
          else
            echo "::warning::could not upload batch_lifecycle.json to S3 (instrumentation only — continuing)"
          fi

      - name: Verify exact published build artifacts
        if: steps.train.outcome == 'success' || steps.recover.outputs.recovered == 'true'
        env:
          FF_BUILD_PLAN_ID: ${{ steps.build_plan.outputs.build_plan_id }}
        run: |
          python -m src.artifacts.receipts --bucket "$S3_BUCKET" --plan-id "$FF_BUILD_PLAN_ID"

      - name: Build and publish serving cache from verified artifacts
        if: steps.train.outcome == 'success' || steps.recover.outputs.recovered == 'true'
        env:
          FF_MODEL_S3_BUCKET: ${{ env.S3_BUCKET }}
          FF_MODEL_S3_PREFIX: models
          FF_BUILD_PLAN_ID: ${{ steps.build_plan.outputs.build_plan_id }}
          FF_TRAIN_GIT_SHA: ${{ steps.build_plan.outputs.git_sha }}
          FF_DATASET_ID: ${{ steps.build_plan.outputs.dataset_id }}
          FF_DATA_RELEASE: ${{ steps.build_plan.outputs.dataset_id }}
          FF_DATA_FORMAT: data-release-v1
          FF_DEVICE: cpu
          FF_ALLOW_RUNTIME_INFERENCE: "1"
        run: python -m src.prediction.build_snapshot

      - name: Append Batch run to benchmark_history/
        # Mirrors the JSON to s3://{bucket}/models/benchmark_history/ (see
        # src/batch/benchmark.py::_maybe_upload_to_s3) so the serving
        # container's boot-time sync_benchmark_history_from_s3 picks it up on
        # the next task roll — which the ecs_rollout job (needs: train) now
        # forces, so the History tab reflects this run's JSON without waiting
        # for a task to recycle on its own. This step runs in `train` (before
        # ecs_rollout) so the JSON is in S3 by the time the rollover boots.
        if: steps.train.outcome == 'success' || steps.recover.outputs.recovered == 'true'
        env:
          FF_BUILD_PLAN_ID: ${{ steps.build_plan.outputs.build_plan_id }}
          GH_TOKEN: ${{ github.token }}
          FF_MODEL_S3_BUCKET: ${{ env.S3_BUCKET }}
          FF_MODEL_S3_PREFIX: models
          # The sm_80+ Batch GPU path autodetects graphs ON, so rows are
          # labeled graphed below (keeps them separate from the pre-cutover eager
          # baseline — graphed and eager rows aren't bit-comparable). This
          # optional fleet override (FF_BATCH_CUDA_GRAPH=0) forces eager + the
          # plain label.
          FF_CUDA_GRAPH: ${{ vars.FF_BATCH_CUDA_GRAPH }}
          # FF_BATCH_CUDA_GRAPH_FULL=0 degrades full-step → model-only (keeps the
          # ~1.84x model-only win) rather than going all-eager; graphs stay ON,
          # so the CUDA-graph label below is still honest (the case fallback only
          # strips the suffix when FF_CUDA_GRAPH disables capture entirely). The
          # runtime hardware label is derived from train.py's stamped
          # gpu_name + cuda_graph_active fields, so it tracks the live scope.
          FF_CUDA_GRAPH_FULL: ${{ vars.FF_BATCH_CUDA_GRAPH_FULL }}
          POSITIONS: ${{ needs.detect.outputs.positions }}
          # Branch + head SHA come from a workflow_run trigger whose payload
          # is attacker-controllable (e.g. a fork that happens to share a
          # branch name). CodeQL flags any direct ${{ }} interpolation into a
          # ``run:`` block as a code-injection vector even when the upstream
          # path filters look safe; routing through env vars makes the value
          # a normal shell variable that downstream commands can quote.
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HEAD_SHA: ${{ steps.build_plan.outputs.git_sha }}
        run: |
          PR_NUMBER=""
          if [ -n "$HEAD_SHA" ]; then
            PR_NUMBER=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
              --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          git fetch origin "$BRANCH"
          git pull --rebase origin "$BRANCH"
          PR_ARGS=()
          if [ -n "$PR_NUMBER" ]; then
            PR_ARGS=(--pr-number "$PR_NUMBER")
            echo "Resolved PR #$PR_NUMBER for $HEAD_SHA"
          else
            echo "No PR resolved for $HEAD_SHA (direct push or workflow_dispatch)"
          fi
          # Human label for the note: image-build SHA when present, else the
          # workspace SHA on a manual dispatch. Truncated to 7 chars.
          NOTE_SHA="${HEAD_SHA:-$GITHUB_SHA}"
          NOTE_SHA="${NOTE_SHA::7}"
          # ``--git-hash "$HEAD_SHA"``: pin the recorded SHA to the image
          # build SHA (``github.event.workflow_run.head_sha``), NOT
          # ``$GITHUB_SHA``. On a workflow_run trigger ``$GITHUB_SHA`` is the
          # run-LEVEL head_sha (current main HEAD when this run was queued),
          # which diverges from the image-build SHA on rapid back-to-back
          # merges — the same two-head_sha trap the dedup_check fix
          # documents. ``$HEAD_SHA`` is the stable image-build SHA that
          # FF_TRAIN_GIT_SHA stamps into each position's metrics, so the
          # recorded ``git_hash`` matches benchmark.py's per-position
          # coherency check (find_git_sha_divergence) instead of
          # false-flagging divergence. Empty under workflow_dispatch (no
          # upstream image build); benchmark.py then falls back to the
          # workspace HEAD via get_git_hash(), which is correct for a
          # manual run. See TODO.md "Benchmark git_hash recorded the wrong
          # SHA on rapid back-to-back merges" archive entry.
          # Hardware label for the History tab is DERIVED AT RUNTIME by
          # src/batch/benchmark.py from the gpu_name + cuda_graph_active fields
          # src/batch/train.py stamps into each position's benchmark_metrics.json,
          # so it tracks the live CE with no edit here (g6.xlarge / L4 sm_89 or
          # g5.xlarge / A10G sm_86 + ", CUDA-graph" today; auto-updates if the
          # CE ever changes again) —
          # the silent-drift the old hardcoded string risked is gone. The value
          # below is only a FALLBACK, used when a run carries no GPU metadata
          # (pre-stamping artifacts / all-CPU run); it mirrors the current
          # g6+g5 diversified graphed pool, and the force-off case keeps
          # the fallback honest when FF_CUDA_GRAPH disables capture.
          INSTANCE_TYPE="g6.xlarge/g5.xlarge (Spot, CUDA-graph)"
          case "$(echo "${FF_CUDA_GRAPH:-}" | tr 'A-Z' 'a-z')" in
            0|false|no|off) INSTANCE_TYPE="g6.xlarge/g5.xlarge (Spot)" ;;
          esac
          python -m src.batch.benchmark \
            --download-only \
            --run-id "$FF_BENCHMARK_RUN_ID" \
            --backend batch \
            --instance-type "$INSTANCE_TYPE" \
            --positions $POSITIONS \
            --note "Batch Spot auto-run (${NOTE_SHA})" \
            --git-hash "$HEAD_SHA" \
            "${PR_ARGS[@]}"
          # Keep the tracked convenience table out of the history-only commit.
          git restore --worktree benchmark_results.json

      - name: Commit and push benchmark_history/
        if: steps.train.outcome == 'success' || steps.recover.outputs.recovered == 'true'
        env:
          # Same env-indirection rationale as the previous step.
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HEAD_SHA: ${{ steps.build_plan.outputs.git_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmark_history/
          if git diff --cached --quiet -- benchmark_history/; then
            echo "No history changes — skipping commit."
            exit 0
          fi
          staged=$(git diff --cached --name-only)
          unexpected=$(echo "$staged" | grep -v '^benchmark_history/' || true)
          if [ -n "$unexpected" ]; then
            echo "ERROR: unexpected staged paths (expected benchmark_history/ only):"
            echo "$unexpected"
            exit 1
          fi
          # Label the commit with the image/head SHA the benchmark JSON pins
          # (HEAD_SHA), not the run-level GITHUB_SHA which diverges on rapid
          # merges — keeps `git log --grep <sha>` correlation intact.
          MSG_SHA="${HEAD_SHA:-$GITHUB_SHA}"
          git commit -m "chore(ci): append Batch benchmark run ${MSG_SHA::7}"
          for attempt in 1 2 3; do
            if git push origin HEAD:"refs/heads/$BRANCH"; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed — rebasing and retrying"
            git pull --rebase origin "$BRANCH"
          done
          echo "Push failed after 3 attempts"
          exit 1

      - name: Write train-success marker for dedup
        # Atomic dedup marker for the next workflow_run.completed delivery
        # of the same upstream image build (GitHub fires 2–3 per upstream
        # completion). Keyed by workflow_run.head_sha to match the
        # job-def-revisions/ convention below — same identifier on both
        # writer and reader prevents the run-level vs workflow_run
        # head_sha drift that false-skipped PR #309 on 2026-05-21.
        #
        # Placed AFTER both freshness verification AND the benchmark commit
        # push. The implicit ``if: success()`` on each step means a failure
        # in any earlier step (artifact freshness, benchmark append, git
        # push) skips the marker — re-runs then go through the full train
        # path rather than short-circuiting on a partial-success marker.
        # Trade-off: a transient push failure on benchmark_history/ now
        # causes a full retrain on the next workflow_run.completed delivery
        # (~15 min), where the previous ordering would have skipped that
        # retrain via the already-written marker. The retrain is the safer
        # failure mode — it guarantees benchmark/marker consistency
        # (S3 marker present ⇒ benchmark already on main) and avoids the
        # orphan-benchmark state where the marker says "trained" but the
        # benchmark never landed.
        #
        # The explicit train/recover clause replaces the implicit
        # ``if: success()`` that `continue-on-error: true` on the train step
        # would otherwise defeat: a timed-out wait whose jobs never recovered
        # must NOT write the marker (the next delivery should retrain), while
        # a recovered run must (its benchmark just landed).
        if: >
          github.event_name != 'workflow_dispatch' &&
          (steps.train.outcome == 'success' || steps.recover.outputs.recovered == 'true')
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" | aws s3 cp - \
            "s3://${S3_BUCKET}/train-success-markers/${HEAD_SHA}.txt" \
            --region "$AWS_REGION" \
            --no-cli-pager

      - name: Fail when training did not complete
        # `continue-on-error: true` on the train step keeps the job alive for
        # the recovery re-check; this step restores the failure signal when
        # neither the wait nor the recovery saw every job SUCCEEDED. (The
        # recovery step already annotated ::error:: and filed the tracking
        # issue — this exists so the run itself goes red and warm_cache
        # skips, exactly as before the recovery flow existed.)
        if: steps.train.outcome == 'failure' && steps.recover.outputs.recovered != 'true'
        env:
          HEAD_SHA: ${{ steps.build_plan.outputs.git_sha }}
        run: |
          echo "::error::Training for ${HEAD_SHA::7} did not complete within the wait + recovery window — failing the run. See the recovery step's tracking issue."
          exit 1

  ecs_rollout:
    # A complete cache generation, its data release, and the deployed recipe
    # are verified together before changing ECS or ALB state.
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-fantasy-service
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Acquire maintenance publication lease
        if: vars.FF_MAINTENANCE_LOCK_TABLE != ''
        run: python3 -m src.maintenance.coordination acquire --owner "${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"

      - name: Advance verified serving data release
        env:
          DATA_RELEASE: ${{ needs.train.outputs.data_release }}
        run: |
          python3 -m src.scripts.advance_data_release --bucket "$S3_BUCKET" \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --release-id "$DATA_RELEASE" \
            --state data-release-rollout.json --timeout 1200
      - name: Restore interrupted serving rollout
        if: failure() || cancelled()
        run: |
          if [ -f data-release-rollout.json ]; then
            python3 -m src.artifacts.deployment restore --state data-release-rollout.json
          fi

      - name: Release maintenance publication lease
        if: always() && vars.FF_MAINTENANCE_LOCK_TABLE != ''
        run: python3 -m src.maintenance.coordination release --owner "${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"

  warm_cache:
    # Workers hydrate the verified artifact; serving performs no training-data
    # rebuild or model inference. The release-aware rollout has already passed.
    needs: [train, ecs_rollout]
    runs-on: ubuntu-latest
    steps:
      - name: Check published serving readiness
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 "${SERVICE_URL%/}/ready"
