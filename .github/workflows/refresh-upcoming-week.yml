name: Refresh upcoming-week projections

# Builds the live next-week projections artifact (data/serving_cache/
# upcoming_week.json) OUT of the serving container and uploads it to
# s3://${S3_BUCKET}/models/predictions_cache/upcoming_week.json. The serving
# container only downloads + serves it (src/serving/upcoming_week.py:
# sync_artifact_from_s3 / start_artifact_download_poller). See ADR-0018: the
# in-serving build OOM'd the 2-worker task (PBP rebuild + a runtime 2025-PBP
# download), so the heavy load_raw_data + build_features + inference runs here,
# where network + memory are ample.
#
# Fires on:
#   - schedule: hourly, off the busy top of the hour. GitHub's scheduler is
#     best effort; additional opportunities reduce missed-refresh downtime.
#   - workflow_run: after "Train on Batch (Spot)" completes — new models change
#     the projections, so rebuild immediately (the other half of "fresh": models
#     change rarely, lines/injuries change continuously, so we need both).
#   - workflow_dispatch: manual kick.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: ["Train on Batch (Spot)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  # An unsuccessful training notification must not evict a useful pending
  # refresh before its job-level `if` is evaluated. Give skipped events unique
  # groups; eligible events keep one running build and the latest pending one.
  group: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && 'refresh-upcoming-week' || format('refresh-upcoming-week-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ff-predictor-training
  FF_MODEL_S3_BUCKET: ff-predictor-training
  FF_MODEL_S3_PREFIX: models
  # uv otherwise refuses the PyTorch CPU index for multi-registry transitive
  # deps (mirrors tests.yml / refresh-splits.yml).
  UV_INDEX_STRATEGY: unsafe-best-match

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # up to 60 min for compatible data plus the existing build budget
    # Don't rebuild on a FAILED train run (models didn't change); cron/manual
    # always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        # SHA-pinned per CodeQL actions/unpinned-tag; version is recorded below.
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - name: Install dependencies
        # requirements-dev.txt (= requirements.txt + CPU torch): the build runs
        # the full pipeline (load_raw_data + build_features) and NN inference, so
        # torch is required (matches refresh-splits.yml).
        run: uv pip install --system -r requirements-dev.txt

      - name: Pin compatible data for the offline artifact builder
        timeout-minutes: 62
        run: |
          python -m src.scripts.wait_data_release --bucket "$FF_MODEL_S3_BUCKET" \
            --revision "$GITHUB_SHA" --timeout-seconds 3600 --pin-training

      - name: Build + upload upcoming-week artifact
        # Pull the same models + data the serving container uses (data/raw,
        # data/splits, models) from S3, then build the artifact off the live ESPN
        # slate and upload it. FF_MODEL_S3_BUCKET makes both the model load and
        # the artifact upload target prod. ESPN + nflverse PBP are fetched live
        # (CI has reliable network — the exact thing the serving task lacked).
        # Source requests already retry. S3 publication retries the built bytes
        # in upcoming_artifact; never rerun this expensive step for upload alone.
        run: |
          python - <<'PY'
          from src.shared.model_sync import sync_data_from_s3, sync_models_from_s3
          sync_data_from_s3()
          sync_models_from_s3()
          PY
          python -m src.prediction.upcoming
