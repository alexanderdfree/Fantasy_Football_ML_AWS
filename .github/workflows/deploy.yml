name: Deploy to ECS

on:
  push:
    branches: [main]
    # Only redeploy Flask when the serving surface actually changes. The
    # serving image imports src/serving/, src/shared/, src/features/,
    # src/{POS}/, src/config.py, src/data/ — i.e. everything under src/
    # EXCEPT the tuning, analysis, benchmarking, scripts, and tests
    # subtrees. Negative patterns at the end refine the broad src/**
    # include. ``docs/`` is bundled into the image (Dockerfile:
    # ``COPY docs/ docs/``) and read at runtime by
    # ``src.serving.app._render_wiki_doc`` to power the in-app wiki tab, so
    # doc-only edits must redeploy too. The explicit per-file entries below
    # (root wiki .md sources, infra READMEs, gunicorn config) mirror the
    # non-``src/`` COPY lines in the Dockerfile — keep this list in sync
    # when adding or removing Dockerfile COPY lines.
    paths:
      - "src/**"
      - "docs/**"
      - "README.md"
      - "SETUP.md"
      - "TODO.md"
      - "infra/ec2/README.md"
      - "infra/aws/README.md"
      - "gunicorn.conf.py"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
      - "!src/batch/**"
      - "!src/tuning/**"
      - "!src/analysis/**"
      - "!src/benchmarking/**"
      - "!src/scripts/**"
      - "!src/**/tests/**"
  # Manual trigger for one-offs — re-deploying after a non-code change like
  # an S3 model refresh, or after a deploy that completed successfully but
  # didn't roll the task because of an ECS-side hiccup.
  workflow_dispatch:

concurrency:
  # One ECS rollout at a time per ref — concurrent pushes to main would
  # otherwise race on ``update-service``/``wait services-stable``. Let the
  # in-flight deploy drain rather than cancelling it mid-rollout.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: fantasy-predictor
  ECS_CLUSTER: fantasy-cluster
  ECS_SERVICE: fantasy-service
  TASK_FAMILY: fantasy-predictor
  # Public serving URL for the post-deploy cache-warm probe (plain HTTPS GET
  # to /warm; see the final step). Fresh tasks hydrate the S3 cache at boot
  # when models are unchanged — this just warms any worker that raced traffic.
  # NB: the Flask app is on the `fantasy` subdomain; the apex `alexfree.me` is a
  # separate static portfolio, so a /warm probe there 404s (was the bug here).
  SERVICE_URL: https://fantasy.alexfree.me

# Read-only GITHUB_TOKEN — the deploy job authenticates to AWS via secrets
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY), not via OIDC, so no
# ``id-token: write`` is needed. The only repo-side action is ``actions/checkout``.
# Explicit minimum satisfies CodeQL's actions/missing-workflow-permissions rule.
permissions:
  contents: read

jobs:
  # Tests run in tests.yml (matrix across positions). Branch protection on
  # main requires those checks to pass before a PR can merge, so we trust
  # the merged SHA here and go straight to the ECS rollout.
  deploy:
    # Native arm64 runner — the serving image targets linux/arm64, so running
    # on Ampere/Cobalt avoids QEMU emulation (was ~3-5x slower for Python C
    # extension installs).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = aws-actions/configure-aws-credentials v4
        # tip as of 2026-05-21.
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b  # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = aws-actions/amazon-ecr-login v2 tip as
        # of 2026-05-21.
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2

      - name: Set up Docker Buildx
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = docker/setup-buildx-action v3 tip as of
        # 2026-05-21.
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      # Local cache backend persists BuildKit `--mount=type=cache` directories
      # (uv's wheel cache in the Dockerfile) across CI runs. The gha backend
      # persists layer cache reliably but not cache mounts
      # (moby/buildkit#1512), so we run both in parallel — same pattern as
      # batch-image.yml.
      - name: Cache BuildKit state
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('requirements.txt', 'Dockerfile') }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Build, tag, push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --cache-from type=gha \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=gha,mode=max \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .

      # Swap caches so actions/cache stores the freshly-written one on
      # post-job save, rather than the (now stale) input cache.
      - name: Move BuildKit cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Pull current task definition
        # Start from the live task def (preserves the real ARNs / env / secrets /
        # log config), swap the image below — but source cpu/memory from the
        # in-repo infra/aws/task-definition.json so serving capacity is codified
        # in git rather than drifting on whatever the last register-task-definition
        # set. The prediction-cache recompute needs 8 GB headroom: on a cold /
        # fingerprint-drifted boot both gunicorn workers recompute concurrently
        # and OOM'd the 4 GB task (2026-06-15 incident; see ADR-0018). Only the
        # two scalar capacity fields are read from the file (the rest of it is a
        # placeholder setup template), so this never reintroduces __PLACEHOLDER__s.
        run: |
          aws ecs describe-task-definition --task-definition $TASK_FAMILY \
            --query 'taskDefinition' --output json \
          | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
          > task-definition.json
          cpu=$(jq -r '.cpu' infra/aws/task-definition.json)
          mem=$(jq -r '.memory' infra/aws/task-definition.json)
          jq --arg cpu "$cpu" --arg mem "$mem" '.cpu = $cpu | .memory = $mem' \
            task-definition.json > task-definition.pinned.json
          mv task-definition.pinned.json task-definition.json
          echo "Pinned serving capacity from infra/aws/task-definition.json: cpu=$cpu memory=$mem"

      - name: Update image in task definition
        id: render-task-def
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = aws-actions/amazon-ecs-render-task-
        # definition v1 tip as of 2026-05-21.
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea  # v1
        with:
          task-definition: task-definition.json
          container-name: fantasy-predictor
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # Tune the ALB target group so each rolling deploy isn't held up by
      # AWS defaults that were built for stateful long-poll services. Idempotent —
      # no-op when already set. Runs *before* the deploy so the about-to-drain
      # task uses the shorter deregistration delay.
      #
      #   - deregistration_delay.timeout_seconds = 30   (default 300)
      #     Old-task drain. Flask request p99 is <1s; 30s is generous and saves
      #     ~270s per rolling redeploy.
      #   - HealthyThresholdCount         = 2          (default 5)
      #   - HealthCheckIntervalSeconds    = 10         (default 30)
      #     Mark a fresh task healthy after ~20s instead of 5×30s=150s, saving
      #     ~130s on the new-task half of the rollout.
      #
      # Target-group ARN is discovered from the service so this stays in sync
      # with whatever target group the service is actually attached to.
      - name: Tune ALB target group for fast rolling deploys
        run: |
          TG_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].loadBalancers[0].targetGroupArn' \
            --output text)
          if [ -z "$TG_ARN" ] || [ "$TG_ARN" = "None" ]; then
            echo "ERROR: could not resolve target group for $ECS_SERVICE"
            exit 1
          fi
          echo "Tuning target group: $TG_ARN"
          aws elbv2 modify-target-group-attributes \
            --target-group-arn "$TG_ARN" \
            --region "$AWS_REGION" \
            --attributes Key=deregistration_delay.timeout_seconds,Value=30 \
            --no-cli-pager > /dev/null
          aws elbv2 modify-target-group \
            --target-group-arn "$TG_ARN" \
            --region "$AWS_REGION" \
            --healthy-threshold-count 2 \
            --health-check-interval-seconds 10 \
            --no-cli-pager > /dev/null

      - name: Deploy to ECS
        # Pinned per CodeQL actions/unpinned-tag — bump SHA when upgrading the
        # major version comment. SHA = aws-actions/amazon-ecs-deploy-task-
        # definition v2 tip as of 2026-05-21.
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de  # v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          # Don't block the workflow on full service stability — push the new
          # task def + deployment and return. The ECS deployment circuit breaker
          # (enabled on the service, rollback=true) still guards prod: a task set
          # that can't pass ELB health checks is rolled back automatically. This
          # trades the (up to 20 min) in-workflow stability wait for a faster
          # "deploy to live ASAP" turnaround; confirm a rollout via
          # `aws ecs describe-services` if you need the post-deploy status.
          wait-for-service-stability: false
          force-new-deployment: true

      - name: Warm serving cache
        # Belt-and-suspenders after the rollout: fresh tasks already hydrate
        # the S3 prediction cache at boot (D14) when models are unchanged, but
        # a few /warm probes ensure every gunicorn worker across the
        # desiredCount=2 tasks is warm before traffic. Never block the deploy
        # on a warm miss — post_fork + lazy compute remain the backstop.
        continue-on-error: true
        run: |
          warm_url="${SERVICE_URL%/}/warm"
          echo "Warming $warm_url"
          for _ in $(seq 1 8); do
            curl -fsS --max-time 150 "$warm_url" \
              | jq -c '{fingerprint, rows, elapsed_s, degraded_positions}' || true
          done
