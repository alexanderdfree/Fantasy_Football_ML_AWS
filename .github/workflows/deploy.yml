name: Deploy to ECS

on:
  push:
    branches: [main]
    # Only redeploy Flask when the serving surface actually changes. The
    # serving image imports src/serving/, src/shared/, src/features/,
    # src/{POS}/, src/config.py, src/data/ — i.e. everything under src/
    # EXCEPT the tuning, analysis, benchmarking, scripts, and tests
    # subtrees. Negative patterns at the end refine the broad src/**
    # include. ``docs/`` is bundled into the image (Dockerfile:
    # ``COPY docs/ docs/``) and read at runtime by
    # ``src.serving.app._render_wiki_doc`` to power the in-app wiki tab, so
    # doc-only edits must redeploy too. The explicit per-file entries below
    # (root wiki .md sources, infra READMEs, gunicorn config) mirror the
    # non-``src/`` COPY lines in the Dockerfile — keep this list in sync
    # when adding or removing Dockerfile COPY lines.
    paths:
      - "src/**"
      - "docs/**"
      - "README.md"
      - "SETUP.md"
      - "TODO.md"
      - "infra/ec2/README.md"
      - "infra/aws/README.md"
      - "gunicorn.conf.py"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "requirements-serving.txt"
      - ".github/workflows/deploy.yml"
      - "!src/batch/**"
      - "!src/tuning/**"
      - "!src/analysis/**"
      - "!src/benchmarking/**"
      - "!src/scripts/**"
      - "!src/**/tests/**"
  # Manual trigger for one-offs — re-deploying after a non-code change like
  # an S3 model refresh, or after a deploy that completed successfully but
  # didn't roll the task because of an ECS-side hiccup.
  workflow_dispatch:

concurrency:
  # Every ref targets the same service and ALB readiness settings. Serialize
  # those mutations across refs and let incomplete rollouts restore health.
  group: deploy-fantasy-service
  cancel-in-progress: false

env:
  FF_MAINTENANCE_LOCK_TABLE: ${{ vars.FF_MAINTENANCE_LOCK_TABLE }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: fantasy-predictor
  ECS_CLUSTER: fantasy-cluster
  ECS_SERVICE: fantasy-service
  TASK_FAMILY: fantasy-predictor
  # Public serving URL for the post-deploy cache-warm probe (plain HTTPS GET
  # to /warm; see the final step). Fresh tasks hydrate the S3 cache at boot
  # when models are unchanged — this just warms any worker that raced traffic.
  # NB: the Flask app is on the `fantasy` subdomain; the apex `alexfree.me` is a
  # separate static portfolio, so a /warm probe there 404s (was the bug here).
  SERVICE_URL: https://fantasy.alexfree.me

# Read-only GITHUB_TOKEN — the deploy job authenticates to AWS via secrets
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY), not via OIDC, so no
# ``id-token: write`` is needed. The only repo-side action is ``actions/checkout``.
# Explicit minimum satisfies CodeQL's actions/missing-workflow-permissions rule.
permissions:
  contents: read

jobs:
  # Tests run in tests.yml (matrix across positions). Branch protection on
  # main requires those checks to pass before a PR can merge, so we trust
  # the merged SHA here and go straight to the ECS rollout.
  deploy:
    # Native arm64 runner — the serving image targets linux/arm64, so running
    # on Ampere/Cobalt avoids QEMU emulation (was ~3-5x slower for Python C
    # extension installs).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        # SHA-pinned per CodeQL actions/unpinned-tag; version is recorded below.
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        # SHA-pinned per CodeQL actions/unpinned-tag; version is recorded below.
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7

      - name: Set up Docker Buildx
        # SHA-pinned per CodeQL actions/unpinned-tag; version is recorded below.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # One local layer-cache archive per image/architecture. Native cold/warm
      # comparisons favored this over per-layer GHA exports. Layer archives
      # do not persist uv download-cache mounts across fresh builders.
      - name: Cache BuildKit state
        id: buildx-cache
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: buildx-serving-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements-serving.txt', 'Dockerfile') }}
          restore-keys: |
            buildx-serving-${{ runner.os }}-${{ runner.arch }}-

      - name: Build, tag, push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          CACHE_HIT: ${{ steps.buildx-cache.outputs.cache-hit }}
        run: |
          # Misses and fallback restores still populate a new primary key.
          CACHE_EXPORT_ARGS=()
          if [ "$CACHE_HIT" != "true" ]; then
            CACHE_EXPORT_ARGS=(--cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max)
          fi
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --cache-from type=local,src=/tmp/.buildx-cache \
            "${CACHE_EXPORT_ARGS[@]}" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .

      # Swap caches so actions/cache stores the freshly-written one on
      # post-job save, rather than the (now stale) input cache.
      - name: Move BuildKit cache
        if: steps.buildx-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Pull current task definition
        # Start from the live task def (preserves the real ARNs / env / secrets /
        # log config). Explicitly compose the capacity/platform, readiness probe
        # and artifact-only policy owned by the repository. Copying only CPU and
        # memory would retain a live /health override of the image's /ready probe.
        run: |
          current_task=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          test -n "$current_task" && test "$current_task" != "None"
          echo "FF_ORIGINAL_TASK_DEFINITION=$current_task" >> "$GITHUB_ENV"
          aws ecs describe-task-definition --task-definition "$current_task" \
            --query 'taskDefinition' --output json > task-definition.json
          python -m src.artifacts.deployment --live task-definition.json \
            --desired infra/aws/task-definition.json --output task-definition.json

      - name: Update image in task definition
        id: render-task-def
        # SHA-pinned per CodeQL actions/unpinned-tag; version is recorded below.
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea  # v1.9.0
        with:
          task-definition: task-definition.json
          container-name: fantasy-predictor
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Acquire maintenance publication lease
        if: vars.FF_MAINTENANCE_LOCK_TABLE != ''
        run: python3 -m src.maintenance.coordination acquire --lease-seconds 5400 --owner "${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"

      - name: Require a compatible published serving snapshot
        # Verify the source the rendered container will actually consume.
        env:
          FF_RENDERED_TASK_DEFINITION: ${{ steps.render-task-def.outputs.task-definition }}
        run: |
          python -m src.artifacts.serving_snapshot wait \
            --task-definition "$FF_RENDERED_TASK_DEFINITION" --bind-data --timeout 2400

      - name: Deploy to ECS
        # /health?readiness=1 preserves old images' health response while new
        # images require hydrated artifacts. Only 200 passes throughout; the
        # exact new revision/container must be ready before switching to /ready.
        # Failure restores the prior service and health settings.
        env:
          FF_RENDERED_TASK_DEFINITION: ${{ steps.render-task-def.outputs.task-definition }}
        run: |
          python -m src.artifacts.deployment deploy \
            --task-definition "$FF_RENDERED_TASK_DEFINITION" \
            --expected-current-task "$FF_ORIGINAL_TASK_DEFINITION" \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --region "$AWS_REGION" \
            --state serving-rollout.json --timeout 1200

      - name: Restore health settings after incomplete rollout
        if: failure() || cancelled()
        run: |
          python -m src.artifacts.deployment restore \
            --state serving-rollout.json --region "$AWS_REGION"

      - name: Release maintenance publication lease
        if: always() && vars.FF_MAINTENANCE_LOCK_TABLE != ''
        run: python3 -m src.maintenance.coordination release --owner "${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"

      - name: Warm serving cache
        # Belt-and-suspenders after the rollout: fresh tasks already hydrate
        # the S3 prediction cache at boot (D14) when models are unchanged, but
        # a few /warm probes ensure every gunicorn worker across the
        # desiredCount=2 tasks have hydrated. ALB/container readiness already
        # gates traffic; these probes are advisory and never run model inference.
        continue-on-error: true
        run: |
          warm_url="${SERVICE_URL%/}/warm"
          echo "Warming $warm_url"
          for _ in $(seq 1 8); do
            curl -fsS --max-time 150 "$warm_url" \
              | jq -c '{fingerprint, rows, elapsed_s, degraded_positions}' || true
          done
