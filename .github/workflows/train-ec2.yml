name: Train on EC2

# EC2 rollback training path (runs only when BATCH_ACTIVE != 'true';
# train-batch.yml is the active path) — fires after batch-image.yml pushes a
# fresh image to ECR, then sends an SSM Run Command to the warm g6.xlarge.
# See docs/ec2_design.md.

on:
  workflow_run:
    workflows: ["Build & Push Batch Training Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      positions:
        description: "Space-separated positions to train"
        default: "QB RB WR TE K DST"
      seed:
        description: "Random seed"
        default: "42"
      image_sha:
        description: "Full 40-character source SHA of an already-built training image"
        required: true
        type: string

concurrency:
  group: train-ec2
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ff-predictor-training
  FF_MODEL_S3_PREFIX: models
  # Same cluster/service deploy.yml targets — used by the post-train ECS
  # rollover step so freshly promoted stable model artifacts get picked
  # up by the running task without a code-change deploy.
  ECS_CLUSTER: fantasy-cluster
  ECS_SERVICE: fantasy-service

permissions:
  contents: read

jobs:
  detect:
    # Shared with train-batch.yml via _detect-positions.yml. See that file
    # for the path → positions logic; src/scripts/scope_positions.py is the
    # contract-tested mapping.
    uses: ./.github/workflows/_detect-positions.yml

  train:
    outputs:
      data_release: ${{ steps.data-release.outputs.release_id }}
    needs: detect
    # Gate: (a) detect found something to train; (b) either a manual dispatch
    # (break-glass — bypasses BATCH_ACTIVE so the EC2 path can be tested even
    # when Batch is active), or the upstream image build succeeded AND the
    # Batch trainer is NOT the active path. Flipping BATCH_ACTIVE=true sends
    # workflow_run training to train-batch.yml instead.
    if: >
      needs.detect.outputs.positions != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.BATCH_ACTIVE != 'true' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Configure AWS credentials
        # SHA-pinned per CodeQL actions/unpinned-tag; version is recorded below.
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0
          # Admin PAT so the later benchmark-history push bypasses main's
          # required status checks (enforce_admins=false on classic protection).
          token: ${{ secrets.PROTECTED_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install history-update deps
        # requirements-dev.txt, not requirements.txt: src/batch/benchmark.py's
        # import chain (src.batch.launch → src.shared.registry → src.shared.aggregate_targets)
        # pulls torch since cc0c627 added the attention NN. Mirrors tests.yml.
        run: pip install -r requirements-dev.txt

      - name: Resolve immutable training image
        id: image
        env:
          REQUESTED_IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.image_sha }}
        run: |
          set -euo pipefail
          python -m src.scripts.resolve_training_image ec2 --sha "$REQUESTED_IMAGE_SHA"

      - name: Resolve instance ID
        id: inst
        run: |
          ID="${{ vars.EC2_TRAINER_INSTANCE_ID }}"
          if [ -z "$ID" ]; then
            echo "EC2_TRAINER_INSTANCE_ID repo variable is not set. Run infra/ec2/launch-instance.sh first."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Wait for compatible published training data
        id: data-release
        timeout-minutes: 62
        env:
          HEAD_SHA: ${{ steps.image.outputs.image_sha }}
        run: |
          python -m src.scripts.wait_data_release --bucket "$S3_BUCKET" \
            --revision "$HEAD_SHA" --timeout-seconds 3600 --pin-training


      - name: Register selected training source
        env:
          FF_TRAIN_GIT_SHA: ${{ steps.image.outputs.image_sha }}
        run: |
          python -m src.scripts.register_training_source --sha "$FF_TRAIN_GIT_SHA" \
            --bucket "$S3_BUCKET" --prefix "$FF_MODEL_S3_PREFIX" --repo .

      - name: Start instance (no-op if already running)
        run: |
          aws ec2 start-instances --instance-ids "${{ steps.inst.outputs.id }}" --region "$AWS_REGION" >/dev/null
          aws ec2 wait instance-running --instance-ids "${{ steps.inst.outputs.id }}" --region "$AWS_REGION"

      - name: Wait for SSM agent online
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.inst.outputs.id }}" \
              --region "$AWS_REGION" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "None")
            if [ "$STATUS" = "Online" ]; then
              echo "SSM online"
              exit 0
            fi
            echo "SSM status: $STATUS (attempt $i/30)"
            sleep 10
          done
          echo "Timed out waiting for SSM"
          exit 1

      - name: Verify bootstrap breadcrumb
        run: |
          CMD_ID=$(aws ssm send-command \
            --targets "Key=InstanceIds,Values=${{ steps.inst.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["test -f /opt/ff/config/bootstrap-complete && cat /opt/ff/config/bootstrap-complete"]' \
            --region "$AWS_REGION" --query Command.CommandId --output text)
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.inst.outputs.id }}" \
            --region "$AWS_REGION"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.inst.outputs.id }}" \
            --region "$AWS_REGION" \
            --query StandardOutputContent --output text

      - name: Install current pinned-image ff-train wrapper
        # Bootstrap and warm hosts use the same checked-in wrapper template.
        # Validate then atomically replace it; unchanged content is a no-op.
        run: |
          python -m src.scripts.ec2_wrapper --region "$AWS_REGION" --bucket "$S3_BUCKET" \
            --output /tmp/ff-wrapper-ssm.json
          CMD_ID=$(aws ssm send-command \
            --targets "Key=InstanceIds,Values=${{ steps.inst.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/ff-wrapper-ssm.json \
            --region "$AWS_REGION" --query Command.CommandId --output text)
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "${{ steps.inst.outputs.id }}" --region "$AWS_REGION"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ steps.inst.outputs.id }}" \
            --region "$AWS_REGION" --query StandardOutputContent --output text


      - name: Run training for all positions (sequential)
        id: train
        env:
          POSITIONS: ${{ needs.detect.outputs.positions }}
          SEED: ${{ github.event.inputs.seed || '42' }}
          FF_TRAIN_GIT_SHA: ${{ steps.image.outputs.image_sha }}
          FF_TRAIN_IMAGE: ${{ steps.image.outputs.image_uri }}
          FF_TRAIN_IMAGE_ID: ${{ steps.image.outputs.image_uri }}
          FF_LEGACY_RUN_ID: "ec2:${{ github.run_id }}:${{ github.run_attempt }}"
        run: |
          STARTED_AT=$(date +%s)
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          # Validate and quote every remote argument before JSON encoding.
          # One stable run ID is reused by all position retries in this attempt.
          python - <<'PYCODE'
          import json, os, shlex
          positions = os.environ["POSITIONS"].split()
          if not positions or any(p not in {"QB", "RB", "WR", "TE", "K", "DST"} for p in positions):
              raise SystemExit("Invalid training position list")
          seed = os.environ["SEED"]
          if not seed.isdecimal():
              raise SystemExit("Invalid seed")
          names = ("FF_TRAIN_GIT_SHA", "FF_TRAIN_IMAGE", "FF_TRAIN_IMAGE_ID", "FF_LEGACY_RUN_ID", "FF_MODEL_S3_PREFIX", "FF_DATA_RELEASE", "FF_DATASET_ID", "FF_DATA_FORMAT")
          assignments = " ".join(f"{name}={shlex.quote(os.environ[name])}" for name in names)
          commands = ["set -eu", "export " + assignments]
          commands += [f"/usr/local/bin/ff-train {shlex.quote(pos)} {shlex.quote(seed)}" for pos in positions]
          with open("/tmp/ssm-params.json", "w") as stream:
              json.dump({"commands": ["; ".join(commands)], "executionTimeout": ["7800"]}, stream)
          PYCODE
          CMD_ID=$(aws ssm send-command \
            --targets "Key=InstanceIds,Values=${{ steps.inst.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --comment "train-ec2 $FF_TRAIN_GIT_SHA" \
            --parameters file:///tmp/ssm-params.json \
            --cloud-watch-output-config "CloudWatchLogGroupName=/ff/training,CloudWatchOutputEnabled=true" \
            --region "$AWS_REGION" --query Command.CommandId --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Training command: $CMD_ID"

      - name: Wait for training to complete
        run: |
          # Manual poll loop. `aws ssm wait command-executed` has a hard-coded
          # 20-attempt x 5s cap (~100s) that AWS_MAX_ATTEMPTS / --cli-read-timeout
          # don't override, so long runs were being reported as failures even
          # though the SSM command succeeded on the instance.
          CMD_ID="${{ steps.train.outputs.command_id }}"
          INST="${{ steps.inst.outputs.id }}"
          deadline=$(( $(date +%s) + 7800 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INST" \
              --region "$AWS_REGION" \
              --query Status --output text)
            case "$STATUS" in
              Success)                    echo "Training succeeded"; exit 0 ;;
              Cancelled|TimedOut|Failed)  echo "Training terminal: $STATUS"; exit 1 ;;
              Pending|InProgress|Delayed) echo "Status: $STATUS -- sleeping 15s"; sleep 15 ;;
              *)                          echo "Unknown status: $STATUS"; exit 1 ;;
            esac
          done
          echo "Timed out after 130 min"
          exit 1

      - name: Cancel SSM training command on cancel/failure
        if: (cancelled() || failure()) && steps.train.outputs.command_id != ''
        run: |
          # On GH cancel or local poll timeout, the SSM command keeps running
          # on the instance and its bash process keeps the /var/lock/ff-train.lock
          # flock held, blocking the next train run. Cancelling the SSM command
          # lets SSM terminate that bash process, which closes FD 200 and
          # releases the flock. `|| true` so an already-terminal command (cancel
          # returns non-zero) is a no-op.
          aws ssm cancel-command \
            --command-id "${{ steps.train.outputs.command_id }}" \
            --instance-ids "${{ steps.inst.outputs.id }}" \
            --region "$AWS_REGION" || true

      - name: Stream training output to Actions log
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.train.outputs.command_id }}" \
            --instance-id "${{ steps.inst.outputs.id }}" \
            --region "$AWS_REGION" \
            --query '{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}' \
            --output json

      - name: Verify exact EC2 run artifacts
        env:
          POSITIONS: ${{ needs.detect.outputs.positions }}
          FF_TRAIN_GIT_SHA: ${{ steps.image.outputs.image_sha }}
          FF_TRAIN_IMAGE_ID: ${{ steps.image.outputs.image_uri }}
          FF_LEGACY_RUN_ID: "ec2:${{ github.run_id }}:${{ github.run_attempt }}"
        run: |
          python - <<'PYCODE'
          import os, tempfile
          from pathlib import Path
          import boto3
          from src.artifacts.receipts import load_run_receipt, download_run_artifact
          s3 = boto3.client("s3")
          bucket, prefix = os.environ["S3_BUCKET"], os.environ["FF_MODEL_S3_PREFIX"]
          source, run_id = os.environ["FF_TRAIN_GIT_SHA"], os.environ["FF_LEGACY_RUN_ID"]
          for position in os.environ["POSITIONS"].split():
              receipt = load_run_receipt(s3, bucket, prefix, source, position, run_id)
              if receipt.get("image_id") != os.environ["FF_TRAIN_IMAGE_ID"]:
                  raise RuntimeError("EC2 receipt image differs from the selected digest")
              with tempfile.TemporaryDirectory(prefix="verify-ec2-") as directory:
                  download_run_artifact(s3, bucket, prefix, source, position, run_id, Path(directory) / "model.tar.gz")
              print(f"Verified exact {position} artifact for {run_id}: {receipt['key']}")
          PYCODE

      - name: Append EC2 run to benchmark_history/
        # MUST run before "Refresh ECS service" — the benchmark append also
        # mirrors the JSON to s3://{bucket}/models/benchmark_history/ (see
        # src/batch/benchmark.py::_maybe_upload_to_s3). The new ECS task's
        # boot-time sync_benchmark_history_from_s3 reads that prefix, and
        # the in-container result is cached for the task's lifetime (cache
        # key is the dir mtime, which never bumps post-boot). Refreshing
        # ECS before the new JSON exists in S3 means the History tab won't
        # show this run until the next training run rolls the service.
        env:
          # gh defaults to GITHUB_TOKEN; the PROTECTED_PUSH_TOKEN PAT used
          # elsewhere is for `git push`, not API reads. Explicit here so a
          # future addition of `gh ...` commands inherits the right token.
          GH_TOKEN: ${{ github.token }}
          # src/batch/benchmark.py uploads each new history JSON to
          # s3://{FF_MODEL_S3_BUCKET}/{FF_MODEL_S3_PREFIX}/benchmark_history/
          # so the serving container can pull it at boot via
          # sync_benchmark_history_from_s3. The ECS task def hardcodes the
          # same names; mirroring the values here keeps the producer and
          # consumer in sync without a second config surface.
          FF_MODEL_S3_BUCKET: ${{ env.S3_BUCKET }}
          FF_MODEL_S3_PREFIX: ${{ env.FF_MODEL_S3_PREFIX }}
          POSITIONS: ${{ needs.detect.outputs.positions }}
          # Branch + head SHA come from a workflow_run trigger whose payload
          # is attacker-controllable (e.g. a fork that happens to share a
          # branch name). CodeQL flags any direct ${{ }} interpolation into a
          # ``run:`` block as a code-injection vector even when the upstream
          # path filters look safe; routing through env vars makes the value
          # a normal shell variable that downstream commands can quote.
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HEAD_SHA: ${{ steps.image.outputs.image_sha }}
          FF_TRAIN_GIT_SHA: ${{ steps.image.outputs.image_sha }}
          FF_TRAIN_IMAGE_ID: ${{ steps.image.outputs.image_uri }}
          FF_LEGACY_RUN_ID: "ec2:${{ github.run_id }}:${{ github.run_attempt }}"
        run: |
          # Resolve the PR number from the merge commit so the serving UI's
          # History tab can deep-link rows to GitHub. Direct pushes to main
          # and squash-merge edge cases return empty — accept that and fall
          # back to the SHA link client-side. Non-fatal: stay defensive so a
          # GitHub API blip doesn't abort the benchmark append.
          #
          # ``.[0]``: a commit can be referenced by multiple PRs (backport
          # branches, cherry-picks). We take the first, which is the merge
          # PR for this single-trunk repo's actual flow. Revisit if we
          # ever start backporting.
          PR_NUMBER=""
          if [ -n "$HEAD_SHA" ]; then
            PR_NUMBER=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
              --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          # Rebase before appending so a concurrent push doesn't reject us later.
          git fetch origin "$BRANCH"
          git pull --rebase origin "$BRANCH"
          PR_ARGS=()
          if [ -n "$PR_NUMBER" ]; then
            PR_ARGS=(--pr-number "$PR_NUMBER")
            echo "Resolved PR #$PR_NUMBER for $HEAD_SHA"
          else
            echo "No PR resolved for $HEAD_SHA (direct push or workflow_dispatch)"
          fi
          # ``--git-hash "$HEAD_SHA"``: pin the recorded SHA to the image
          # build SHA (``github.event.workflow_run.head_sha``), NOT
          # ``$GITHUB_SHA``. On a workflow_run trigger ``$GITHUB_SHA`` is the
          # run-LEVEL head_sha (current main HEAD when queued), which diverges
          # from the image-build SHA on rapid back-to-back merges. ``$HEAD_SHA``
          # is the stable image-build SHA that FF_TRAIN_GIT_SHA stamps into the
          # metrics, so the recorded git_hash matches benchmark.py's coherency
          # check. Manual dispatch uses the same explicitly selected image SHA.
          # No current-workspace HEAD fallback is permitted here; see
          # the TODO.md "Benchmark git_hash" archive entry for the failure mode.
          NOTE_SHA="$HEAD_SHA"
          NOTE_SHA="${NOTE_SHA::7}"
          # --instance-type is now a FALLBACK: src/batch/benchmark.py derives the
          # History-tab label at runtime from the gpu_name + cuda_graph_active
          # fields src/batch/train.py stamps into benchmark_metrics.json (the EC2
          # warm box is a g6/L4, sm_89 >= sm_80, so it derives
          # "...(L4, On-Demand, CUDA-graph)"). This value only shows if GPU
          # metadata is absent.
          python -m src.batch.benchmark \
            --download-only \
            --backend ec2 \
            --instance-type "g6.xlarge (On-Demand)" \
            --positions $POSITIONS \
            --note "EC2 auto-run (${NOTE_SHA})" \
            --git-hash "$HEAD_SHA" \
            "${PR_ARGS[@]}"

      - name: Commit and push benchmark_history/
        # Runs BEFORE the ECS refresh so a ``wait services-stable`` timeout
        # can't drop the in-repo benchmark record (the pre-pr freshness gate
        # reads the git copy, not just the S3 mirror). The refresh step below
        # keeps no continue-on-error, so a real ECS failure still fails the run.
        env:
          # Same env-indirection rationale as the previous step.
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HEAD_SHA: ${{ steps.image.outputs.image_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmark_history/
          if git diff --cached --quiet -- benchmark_history/; then
            echo "No history changes — skipping commit."
            exit 0
          fi
          staged=$(git diff --cached --name-only)
          unexpected=$(echo "$staged" | grep -v '^benchmark_history/' || true)
          if [ -n "$unexpected" ]; then
            echo "ERROR: unexpected staged paths (expected benchmark_history/ only):"
            echo "$unexpected"
            exit 1
          fi
          # Label with the image/head SHA the benchmark JSON pins, not the
          # run-level GITHUB_SHA (diverges on rapid merges) — keeps
          # `git log --grep <sha>` correlation intact.
          MSG_SHA="$HEAD_SHA"
          git commit -m "chore(ci): append EC2 benchmark run ${MSG_SHA::7}"
          for attempt in 1 2 3; do
            if git push origin HEAD:"refs/heads/$BRANCH"; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed — rebasing and retrying"
            git pull --rebase origin "$BRANCH"
          done
          echo "Push failed after 3 attempts"
          exit 1

      - name: Build and publish serving cache before rollout
        # Publish this identified run's approved models with its pinned canonical
        # data release before the serialized serving rollout.
        env:
          FF_MODEL_S3_BUCKET: ${{ env.S3_BUCKET }}
          FF_MODEL_S3_PREFIX: ${{ env.FF_MODEL_S3_PREFIX }}
          FF_TRAIN_GIT_SHA: ${{ steps.image.outputs.image_sha }}
          FF_TRAIN_IMAGE_ID: ${{ steps.image.outputs.image_uri }}
          FF_LEGACY_RUN_ID: "ec2:${{ github.run_id }}:${{ github.run_attempt }}"
          FF_BUILD_POSITIONS: ${{ needs.detect.outputs.positions }}
          FF_DEVICE: cpu
          FF_ALLOW_RUNTIME_INFERENCE: "1"
        run: python -m src.prediction.build_snapshot


  ecs_rollout:
    # A complete cache generation, its data release, and the deployed recipe
    # are verified together before changing ECS or ALB state.
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-fantasy-service
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Advance verified serving data release
        env:
          DATA_RELEASE: ${{ needs.train.outputs.data_release }}
        run: |
          python3 -m src.scripts.advance_data_release --bucket "$S3_BUCKET" \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --release-id "$DATA_RELEASE" \
            --state data-release-rollout.json --timeout 1200
      - name: Restore interrupted serving rollout
        if: failure() || cancelled()
        run: |
          if [ -f data-release-rollout.json ]; then
            python3 -m src.artifacts.deployment restore --state data-release-rollout.json
          fi
